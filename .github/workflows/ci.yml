name: ci

# The checks (buf lint, breaking, generated code, builds) and the secret scan run in TANK
# (.tank/checks.yaml, the "TANK checks" check run). This file only publishes the TypeScript
# package, with the workflow's own GitHub token.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-ts:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@tactical-agent-neural-knowledge"
      - name: version (canary on main, semver on tag)
        working-directory: gen/ts
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"; echo "TAG=latest" >> "$GITHUB_ENV"
          else
            npm version --no-git-tag-version "0.0.0-canary.${GITHUB_SHA::12}"; echo "TAG=canary" >> "$GITHUB_ENV"
          fi
      - working-directory: gen/ts
        run: npm install --no-audit --no-fund && npm run build
      - working-directory: gen/ts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish --access restricted --tag "$TAG"
