syntax = "proto3";

package tank.presence.v1;

import "google/protobuf/timestamp.proto";

enum PresenceStatus {
  PRESENCE_STATUS_UNSPECIFIED = 0;
  PRESENCE_STATUS_ACTIVE = 1;
  PRESENCE_STATUS_AWAY = 2;
  PRESENCE_STATUS_DND = 3;
  // Armor Mode: ambient messages are summarised; only critical alerts break through.
  PRESENCE_STATUS_ARMOR = 4;
}

message Presence {
  string user_id = 1;
  PresenceStatus status = 2;
  google.protobuf.Timestamp last_seen = 3;
  string custom_status_text = 4;
  string custom_status_emoji = 5;
  google.protobuf.Timestamp status_expires_at = 6;
  // When set, TANK answers anyone who @mentions this person with this text, on their behalf.
  string auto_reply = 7;
}

message SetStatusRequest {
  PresenceStatus status = 1;
  string custom_status_text = 2;
  string custom_status_emoji = 3;
  google.protobuf.Timestamp expires_at = 4;
  // When set, only this workspace's presence is written; otherwise every workspace the caller belongs to.
  string workspace_id = 5;
  // Answer @mentions with this text while the status lasts. Empty turns it off.
  string auto_reply = 6;
}
message SetStatusResponse {
  Presence presence = 1;
}

message GetPresenceRequest {
  repeated string user_ids = 1; // max 500
  // When set, presence is read from this workspace; otherwise from any workspace the caller shares with each user.
  string workspace_id = 2;
}
message GetPresenceResponse {
  repeated Presence presences = 1;
}

// "Deep in a Rust refactor until 3" → a status, an emoji, when it clears, and an auto-reply.
message DescribeStatusRequest {
  string description = 1; // at most 15 words
}
message DescribeStatusResponse {
  PresenceStatus status = 1;
  string custom_status_text = 2;
  string custom_status_emoji = 3;
  // Minutes from now until the status clears; 0 means it does not.
  int32 expires_in_minutes = 4;
  string auto_reply = 5;
}

service PresenceService {
  rpc SetStatus(SetStatusRequest) returns (SetStatusResponse);
  // Turns a sentence into a status to review before saving; nothing is written.
  rpc DescribeStatus(DescribeStatusRequest) returns (DescribeStatusResponse);
  rpc GetPresence(GetPresenceRequest) returns (GetPresenceResponse);
}
