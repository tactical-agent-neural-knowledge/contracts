syntax = "proto3";

package tank.files.v1;

import "google/protobuf/timestamp.proto";

enum ScanStatus {
  SCAN_STATUS_UNSPECIFIED = 0;
  SCAN_STATUS_PENDING = 1;
  SCAN_STATUS_CLEAN = 2;
  SCAN_STATUS_INFECTED = 3;
  SCAN_STATUS_FAILED = 4;
}

message File {
  string id = 1;
  string workspace_id = 2;
  string uploader_id = 3;
  string name = 4;
  string mime = 5;
  int64 size = 6;
  ScanStatus scan_status = 7;
  int32 width = 8;
  int32 height = 9;
  int64 duration_ms = 10;
  map<string, string> thumbnails = 11; // size -> signed URL
  google.protobuf.Timestamp created_at = 12;
  // Channels the file has been shared in (through messages) that the caller can see.
  repeated string shared_in_channel_ids = 13;
  string uploader_display_name = 14;
}

message CreateUploadRequest {
  string workspace_id = 1;
  string name = 2;
  string mime = 3;
  int64 size = 4;
  string channel_id = 5;
}
message CreateUploadResponse {
  File file = 1;
  string upload_url = 2;    // presigned PUT (single part)
  string upload_id = 3;     // multipart when set
  repeated string part_urls = 4;
  int64 part_size = 5;
}

message CompleteUploadRequest {
  string file_id = 1;
  string upload_id = 2;
  repeated string etags = 3;
}
message CompleteUploadResponse {
  File file = 1;
}

message GetDownloadUrlRequest {
  string file_id = 1;
}
message GetDownloadUrlResponse {
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// GetFile returns metadata for one file the caller may read (uploader, member
// of a channel it was shared in, or a workspace member for emoji / avatars).
message GetFileRequest {
  string file_id = 1;
}
message GetFileResponse {
  File file = 1;
}

// ListFiles pages the files the caller may read in a workspace, newest first;
// channel_id narrows to files shared in that channel (caller must be a member).
message ListFilesRequest {
  string workspace_id = 1;
  string channel_id = 2;
  string cursor = 3; // opaque
  int32 limit = 4;
}
message ListFilesResponse {
  repeated File files = 1;
  string next_cursor = 2;
}

service FilesService {
  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse);
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  rpc GetDownloadUrl(GetDownloadUrlRequest) returns (GetDownloadUrlResponse);
  rpc GetFile(GetFileRequest) returns (GetFileResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // Remove a file: its bytes, its record, and its place in every message that
  // carried it. The uploader may, and so may a workspace admin — a file
  // someone else attached is still the workspace's to take down.
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
}

message DeleteFileRequest {
  string file_id = 1;
}
message DeleteFileResponse {
  // The messages that carried the file, now without it. Clients replace their
  // copies so the chip disappears everywhere at once, not just where the
  // delete was pressed.
  repeated string message_ids = 1;
}
