syntax = "proto3";

package tank.catalog.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/tactical-agent-neural-knowledge/contracts/gen/go/tank/catalog/v1;catalogv1";

// CatalogService is the public face of the board: every product TANK is building,
// browsable by anyone, whether or not they have an account.
//
// Browsing is anonymous. Keeping a watch list, building a portfolio and buying are
// the things that need an account, and each says so rather than hiding the product
// behind a sign-in wall — somebody has to be able to see what is for sale before
// deciding they want one.

// ProductCard is a product as a list shows it. It carries what the card renders and
// what the sorts order by, so a list of fifty needs one query and no follow-ups.
message ProductCard {
  string workspace_id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  string industry = 5;                          // the trade it serves
  string buyer = 6;                             // who it is for
  int64 price_cents = 7;                        // what it costs to take over today
  // How far along it is. Agent minutes is the honest measure: it is what was spent
  // building the thing, and it is what the price is derived from.
  int64 agent_minutes = 8;
  int32 work_delivered = 9;                     // pieces of finished agent work
  bool agent_active = 10;                       // an agent is working in it now
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp last_worked_at = 12;
  bool available = 13;                          // nobody has taken it over yet
  bool watched = 14;                            // on the caller's watch list
  // Total visits to this product's page, all time. Every view counts, including
  // repeat visits and crawlers — it is a hit counter, not a headcount.
  int64 view_count = 15;
}

// The orders a person actually asks for, named after what they mean rather than the
// column they sort on, so the client never has to know that "furthest along" is
// agent minutes.
enum ProductSort {
  PRODUCT_SORT_UNSPECIFIED = 0;
  PRODUCT_SORT_NEWEST = 1;
  PRODUCT_SORT_FURTHEST_ALONG = 2;
  PRODUCT_SORT_CHEAPEST = 3;
  PRODUCT_SORT_MOST_EXPENSIVE = 4;
  PRODUCT_SORT_MOST_VIEWED = 5;
}

message ListProductsRequest {
  ProductSort sort = 1;
  string industry = 2;                          // one trade, or empty for all
  string query = 3;                             // matches name and description
  // Signed in only. A watch list nobody is signed in to see is empty, not an error.
  bool watched_only = 4;
  string portfolio_id = 5;                      // signed in: one portfolio's products
  string cursor = 6;
  int32 limit = 7;
}
message ListProductsResponse {
  repeated ProductCard products = 1;
  string next_cursor = 2;
  int32 total = 3;
  // The trades that actually have products, so the filter offers real choices rather
  // than a hard-coded list that drifts from what is on the board.
  repeated string industries = 4;
}

// Watching is a plain toggle rather than add/remove, because the button is a toggle
// and two RPCs would let the two disagree.
message WatchProductRequest {
  string workspace_id = 1;
  bool watched = 2;
}
message WatchProductResponse { ProductCard product = 1; }

// A portfolio is a named set of products somebody is following as a group.
message Portfolio {
  string id = 1;
  string name = 2;
  string note = 3;
  int32 product_count = 4;
  int64 value_cents = 5;                        // what taking over all of them costs
  google.protobuf.Timestamp created_at = 6;
}

message ListPortfoliosRequest {}
message ListPortfoliosResponse { repeated Portfolio portfolios = 1; }

message CreatePortfolioRequest {
  string name = 1;
  string note = 2;
}
message CreatePortfolioResponse { Portfolio portfolio = 1; }

message RenamePortfolioRequest {
  string id = 1;
  string name = 2;
  string note = 3;
}
message RenamePortfolioResponse { Portfolio portfolio = 1; }

message DeletePortfolioRequest { string id = 1; }
message DeletePortfolioResponse {}

// Membership is a toggle for the same reason watching is.
message SetPortfolioProductRequest {
  string portfolio_id = 1;
  string workspace_id = 2;
  bool included = 3;
}
message SetPortfolioProductResponse { Portfolio portfolio = 1; }

// Recording a view is anonymous and deliberately cheap: the page calls it once when
// it opens, and every call counts.
message RecordProductViewRequest {
  string slug = 1;
  // Where the visitor came from, as the browser reports it. Used only to bucket the
  // visit — assistant, search, social, direct — and never stored against a person.
  // The server decides the bucket; this is the raw value it decides from.
  string referrer = 2;
}
message RecordProductViewResponse {
  int64 view_count = 1;                         // the total after this call
}

// A number worth putting on a page, with enough around it to be quoted honestly.
message Stat {
  string key = 1;
  string label = 2;
  double value = 3;
  string unit = 4;          // "", "usd", "hours", "minutes", "products", "percent"
  // How many observations it rests on. Published next to every figure: a percentage
  // hiding a sample of twelve is how a data page stops being believed.
  int64 sample = 5;
  string note = 6;          // the method, in one line
}

// One row of a ranking — a vendor, an industry, a stack choice.
message Tally {
  string name = 1;
  int64 count = 2;
  double share = 3;         // 0..1 of the sample
}

message BoardStatsRequest {}

// The series behind the figures. Published for the same reason the figures are: a
// number somebody is invited to quote is worth more when they can see where it came
// from, and that it is not being quietly revised.
message BoardHistoryRequest {
  repeated string keys = 1;  // empty for every figure
  int32 days = 2;            // default 90, max 400
}
message BoardHistoryResponse {
  repeated Series series = 1;
}
message Series {
  string key = 1;
  repeated Point points = 2;
}
message Point {
  google.protobuf.Timestamp at = 1;
  double value = 2;
}
message BoardStatsResponse {
  google.protobuf.Timestamp computed_at = 1;
  repeated Stat headline = 2;       // the figures worth leading with
  repeated Stat all = 3;            // everything else
  repeated Tally industries = 4;    // products by industry
  repeated Tally stages = 5;        // which stages agents have completed
  repeated Tally sources = 6;       // where visits came from
  repeated Event recent = 7;        // the last few things that happened, newest first
  repeated Ranked most_visited = 8; // products people actually open
  repeated ToolMention tools = 9;   // software the agents name, and whether TANK does that job
}

// ToolMention is a third-party tool the agents named while planning businesses, how
// many of those businesses named it, and whether a TANK workspace already does that
// job today.
//
// The third field is the point. The first two say what software a business is assumed
// to run on; the third says how much of that assumption TANK already answers. Only
// what ships today is marked covered — a roadmap in this column would make the whole
// page an advertisement, and the page is only worth anything if it is not one.
message ToolMention {
  string name = 1;
  int64 products = 2;      // distinct products whose agents named it
  bool covered = 3;        // a TANK workspace does this job today
  string category = 4;     // "where the team talks", "accounting", …

  // A product the board is building to do this job. Empty when there is none.
  //
  // Separate from `covered` on purpose: covered means a TANK workspace does this
  // today, and a product being worked on is a weaker claim that deserves weaker
  // words. The page shows one as "Yes" and the other as a link and a percentage.
  string slug = 5;
  string product = 6;      // its name
  int32 stage = 7;         // how many stages of its journey are finished
  int32 total = 8;         // how many there are
}

// Event is one thing an agent finished, for a page that wants to look alive rather
// than merely be accurate. Additive: a client that does not know about it renders
// the figures exactly as before.
message Event {
  string product = 1;               // the product's name
  string slug = 2;                  // so the ticker can link
  string stage = 3;                 // which question it answered
  google.protobuf.Timestamp at = 4;
}

// Ranked is a product and a number, for a leaderboard.
message Ranked {
  string product = 1;
  string slug = 2;
  int64 value = 3;
  string industry = 4;
}

service CatalogService {
  // Aggregate numbers about the board. Counts and sums only: nothing from inside a
  // workspace, nothing that identifies anybody. Public, because the point is that
  // other people can quote it.
  rpc BoardStats(BoardStatsRequest) returns (BoardStatsResponse);
  rpc BoardHistory(BoardHistoryRequest) returns (BoardHistoryResponse);
  // Anonymous.
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc RecordProductView(RecordProductViewRequest) returns (RecordProductViewResponse);

  // Signed in.
  rpc WatchProduct(WatchProductRequest) returns (WatchProductResponse);
  rpc ListPortfolios(ListPortfoliosRequest) returns (ListPortfoliosResponse);
  rpc CreatePortfolio(CreatePortfolioRequest) returns (CreatePortfolioResponse);
  rpc RenamePortfolio(RenamePortfolioRequest) returns (RenamePortfolioResponse);
  rpc DeletePortfolio(DeletePortfolioRequest) returns (DeletePortfolioResponse);
  rpc SetPortfolioProduct(SetPortfolioProductRequest) returns (SetPortfolioProductResponse);
}
