syntax = "proto3";

package tank.events.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "tank/admin/v1/admin.proto";
import "tank/agent/v1/agent.proto";
import "tank/blocks/v1/blocks.proto";
import "tank/channel/v1/channel.proto";
import "tank/files/v1/files.proto";
import "tank/huddle/v1/huddle.proto";
import "tank/message/v1/message.proto";
import "tank/presence/v1/presence.proto";
import "tank/workspace/v1/workspace.proto";

// Every durable event on the bus and every realtime frame payload is one of
// these, wrapped in an Envelope. Subjects: evt.{ws}.ch.{channel},
// evt.{ws}.thread.{root}, evt.{ws}.user.{uid}, evt.{ws}.ws.
message Envelope {
  string id = 1;               // Nats-Msg-Id, idempotency key
  string workspace_id = 2;
  string type = 3;             // e.g. message.created
  string subject = 4;
  google.protobuf.Timestamp occurred_at = 5;
  string trace_parent = 6;
  google.protobuf.Any payload = 7;
}

message MessageCreated {
  tank.message.v1.Message message = 1;
}
message MessageUpdated {
  tank.message.v1.Message message = 1;
}
message MessageDeleted {
  string message_id = 1;
  string channel_id = 2;
  string thread_root_id = 3;
}
message ReactionAdded {
  string message_id = 1;
  string user_id = 2;
  string emoji = 3;
}
message ReactionRemoved {
  string message_id = 1;
  string user_id = 2;
  string emoji = 3;
}
message ReadStateUpdated {
  string user_id = 1;
  string channel_id = 2;
  int64 last_read_seq = 3;
  string thread_root_id = 4;
  int64 last_read_thread_seq = 5;
}
message ChannelUpdated {
  string channel_id = 1;
  // The channel after the change (name/topic/purpose/goal/archived_at).
  tank.channel.v1.Channel channel = 2;
}
message ChannelMembershipChanged {
  string channel_id = 1;
  string user_id = 2;
  bool joined = 3;
  string actor_id = 4; // who added or removed the member; empty when they acted on themselves
}
message CardAction {
  tank.blocks.v1.BlockAction action = 1;
}
message AppCommand {
  string command = 1; // e.g. tank
  string text = 2;
  string user_id = 3;
  string channel_id = 4;
  string thread_root_id = 5;
}
message PresenceChanged {
  tank.presence.v1.Presence presence = 1;
}
message Typing {
  string channel_id = 1;
  string user_id = 2;
  string thread_root_id = 3;
}
message AgentStatus {
  string channel_id = 1;
  string thread_root_id = 2;
  string run_id = 3;
  string status = 4; // "reading repo", "running tests", ...
}
// file.ready on evt.{ws}.user.{uploader}: the upload is verified and readable.
// Also published on evt.{ws}.ch.{channel} for every channel the file is
// shared in, and on evt.{ws}.thread.{root} when the sharing message is a reply.
message FileReady {
  tank.files.v1.File file = 1;
}
// message.ephemeral on evt.{ws}.user.{uid}: never stored, shown only to user_id.
message MessageEphemeral {
  tank.message.v1.Message message = 1;
  string user_id = 2;
}
// notifications.read on evt.{ws}.user.{uid}: cross-device badge sync.
message NotificationsRead {
  repeated string notification_ids = 1; // empty = every notification in the workspace
}
// agent.run.updated on evt.{ws}.thread.{root}: state, status message or cost changed.
message AgentRunUpdated {
  tank.agent.v1.Run run = 1;
}
message NotificationCreated {
  string notification_id = 1;
  string kind = 2;
  string message_id = 3;
  string channel_id = 4;
  string actor_id = 5;
}
// pin.changed on evt.{ws}.ch.{channel}.
message PinChanged {
  string message_id = 1;
  string channel_id = 2;
  string user_id = 3;
  bool pinned = 4;
}
// emoji.changed on evt.{ws}.ws: the custom emoji set changed; hash matches
// GetBootstrap.custom_emoji_hash after the change.
message EmojiChanged {
  tank.workspace.v1.CustomEmoji emoji = 1;
  bool deleted = 2;
  string hash = 3;
}
// preferences.updated on evt.{ws}.user.{uid}: cross-device sync.
message PreferencesUpdated {
  string user_id = 1;
  tank.workspace.v1.Preferences preferences = 2;
}
// channel_preference.updated on evt.{ws}.user.{uid}.
message ChannelPreferenceUpdated {
  string user_id = 1;
  tank.channel.v1.ChannelReadState read_state = 2;
}
// draft.updated on evt.{ws}.user.{uid}: cross-device draft sync.
message DraftUpdated {
  string user_id = 1;
  tank.workspace.v1.Draft draft = 2;
  bool deleted = 3;
}
// scheduled_message.sent on evt.{ws}.user.{uid}: the scheduler posted (or
// failed to post) a scheduled message; message.created follows on the channel.
message ScheduledMessageSent {
  tank.workspace.v1.ScheduledMessage scheduled = 1;
}
// user_group.updated on evt.{ws}.ws.
message UserGroupUpdated {
  tank.workspace.v1.UserGroup group = 1;
  bool deleted = 2;
}
// bookmark.changed on evt.{ws}.ch.{channel}.
message BookmarkChanged {
  tank.workspace.v1.ChannelBookmark bookmark = 1;
  bool removed = 2;
}
// member.updated on evt.{ws}.ws: a member changed their profile (display
// name, avatar, title, timezone).
message MemberUpdated {
  tank.workspace.v1.Member member = 1;
}
// huddle.started on evt.{ws}.ch.{channel} (and evt.{ws}.ws for public channels).
message HuddleStarted {
  tank.huddle.v1.Huddle huddle = 1;
}
// huddle.ended on the same subjects as huddle.started.
message HuddleEnded {
  tank.huddle.v1.Huddle huddle = 1;
}
// huddle.participants.changed on the same subjects: someone joined, left or
// (un)muted; huddle.participants is the full current list (sidebar indicator).
message HuddleParticipantsChanged {
  tank.huddle.v1.Huddle huddle = 1;
}
// member.role_changed on evt.{ws}.ws and on the member's user subject.
message MemberRoleChanged {
  tank.workspace.v1.Member member = 1;
  tank.workspace.v1.Role previous_role = 2;
  string actor_id = 3;
}
// member.deactivated on evt.{ws}.ws (also for reactivation and removal;
// clients drop removed members and grey out deactivated ones).
message MemberDeactivated {
  tank.workspace.v1.Member member = 1;
  bool reactivated = 2;
  bool removed = 3;
  string actor_id = 4;
}
// workspace.settings_updated on evt.{ws}.ws.
message WorkspaceSettingsUpdated {
  tank.admin.v1.WorkspaceSettings settings = 1;
  string actor_id = 2;
}
// audit.logged on evt.{ws}.audit.{entry}: internal (SIEM forwarders, the
// knowledge indexer); the gateway never fans it out to clients.
message AuditLogged {
  tank.admin.v1.AuditEntry entry = 1;
}
// export.ready on the requester's user subject: the zip can be downloaded
// with AdminService.GetExportDownloadUrl (also sent when the job failed).
message ExportReady {
  tank.admin.v1.ExportJob job = 1;
}
