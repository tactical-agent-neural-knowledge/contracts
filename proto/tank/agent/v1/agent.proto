syntax = "proto3";

package tank.agent.v1;

import "google/protobuf/timestamp.proto";

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_REQUESTED = 1;
  RUN_STATE_ADMITTED = 2;
  RUN_STATE_PROVISIONING = 3;
  RUN_STATE_PLANNING = 4;
  RUN_STATE_AWAITING_PLAN_APPROVAL = 5;
  RUN_STATE_IMPLEMENTING = 6;
  RUN_STATE_PUSHED = 7;
  RUN_STATE_CI_WATCHING = 8;
  RUN_STATE_PR_OPEN = 9;
  RUN_STATE_AWAITING_MERGE_APPROVAL = 10;
  RUN_STATE_MERGED = 11;
  RUN_STATE_VERIFYING_DEPLOY = 12;
  RUN_STATE_DONE = 13;
  RUN_STATE_CANCELLED = 14;
  RUN_STATE_FAILED = 15;
  RUN_STATE_BUDGET_EXHAUSTED = 16;
  RUN_STATE_TIMED_OUT = 17;
  RUN_STATE_APPROVAL_EXPIRED = 18;
}

message Agent {
  string id = 1;
  string workspace_id = 2;
  string principal_id = 3; // the agent's user row
  string name = 4;
  repeated string scopes = 5;
}

message Run {
  string id = 1;
  string workspace_id = 2;
  string channel_id = 3;
  string thread_root_id = 4;
  string agent_id = 5;
  string requested_by = 6;
  RunState state = 7;
  string branch = 8;
  string pr_url = 9;
  double cost_usd = 10;
  string status_message_id = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp ended_at = 13;
  string plan_hash = 14;       // hash of the approved plan, set by the control plane
  string pending_gate_id = 15; // gate the run is blocked on, if any
}

message StartRunRequest {
  string thread_root_id = 1;
  string agent_id = 2;
  string instructions = 3;
  // Who summoned the agent. The control plane calls this as a bot whose
  // principal is the agent itself, and an agent is not a member of a private
  // Tread until it is brought in, so the caller cannot be the authority on
  // access. This person must be a member of the channel; their membership is
  // what permits the run and what adds the agent to the Tread.
  string requested_by = 4;
}
message StartRunResponse {
  Run run = 1;
  // Agent-session token scoped to this thread; TTL = max run duration.
  string agent_session_token = 2;
  google.protobuf.Timestamp token_expires_at = 3;
}

message StopRunRequest {
  string run_id = 1;
  string reason = 2;
}
message StopRunResponse {
  Run run = 1;
}

message HeartbeatRequest {
  string run_id = 1;
}
message HeartbeatResponse {}

message SetStatusRequest {
  string run_id = 1;
  RunState state = 2;
  string status = 3; // human-readable, shown like typing
  string branch = 4;
  string pr_url = 5;
  double cost_usd = 6;
}
message SetStatusResponse {
  Run run = 1;
}

// SetProductBrand gives a product its mark and palette, from the run working in it.
message SetProductBrandRequest {
  string run_id = 1;
  string icon_svg = 2;      // viewBox 0 0 64 64; sanitised on the way in
  string primary = 3;       // hex colours
  string secondary = 4;
  string background = 5;
  string accent = 6;
  string tagline = 7;
}
message SetProductBrandResponse {
  string icon_url = 1;      // where the catalogue serves it
}
// SetProductLanding stores the product's landing page, sanitised, for its catalogue page.
message SetProductLandingRequest {
  string run_id = 1;
  string html = 2;
}
message SetProductLandingResponse {}

// RecordProductFinding stores one structured research fact about an existing tool,
// from a run on a product of the board. See agentctl.RecordFinding for the fields.
message RecordProductFindingRequest {
  string run_id = 1;
  string tool = 2;
  string kind = 3;
  string value = 4;
  double amount = 5;
  string unit = 6;
  string quote = 7;
  string url = 8;
}
message RecordProductFindingResponse {}

message GetRunRequest {
  string run_id = 1;
}
message GetRunResponse {
  Run run = 1;
}

message ListRunsRequest {
  string workspace_id = 1;
  string channel_id = 2;
  string thread_root_id = 3;
  string cursor = 4;
  int32 limit = 5;
}
message ListRunsResponse {
  repeated Run runs = 1;
  string next_cursor = 2;
}

message ListAgentsRequest {
  string workspace_id = 1;
}
message ListAgentsResponse {
  repeated Agent agents = 1;
}


// What a Tread knows about GitHub: whether the workspace is connected at all, what
// that installation can reach, and which repository this Tread works on.
message RepoBinding {
  string repo = 1;        // owner/name
  string base_branch = 2; // default "main"
  string toolchain = 3;   // node | go | python | expo
}

message RepoConnection {
  bool connected = 1;             // the workspace has a GitHub installation
  string account_login = 2;       // the org it is installed into
  repeated string repos = 3;      // what that installation can reach
  RepoBinding binding = 4;        // this Tread's binding, absent when unbound
  bool can_manage = 5;            // the caller may connect and bind: workspace admins only
}

message GetRepoConnectionRequest { string channel_id = 1; }
message GetRepoConnectionResponse { RepoConnection connection = 1; }

// StartGitHubConnect mints the one-time state GitHub carries through an install and
// returns where to send somebody. Admins only.
message StartGitHubConnectRequest { string workspace_id = 1; }
message StartGitHubConnectResponse { string install_url = 1; }

message BindRepoRequest {
  string channel_id = 1;
  string repo = 2;
  string base_branch = 3; // empty means "main"
  string toolchain = 4;   // empty means "node"
}
message BindRepoResponse { RepoBinding binding = 1; }

message UnbindRepoRequest { string channel_id = 1; }
message UnbindRepoResponse {}

service AgentService {
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc StopRun(StopRunRequest) returns (StopRunResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc SetStatus(SetStatusRequest) returns (SetStatusResponse);
  // A product's brand and landing page, set by the run working in it (an agenture only).
  rpc SetProductBrand(SetProductBrandRequest) returns (SetProductBrandResponse);
  rpc SetProductLanding(SetProductLandingRequest) returns (SetProductLandingResponse);
  rpc RecordProductFinding(RecordProductFindingRequest) returns (RecordProductFindingResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);

  // Connecting a Tread to code. A Radar is private and so is this: only workspace
  // admins may connect an org or bind a repository.
  rpc GetRepoConnection(GetRepoConnectionRequest) returns (GetRepoConnectionResponse);
  rpc StartGitHubConnect(StartGitHubConnectRequest) returns (StartGitHubConnectResponse);
  rpc BindRepo(BindRepoRequest) returns (BindRepoResponse);
  rpc UnbindRepo(UnbindRepoRequest) returns (UnbindRepoResponse);
}
