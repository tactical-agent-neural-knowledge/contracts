syntax = "proto3";

package tank.agent.v1;

import "google/protobuf/timestamp.proto";

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_REQUESTED = 1;
  RUN_STATE_ADMITTED = 2;
  RUN_STATE_PROVISIONING = 3;
  RUN_STATE_PLANNING = 4;
  RUN_STATE_AWAITING_PLAN_APPROVAL = 5;
  RUN_STATE_IMPLEMENTING = 6;
  RUN_STATE_PUSHED = 7;
  RUN_STATE_CI_WATCHING = 8;
  RUN_STATE_PR_OPEN = 9;
  RUN_STATE_AWAITING_MERGE_APPROVAL = 10;
  RUN_STATE_MERGED = 11;
  RUN_STATE_VERIFYING_DEPLOY = 12;
  RUN_STATE_DONE = 13;
  RUN_STATE_CANCELLED = 14;
  RUN_STATE_FAILED = 15;
  RUN_STATE_BUDGET_EXHAUSTED = 16;
  RUN_STATE_TIMED_OUT = 17;
  RUN_STATE_APPROVAL_EXPIRED = 18;
}

message Agent {
  string id = 1;
  string workspace_id = 2;
  string principal_id = 3; // the agent's user row
  string name = 4;
  repeated string scopes = 5;
}

message Run {
  string id = 1;
  string workspace_id = 2;
  string channel_id = 3;
  string thread_root_id = 4;
  string agent_id = 5;
  string requested_by = 6;
  RunState state = 7;
  string branch = 8;
  string pr_url = 9;
  double cost_usd = 10;
  string status_message_id = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp ended_at = 13;
  string plan_hash = 14;       // hash of the approved plan, set by the control plane
  string pending_gate_id = 15; // gate the run is blocked on, if any
}

message StartRunRequest {
  string thread_root_id = 1;
  string agent_id = 2;
  string instructions = 3;
  // Who summoned the agent. The control plane calls this as a bot whose
  // principal is the agent itself, and an agent is not a member of a private
  // Tread until it is brought in, so the caller cannot be the authority on
  // access. This person must be a member of the channel; their membership is
  // what permits the run and what adds the agent to the Tread.
  string requested_by = 4;
}
message StartRunResponse {
  Run run = 1;
  // Agent-session token scoped to this thread; TTL = max run duration.
  string agent_session_token = 2;
  google.protobuf.Timestamp token_expires_at = 3;
}

message StopRunRequest {
  string run_id = 1;
  string reason = 2;
}
message StopRunResponse {
  Run run = 1;
}

message HeartbeatRequest {
  string run_id = 1;
}
message HeartbeatResponse {}

message SetStatusRequest {
  string run_id = 1;
  RunState state = 2;
  string status = 3; // human-readable, shown like typing
  string branch = 4;
  string pr_url = 5;
  double cost_usd = 6;
}
message SetStatusResponse {
  Run run = 1;
}

// SetProductBrand gives a product its mark and palette, from the run working in it.
message SetProductBrandRequest {
  string run_id = 1;
  string icon_svg = 2;      // viewBox 0 0 64 64; sanitised on the way in
  string primary = 3;       // hex colours
  string secondary = 4;
  string background = 5;
  string accent = 6;
  string tagline = 7;
}
message SetProductBrandResponse {
  string icon_url = 1;      // where the catalogue serves it
}
// SetProductLanding stores the product's landing page, sanitised, for its catalogue page.
message SetProductLandingRequest {
  string run_id = 1;
  string html = 2;
}
message SetProductLandingResponse {}

// RecordProductFinding stores one structured research fact about an existing tool,
// from a run on a product of the board. See agentctl.RecordFinding for the fields.
message RecordProductFindingRequest {
  string run_id = 1;
  string tool = 2;
  string kind = 3;
  string value = 4;
  double amount = 5;
  string unit = 6;
  string quote = 7;
  string url = 8;
}
message RecordProductFindingResponse {}

message GetRunRequest {
  string run_id = 1;
}
message GetRunResponse {
  Run run = 1;
}

message ListRunsRequest {
  string workspace_id = 1;
  string channel_id = 2;
  string thread_root_id = 3;
  string cursor = 4;
  int32 limit = 5;
}
message ListRunsResponse {
  repeated Run runs = 1;
  string next_cursor = 2;
}

message ListAgentsRequest {
  string workspace_id = 1;
}
message ListAgentsResponse {
  repeated Agent agents = 1;
}


// What a Tread knows about GitHub: whether the workspace is connected at all, what
// that installation can reach, and which repository this Tread works on.
message RepoBinding {
  string repo = 1;        // owner/name
  string base_branch = 2; // default "main"
  string toolchain = 3;   // node | go | python | expo
}

// RepoAccess is one further repository a Tread's agent may reach, and how far. The
// primary repository (RepoBinding) is where runs branch and open pull requests and
// is always writable; these are the others: "read" to clone and study, "write" to
// push branches and open pull requests there too.
message RepoAccess {
  string repo = 1;   // owner/name
  string access = 2; // read | write
}

message RepoConnection {
  bool connected = 1;             // the workspace has a GitHub installation
  string account_login = 2;       // the org it is installed into
  repeated string repos = 3;      // what that installation can reach
  RepoBinding binding = 4;        // this Tread's binding, absent when unbound
  bool can_manage = 5;            // the caller may connect and bind: workspace admins only
  repeated RepoAccess access = 6; // the further repositories this Tread may reach
  // Premium workspaces may ask TANK for a repository and hosting; both are requests an
  // admin makes, never a side effect of anything else.
  bool premium = 7;
  bool hosting_available = 8;     // the platform can create repositories and host them right now
  TreadDeployment deployment = 9; // present once TANK made this Tread's repository
}

// SetRepoAccess replaces the Tread's list of further repositories. Admins only; every
// repository must be one the workspace's installation can reach, and the primary is
// not listed here (it is always writable).
message SetRepoAccessRequest {
  string channel_id = 1;
  repeated RepoAccess access = 2;
}
message SetRepoAccessResponse { repeated RepoAccess access = 1; }

// Previews for repositories the workspace has already connected.
//
// TANK serves previews of the applications it builds; a workspace that builds its own
// tells TANK where it put each build (BoardService.ReportPreview) and a frame points
// at that. Handing somebody a snippet and wishing them luck is the weak half of that
// trade: if the workspace has connected GitHub and TANK can reach the repository, TANK
// can open the pull request itself.
//
// It is a pull request and never a push: a workflow file in somebody else's repository
// is their decision. Several repositories at once, because a workspace that connects a
// front end and an API wants a frame of each, and one failing must not stop the rest.
message SetUpRepoPreviewsRequest {
  string workspace_id = 1;
  repeated string repos = 2;  // owner/name each; one pull request per repository
  // The branch each pull request targets. Empty means each repository's own default,
  // which is nearly always the right answer and the only one TANK can work out.
  string base_branch = 3;
  // Issue a new token and revoke the one before it. The token is shown once and is
  // not readable afterwards, so rotating is the only way back from losing it.
  bool rotate_token = 4;
}

// What happened for one repository. A repository that could not be set up carries its
// own sentence saying why; the others are unaffected by it.
message RepoPreviewSetup {
  string repo = 1;
  // opened | already_open | refused. "already_open" is the idempotent answer: the
  // pull request was there from an earlier ask and no second one was opened.
  string status = 2;
  string pull_request_url = 3;
  string branch = 4;          // the head branch TANK pushed the workflow to
  string workflow_path = 5;   // where the file sits in the pull request
  string reason = 6;          // why it was refused, in a sentence; empty otherwise
  google.protobuf.Timestamp requested_at = 7;
}

message SetUpRepoPreviewsResponse {
  repeated RepoPreviewSetup results = 1;
  // The token the repositories' CI authenticates with, returned exactly once and
  // never readable again. Empty when a token had already been issued and
  // rotate_token was not set. One token for the workspace, not one per repository:
  // the same secret name goes in every repository.
  string token = 2;
  string secret_name = 3;
  bool token_issued = 4;      // a token exists, whether or not it is in this response
  // What the workspace still has to do by hand, in plain words, so a client can show
  // it without knowing any of this.
  repeated string next_steps = 5;
}

// What has been set up already, so a board's settings can show it without asking TANK
// to open anything.
message ListRepoPreviewSetupsRequest { string workspace_id = 1; }
message ListRepoPreviewSetupsResponse {
  repeated RepoPreviewSetup setups = 1;
  string secret_name = 2;
  bool token_issued = 3;
}

// The Tread's switchboard: what its agents cost and did, by the hour, and the knobs a
// workspace admin turns. Spend is the workspace's own: the workspace pays for its agents.
message TreadSettings {
  int32 concurrent_runs = 1;     // agents at once in this Tread, 1..5
  bool auto_accept_plans = 2;    // skip the plan gate: the agent goes straight from plan to work
  double max_run_usd = 3;        // a single run's ceiling; 0 keeps the workspace default
  double daily_usd = 4;          // this Tread's ceiling for a day; 0 keeps the workspace default
  // What happens to a pull request the agent opens: "review" (default) posts it and
  // mentions pr_reviewer_ids in the thread; "merge_when_green" has TANK watch the
  // checks and merge it, so the agent's work keeps flowing without a person.
  string pull_requests = 5;
  repeated string pr_reviewer_ids = 6; // user ids mentioned when a pull request is ready
  // Whether runs in this Tread read the repository's Neural Knowledge and record what
  // they learn. On by default; the server always sets it.
  bool read_neural_knowledge = 7;
}
message HourBucket {
  google.protobuf.Timestamp hour = 1;
  int32 runs = 2;
  double spend_usd = 3;
}
message TreadMetrics {
  double spend_today_usd = 1;
  double spend_month_usd = 2;
  int32 runs_today = 3;
  int32 runs_month = 4;
  double success_rate_30d = 5;        // 0..1, done or delivered over finished runs
  repeated HourBucket hours = 6;      // the last twenty-four hours, oldest first
  double workspace_spend_today_usd = 7;
  double workspace_spend_month_usd = 8;
  int32 running_now = 9;
  double avg_run_minutes_30d = 10;
}
message GetTreadSwitchboardRequest { string channel_id = 1; }
message GetTreadSwitchboardResponse {
  TreadMetrics metrics = 1;
  TreadSettings settings = 2;
  bool can_manage = 3;
}
message SetTreadSettingsRequest {
  string channel_id = 1;
  TreadSettings settings = 2;
}
message SetTreadSettingsResponse { TreadSettings settings = 1; }

message GetRepoConnectionRequest { string channel_id = 1; }
message GetRepoConnectionResponse { RepoConnection connection = 1; }

// StartGitHubConnect mints the one-time state GitHub carries through an install and
// returns where to send somebody. Admins only.
message StartGitHubConnectRequest { string workspace_id = 1; }
message StartGitHubConnectResponse { string install_url = 1; }

message BindRepoRequest {
  string channel_id = 1;
  string repo = 2;
  string base_branch = 3; // empty means "main"
  string toolchain = 4;   // empty means "node"
}
message BindRepoResponse { RepoBinding binding = 1; }

message UnbindRepoRequest { string channel_id = 1; }
message UnbindRepoResponse {}

// A Tread's hosting on TANK's own cluster: the repository TANK generated for it and
// whether the app built from it is awake at its URL.
message TreadDeployment {
  string slug = 1;   // <slug>.tank.chat and the repository agenture-<slug>
  string repo = 2;   // owner/name
  string url = 3;    // https://<slug>.tank.chat
  bool awake = 4;    // running (1 replica) or asleep (0); builds never wake it
  google.protobuf.Timestamp updated_at = 5;
  bool managed = 6;            // TANK generated the repository; otherwise it is the workspace's own
  bool workflow_present = 7;   // the repository carries .github/workflows/tank.yml on its default branch
  string image_tag = 8;        // empty until the first build on main has landed
  string workflow_snippet = 9; // the workflow file to add, for a repository the workspace brought
}
// CreateTreadRepo asks TANK to generate a repository for this Tread from its template, in
// TANK's organization, and bind it. Premium workspaces, admins only, one per Tread.
message CreateTreadRepoRequest { string channel_id = 1; }
message CreateTreadRepoResponse {
  RepoBinding binding = 1;
  TreadDeployment deployment = 2;
}
// SetTreadDeployment wakes the Tread's app on TANK's cluster or puts it to sleep.
message SetTreadDeploymentRequest {
  string channel_id = 1;
  bool awake = 2;
}
message SetTreadDeploymentResponse { TreadDeployment deployment = 1; }

// Crew: a workspace's standing swarm of specialized agents, configured once per
// workspace rather than per Tread the way TreadSettings is. Whoever can manage a
// workspace's Switchboard can also shape its crew: which roles are on it and how
// its resources split across the business right now.
message CrewMember {
  string id = 1;
  string workspace_id = 2;
  string role = 3;  // bookkeeping | boards | scheduling | code | comms | ... ; an open set
  string label = 4; // a human name for this member, e.g. "Books"
  bool enabled = 5;
  google.protobuf.Timestamp added_at = 6;
}

// One business area's share of the crew's resources. Areas are open strings, not
// an enum, because they are whatever the workspace calls its own parts of the
// business; weights across all areas sum to 100.
message CrewAllocation {
  string area = 1;
  int32 weight = 2; // 0..100
}

message CrewSettings {
  repeated CrewAllocation allocation = 1; // how resources split across the business right now
  int32 concurrent_runs = 2;              // crew-wide concurrency cap; 0 keeps the workspace default
  double daily_usd = 3;                   // crew-wide daily ceiling; 0 keeps the workspace default
  bool auto_accept_plans = 4;
}

message GetWorkspaceCrewRequest { string workspace_id = 1; }
message GetWorkspaceCrewResponse {
  repeated CrewMember members = 1;
  CrewSettings settings = 2;
  TreadMetrics metrics = 3; // same shape as the Switchboard's: spend and runs, workspace-wide
  bool can_manage = 4;
}

// AddCrewMember brings one more specialized agent onto the workspace's crew.
message AddCrewMemberRequest {
  string workspace_id = 1;
  string role = 2;
  string label = 3;
}
message AddCrewMemberResponse { CrewMember member = 1; }

// RemoveCrewMember takes one off. The run machinery underneath is unaffected:
// this only changes who is standing by to be summoned.
message RemoveCrewMemberRequest {
  string workspace_id = 1;
  string member_id = 2;
}
message RemoveCrewMemberResponse {}

message SetCrewSettingsRequest {
  string workspace_id = 1;
  CrewSettings settings = 2;
}
message SetCrewSettingsResponse { CrewSettings settings = 1; }

service AgentService {
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc StopRun(StopRunRequest) returns (StopRunResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc SetStatus(SetStatusRequest) returns (SetStatusResponse);
  // A product's brand and landing page, set by the run working in it (an agenture only).
  rpc SetProductBrand(SetProductBrandRequest) returns (SetProductBrandResponse);
  rpc SetProductLanding(SetProductLandingRequest) returns (SetProductLandingResponse);
  rpc RecordProductFinding(RecordProductFindingRequest) returns (RecordProductFindingResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);

  // Connecting a Tread to code. A Radar is private and so is this: only workspace
  // admins may connect an org or bind a repository.
  rpc GetRepoConnection(GetRepoConnectionRequest) returns (GetRepoConnectionResponse);
  rpc StartGitHubConnect(StartGitHubConnectRequest) returns (StartGitHubConnectResponse);
  rpc BindRepo(BindRepoRequest) returns (BindRepoResponse);
  rpc UnbindRepo(UnbindRepoRequest) returns (UnbindRepoResponse);
  rpc SetRepoAccess(SetRepoAccessRequest) returns (SetRepoAccessResponse);
  // Repositories and hosting on request, for premium workspaces.
  rpc CreateTreadRepo(CreateTreadRepoRequest) returns (CreateTreadRepoResponse);
  rpc SetTreadDeployment(SetTreadDeploymentRequest) returns (SetTreadDeploymentResponse);
  // Previews for repositories the workspace has already connected: TANK opens a pull
  // request in each one adding the workflow that reports its builds, and hands back the
  // token that CI will need. Admins only, premium only, never a side effect.
  rpc SetUpRepoPreviews(SetUpRepoPreviewsRequest) returns (SetUpRepoPreviewsResponse);
  rpc ListRepoPreviewSetups(ListRepoPreviewSetupsRequest) returns (ListRepoPreviewSetupsResponse);
  // The Tread's switchboard: metrics for members, settings for admins.
  rpc GetTreadSwitchboard(GetTreadSwitchboardRequest) returns (GetTreadSwitchboardResponse);
  rpc SetTreadSettings(SetTreadSettingsRequest) returns (SetTreadSettingsResponse);

  // The workspace's crew: one swarm per workspace, reachable from any Tread with
  // @crew. Unlike the switchboard above, membership and resource allocation are
  // workspace-wide, not per-Tread.
  rpc GetWorkspaceCrew(GetWorkspaceCrewRequest) returns (GetWorkspaceCrewResponse);
  rpc AddCrewMember(AddCrewMemberRequest) returns (AddCrewMemberResponse);
  rpc RemoveCrewMember(RemoveCrewMemberRequest) returns (RemoveCrewMemberResponse);
  rpc SetCrewSettings(SetCrewSettingsRequest) returns (SetCrewSettingsResponse);
}
