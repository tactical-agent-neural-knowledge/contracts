syntax = "proto3";

package tank.agent.v1;

import "google/protobuf/timestamp.proto";

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_REQUESTED = 1;
  RUN_STATE_ADMITTED = 2;
  RUN_STATE_PROVISIONING = 3;
  RUN_STATE_PLANNING = 4;
  RUN_STATE_AWAITING_PLAN_APPROVAL = 5;
  RUN_STATE_IMPLEMENTING = 6;
  RUN_STATE_PUSHED = 7;
  RUN_STATE_CI_WATCHING = 8;
  RUN_STATE_PR_OPEN = 9;
  RUN_STATE_AWAITING_MERGE_APPROVAL = 10;
  RUN_STATE_MERGED = 11;
  RUN_STATE_VERIFYING_DEPLOY = 12;
  RUN_STATE_DONE = 13;
  RUN_STATE_CANCELLED = 14;
  RUN_STATE_FAILED = 15;
  RUN_STATE_BUDGET_EXHAUSTED = 16;
  RUN_STATE_TIMED_OUT = 17;
  RUN_STATE_APPROVAL_EXPIRED = 18;
  // Stopped at a guardrail it cannot meet, waiting for the guardrail to change or the run
  // to be stopped. Not terminal: the run's branch and session are kept.
  RUN_STATE_BLOCKED = 19;
  // Held for an answer to a question the agent asked in the thread. Not terminal: the
  // answer goes in the thread and the run carries on. Before this value the control plane
  // reported such a run as RUN_STATE_AWAITING_PLAN_APPROVAL, so a client read "waiting for
  // your go on the plan" for a run that had no plan waiting.
  RUN_STATE_AWAITING_ANSWER = 20;
}

message Agent {
  string id = 1;
  string workspace_id = 2;
  string principal_id = 3; // the agent's user row
  string name = 4;
  repeated string scopes = 5;
  // A Crew member's title and skill (tank.crew.v1); empty for the workspace agent.
  string title = 6;
  string skill = 7;
  // Which kind of principal this is. A client draws and gates an agent from this, never
  // from its name or handle.
  AgentKind kind = 8;
  // The one model this agent runs on, when model_pinned is set (e.g. "tank-neural-1").
  // Empty for an agent that uses the Tread's policy ladder.
  string model = 9;
  // True means the model above is the only model the agent may use: no ladder, no
  // default-model routing, no escalation to a stronger model, no subagent model and no
  // fallback when it is not being served (the run is refused with
  // RUN_REFUSAL_REASON_MODEL_UNAVAILABLE). TreadSettings.model and TreadSettings.strongest_model
  // are ignored for a pinned agent; the pin is never overridable by Tread or workspace settings.
  bool model_pinned = 10;
  // The lowest plan that may run this agent: "" for any plan, "premium" for premium only.
  // StartRun checks it server-side; a free workspace is refused with
  // RUN_REFUSAL_REASON_PREMIUM_ONLY_AGENT and no trial run is spent.
  string min_plan = 11;
}

// What an agent principal is. @neural is the agent of kind AGENT_KIND_NEURAL: it resolves to
// that principal in any Tread of a workspace that has it, whatever the workspace's Crew or
// Ops handles are. It is the same on web, desktop and mobile: it appears in the mention
// picker when workspace.v1.Entitlements.neural_agent is true, is shown as the Neural agent
// with its pinned model name, and a refusal renders the same typed message and button on
// every surface.
enum AgentKind {
  AGENT_KIND_UNSPECIFIED = 0;  // the workspace agent, or a client that predates this field
  AGENT_KIND_WORKSPACE = 1;    // the workspace's own agent (@tank)
  AGENT_KIND_CREW = 2;         // a Crew member (tank.crew.v1)
  AGENT_KIND_NEURAL = 3;       // the built-in Neural agent: premium, pinned to the Neural model
}

message Run {
  string id = 1;
  string workspace_id = 2;
  string channel_id = 3;
  string thread_root_id = 4;
  string agent_id = 5;
  string requested_by = 6;
  RunState state = 7;
  string branch = 8;
  string pr_url = 9;
  double cost_usd = 10;
  string status_message_id = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp ended_at = 13;
  string plan_hash = 14;       // hash of the approved plan, set by the control plane
  string pending_gate_id = 15; // gate the run is blocked on, if any
  // True when the run took a sandbox prepared from the composer draft instead of
  // provisioning one, so a client and the metrics can tell a warm start from a cold one.
  bool prepared = 16;
  // Delay breakdown, so the wait before the first reply is measured per workspace.
  // acked_at: the immediate acknowledgement was posted. sandbox_ready_at: the sandbox
  // could take work. first_reply_at: the first reply with content (not the ack) was posted.
  google.protobuf.Timestamp acked_at = 17;
  google.protobuf.Timestamp sandbox_ready_at = 18;
  google.protobuf.Timestamp first_reply_at = 19;
  // When the run entered its current state: a strip shows how long a run has waited on a
  // person ("waiting since 7:38") rather than its whole age (cache7, 2026-11-24: "3h 04m"
  // under a merge waiting for a yes).
  google.protobuf.Timestamp state_changed_at = 20;
}

message StartRunRequest {
  string thread_root_id = 1;
  string agent_id = 2;
  string instructions = 3;
  // Who summoned the agent. The control plane calls this as a bot whose
  // principal is the agent itself, and an agent is not a member of a private
  // Tread until it is brought in, so the caller cannot be the authority on
  // access. This person must be a member of the channel; their membership is
  // what permits the run and what adds the agent to the Tread.
  string requested_by = 4;
  // The run that handed this one its work (an Ops team hand-off), by the core's id of
  // that run; empty for a run a person started. Spend attributes the child to the same
  // person, and the tree hangs off this.
  string parent_run_id = 5;
  // The preparation id from the sender's Draft (tank.workspace.v1.Draft.preparation_id).
  // When it names a live preparation for this thread and agent, the run adopts that warm
  // sandbox; when it is empty, expired or cancelled the run provisions one as before.
  string preparation_id = 6;
}
message StartRunResponse {
  Run run = 1;
  // Agent-session token scoped to this thread; TTL = max run duration.
  string agent_session_token = 2;
  google.protobuf.Timestamp token_expires_at = 3;
  // Set instead of run when the workspace may not start a run: the typed reason, so the
  // reply and its button are the same on every client. A refusal is a normal answer, not
  // an error.
  RunRefusal refusal = 4;
  // The thread message posted the moment the run row exists, before the talker call or
  // planning, so the person sees a reply at once. Empty when no acknowledgement was posted.
  string ack_message_id = 5;
}

enum RunRefusalReason {
  RUN_REFUSAL_REASON_UNSPECIFIED = 0;
  // The workspace is on the free plan; agent time needs premium.
  RUN_REFUSAL_REASON_FREE_PLAN = 1;
  // Prepaid agent time is spent and no auto-refill covered it.
  RUN_REFUSAL_REASON_OUT_OF_FUNDS = 2;
  // A free workspace mentioned an agent whose min_plan is "premium" (@neural). The action is
  // UPGRADE, the same button as FREE_PLAN, and no free trial run is spent on it. StartRun
  // checks min_plan server-side. Out-of-funds and low-funds behaviour is unchanged: a premium
  // workspace with no agent time left is refused with OUT_OF_FUNDS as for any agent.
  RUN_REFUSAL_REASON_PREMIUM_ONLY_AGENT = 3;
  // The agent is pinned to a model that is not being served right now. The run is refused with
  // no action; it never falls back to another model.
  RUN_REFUSAL_REASON_MODEL_UNAVAILABLE = 4;
}

enum RunRefusalAction {
  RUN_REFUSAL_ACTION_UNSPECIFIED = 0;
  // The button opens BillingService.StartUpgradeCheckout.
  RUN_REFUSAL_ACTION_UPGRADE = 1;
  // The button opens BillingService.StartAgentTimeCheckout.
  RUN_REFUSAL_ACTION_REFILL = 2;
}

message RunRefusal {
  RunRefusalReason reason = 1;
  RunRefusalAction action = 2;
  // The sentence the agent's reply carries, in words people read.
  string message = 3;
  // Label for the button, e.g. "Upgrade" or "Refill".
  string action_label = 4;
}

// Open a new thread in a Tread as one of the workspace's agents: the root of an Ops
// hand-off or of a shift. Only a bot (the control plane) may call it; the person named
// in requested_by must be a member of the Tread, as for StartRun, and the agent is
// seated there if it is not yet. A run's own token cannot open a thread: it is bound to
// the one it works in, which is the point of it.
message OpenThreadRequest {
  string channel_id = 1;
  string agent_id = 2;
  string requested_by = 3;
  string text = 4;
  // The run this thread is opened for (a hand-off's parent), recorded on the root.
  string parent_run_id = 5;
  // What the thread is: "handoff" | "shift" | "" (a plain thread).
  string kind = 6;
}
message OpenThreadResponse {
  string thread_root_id = 1;
}

message ReplyRequest {
  string channel_id = 1;
  // The thread replied in: the root message's id.
  string thread_root_id = 2;
  string agent_id = 3;
  // The person the agent is answering.
  string requested_by = 4;
  // The whole reply so far, as Markdown.
  string text = 5;
  // Empty to post; the posted message's id to replace its text.
  string message_id = 6;
  // Idempotency key for the post: the same key never posts twice.
  string client_msg_id = 7;
}
message ReplyResponse {
  string message_id = 1;
}

message ShowWorkingRequest {
  string channel_id = 1;
  // The thread the agent is working in; empty for the Tread itself.
  string thread_root_id = 2;
  string agent_id = 3;
  // What it is doing, to follow "<agent> is": "reading the thread". Empty clears it.
  string status = 4;
}
message ShowWorkingResponse {}

// Workspace-level agent settings, admins only. Off by default.
message WorkspaceAgentSettings {
  // An organization grant ('*') made in any Tread counts for every Tread in the
  // workspace, present and future. Off: access is per Tread, as granted.
  bool org_access_everywhere = 1;
}
message GetWorkspaceAgentSettingsRequest {
  string workspace_id = 1;
}
message GetWorkspaceAgentSettingsResponse {
  WorkspaceAgentSettings settings = 1;
  bool can_manage = 2; // the caller is an admin or owner
}
message SetWorkspaceAgentSettingsRequest {
  string workspace_id = 1;
  WorkspaceAgentSettings settings = 2;
}
message SetWorkspaceAgentSettingsResponse {
  WorkspaceAgentSettings settings = 1;
}

message StopRunRequest {
  string run_id = 1;
  string reason = 2;
}
message StopRunResponse {
  Run run = 1;
}

message HeartbeatRequest {
  string run_id = 1;
}
message HeartbeatResponse {}

// A fresh agent-session token for a run that has not ended, for the control plane only. A
// run can wait days for a person (a plan or merge approval) and its token keeps a fixed
// eight-hour clock; without this the run could not say anything once the wait was over.
// The old token is revoked; the new one has the same principal, workspace, thread, scopes
// and clock.
message RenewRunTokenRequest {
  string run_id = 1;
}
message RenewRunTokenResponse {
  string agent_session_token = 1;
  google.protobuf.Timestamp token_expires_at = 2;
}

// The live output of a run so far, for a person who opens the thread or turns
// the live output setting for that thread (ThreadLiveStream) on mid-run, on any device. Same assistant text and
// status only as AgentStreamDelta, never tool input or output. The control plane keeps a
// bounded in-memory tail while the run is live; a finished run has an empty tail and
// the stored message is the record.
// One piece of a run's live output, handed to the api by the control plane (called with the
// run's own token) to fan out as AgentStreamDelta, only to users whose setting for the run's
// thread (channel_id plus thread_root_id) is on, and to fold into GetRunStreamTail. Only
// assistant text and status lines are ever sent; tool input and output never are. The
// control plane has already scrubbed the text. Best effort: the api may drop what it
// cannot place, and a run that has ended is not an error.
enum RunStreamKind {
  RUN_STREAM_KIND_UNSPECIFIED = 0;
  RUN_STREAM_KIND_TEXT = 1;   // text is a chunk of the assistant's reply to append
  RUN_STREAM_KIND_STATUS = 2; // text is a status line replacing the previous one
  RUN_STREAM_KIND_END = 3;    // the turn's output is complete
}
message PublishRunStreamRequest {
  string run_id = 1;
  uint64 seq = 2;            // per run, starting at 1, assigned by the control plane
  RunStreamKind kind = 3;
  string text = 4;
  bool reset = 5;            // a new turn begins: clear the partial text first
}
message PublishRunStreamResponse {}

message GetRunStreamTailRequest {
  string run_id = 1;
}
message GetRunStreamTailResponse {
  string text = 1;       // assistant text so far in the current turn
  string status = 2;     // the latest status line, empty if none
  uint64 last_seq = 3;   // seq of the last delta included; continue from last_seq + 1
}

message SetStatusRequest {
  string run_id = 1;
  RunState state = 2;
  string status = 3; // human-readable, shown like typing
  string branch = 4;
  string pr_url = 5;
  double cost_usd = 6;
}
message SetStatusResponse {
  Run run = 1;
}

// SetProductBrand gives a product its mark and palette, from the run working in it.
message SetProductBrandRequest {
  string run_id = 1;
  string icon_svg = 2;      // viewBox 0 0 64 64; sanitised on the way in
  string primary = 3;       // hex colours
  string secondary = 4;
  string background = 5;
  string accent = 6;
  string tagline = 7;
}
message SetProductBrandResponse {
  string icon_url = 1;      // where the catalogue serves it
}
// SetProductLanding stores the product's landing page, sanitised, for its catalogue page.
message SetProductLandingRequest {
  string run_id = 1;
  string html = 2;
}
message SetProductLandingResponse {}

// RecordProductFinding stores one structured research fact about an existing tool,
// from a run on a product of the board. See agentctl.RecordFinding for the fields.
message RecordProductFindingRequest {
  string run_id = 1;
  string tool = 2;
  string kind = 3;
  string value = 4;
  double amount = 5;
  string unit = 6;
  string quote = 7;
  string url = 8;
}
message RecordProductFindingResponse {}

message GetRunRequest {
  string run_id = 1;
}
message GetRunResponse {
  Run run = 1;
}

message ListRunsRequest {
  string workspace_id = 1;
  string channel_id = 2;
  string thread_root_id = 3;
  string cursor = 4;
  int32 limit = 5;
}
message ListRunsResponse {
  repeated Run runs = 1;
  string next_cursor = 2;
}

message ListAgentsRequest {
  string workspace_id = 1;
}
message ListAgentsResponse {
  repeated Agent agents = 1;
}


// What a Tread knows about GitHub: whether the workspace is connected at all, what
// that installation can reach, and which repository this Tread works on.
message RepoBinding {
  string repo = 1;        // owner/name
  string base_branch = 2; // default "main"
  string toolchain = 3;   // node | go | python | expo
}

// RepoAccess is one further repository a Tread's agent may reach, and how far. The
// primary repository (RepoBinding) is where runs branch and open pull requests and
// is always writable; these are the others: "read" to clone and study, "write" to
// push branches and open pull requests there too.
message RepoAccess {
  string repo = 1;   // owner/name
  string access = 2; // read | write
}

message RepoConnection {
  bool connected = 1;             // the workspace has a GitHub installation
  string account_login = 2;       // the org it is installed into
  repeated string repos = 3;      // what that installation can reach
  RepoBinding binding = 4;        // this Tread's binding, absent when unbound
  bool can_manage = 5;            // the caller may connect and bind: workspace admins only
  repeated RepoAccess access = 6; // the further repositories this Tread may reach
  // Premium workspaces may ask TANK for a repository and hosting; both are requests an
  // admin makes, never a side effect of anything else.
  bool premium = 7;
  bool hosting_available = 8;     // the platform can create repositories and host them right now
  TreadDeployment deployment = 9; // present once TANK made this Tread's repository
}

// SetRepoAccess replaces the Tread's list of further repositories. Admins only; every
// repository must be one the workspace's installation can reach, and the primary is
// not listed here (it is always writable).
message SetRepoAccessRequest {
  string channel_id = 1;
  repeated RepoAccess access = 2;
}
message SetRepoAccessResponse { repeated RepoAccess access = 1; }

// Previews for repositories the workspace has already connected.
//
// TANK serves previews of the applications it builds; a workspace that builds its own
// tells TANK where it put each build (BoardService.ReportPreview) and a frame points
// at that. Handing somebody a snippet and wishing them luck is the weak half of that
// trade: if the workspace has connected GitHub and TANK can reach the repository, TANK
// can open the pull request itself.
//
// It is a pull request and never a push: a workflow file in somebody else's repository
// is their decision. Several repositories at once, because a workspace that connects a
// front end and an API wants a frame of each, and one failing must not stop the rest.
message SetUpRepoPreviewsRequest {
  string workspace_id = 1;
  repeated string repos = 2;  // owner/name each; one pull request per repository
  // The branch each pull request targets. Empty means each repository's own default,
  // which is nearly always the right answer and the only one TANK can work out.
  string base_branch = 3;
  // Issue a new token and revoke the one before it. The token is shown once and is
  // not readable afterwards, so rotating is the only way back from losing it.
  bool rotate_token = 4;
}

// What happened for one repository. A repository that could not be set up carries its
// own sentence saying why; the others are unaffected by it.
message RepoPreviewSetup {
  string repo = 1;
  // opened | already_open | refused. "already_open" is the idempotent answer: the
  // pull request was there from an earlier ask and no second one was opened.
  string status = 2;
  string pull_request_url = 3;
  string branch = 4;          // the head branch TANK pushed the workflow to
  string workflow_path = 5;   // where the file sits in the pull request
  string reason = 6;          // why it was refused, in a sentence; empty otherwise
  google.protobuf.Timestamp requested_at = 7;
}

message SetUpRepoPreviewsResponse {
  repeated RepoPreviewSetup results = 1;
  // The token the repositories' CI authenticates with, returned exactly once and
  // never readable again. Empty when a token had already been issued and
  // rotate_token was not set. One token for the workspace, not one per repository:
  // the same secret name goes in every repository.
  string token = 2;
  string secret_name = 3;
  bool token_issued = 4;      // a token exists, whether or not it is in this response
  // What the workspace still has to do by hand, in plain words, so a client can show
  // it without knowing any of this.
  repeated string next_steps = 5;
}

// What has been set up already, so a board's settings can show it without asking TANK
// to open anything.
message ListRepoPreviewSetupsRequest { string workspace_id = 1; }
message ListRepoPreviewSetupsResponse {
  repeated RepoPreviewSetup setups = 1;
  string secret_name = 2;
  bool token_issued = 3;
}

// The Tread's switchboard: what its agents cost and did, by the hour, and the knobs a
// workspace admin turns. Spend is the workspace's own: the workspace pays for its agents.
message TreadSettings {
  int32 concurrent_runs = 1;     // agents at once in this Tread, 1..5
  bool auto_accept_plans = 2;    // skip the plan gate: the agent goes straight from plan to work
  double max_run_usd = 3;        // a single run's ceiling; 0 keeps the workspace default
  double daily_usd = 4;          // this Tread's ceiling for a day; 0 keeps the workspace default
  // What happens to a pull request the agent opens: "review" (default) posts it and
  // mentions pr_reviewer_ids in the thread; "merge_when_green" has TANK watch the
  // checks and merge it, so the agent's work keeps flowing without a person.
  string pull_requests = 5;
  repeated string pr_reviewer_ids = 6; // user ids mentioned when a pull request is ready
  // Whether runs in this Tread read the repository's Neural Knowledge and record what
  // they learn. On by default; the server always sets it.
  bool read_neural_knowledge = 7;
  // Whether TANK may approve and merge the pull requests it opens in this Tread's
  // repositories. Off, a pull request is a proposal and a person merges it; on, the
  // Tread decides how: pull_requests "merge_when_green" merges once the checks pass,
  // "review" asks for an approval in the thread and merges on it.
  bool merge_allowed = 8;
  // When a pull request waits on a person (merge_allowed off, or pull_requests
  // "review"): mention pr_reviewer_ids, or the person who asked for the run when the
  // list is empty, so somebody hears about it. Off, the card is posted and waits.
  bool notify_reviewers = 9;
  // Run this Tread's code on the strongest model (Opus) from the start. Off, a run
  // starts on Sonnet and is moved up only after its checks have failed twice; most
  // work never needs the move, and the strongest model costs two and a half times as
  // much on every token.
  bool strongest_model = 10;
  // The model this Tread's runs use, by name, chosen on the switchboard: "" lets TANK
  // decide per run (the default), "tank-neural-1" is TANK's own model, and the Claude
  // names are routed as they are. A name the gateway does not know is refused at save.
  // Supersedes strongest_model, which stays for older clients: picking claude-opus-5
  // is what that switch meant.
  string model = 11;
  // True when the Tread has no Auto choice of its own and follows the workspace's
  // (WorkspaceAuto): auto_accept_plans and pull_requests then read back as the workspace
  // default makes them. Sent true on a save, the Tread's own choice is dropped and it
  // follows the workspace again (auto_accept_plans and the merge half of pull_requests are
  // then ignored). A client that changes either Auto switch sends it false.
  bool auto_follows_workspace = 12;
}
message HourBucket {
  google.protobuf.Timestamp hour = 1;
  int32 runs = 2;
  double spend_usd = 3;
  // What Neural Knowledge saved on this hour's runs: for each run, the per-run cost of
  // the same class of work on the same model in the earlier half of the last thirty
  // days, less what the run cost, when the comparison exists. An estimate against a
  // baseline, not a measurement with a control; zero while nothing is comparable.
  double neural_saved_usd = 4;
}
message TreadMetrics {
  double spend_today_usd = 1;
  double spend_month_usd = 2;
  int32 runs_today = 3;
  int32 runs_month = 4;
  double success_rate_30d = 5;        // 0..1, done or delivered over finished runs
  repeated HourBucket hours = 6;      // the last twenty-four hours, oldest first
  double workspace_spend_today_usd = 7;
  double workspace_spend_month_usd = 8;
  int32 running_now = 9;
  double avg_run_minutes_30d = 10;
  double neural_saved_month_usd = 11; // the same estimate, over this month's runs
  // Whether any of this month's runs had a baseline to compare against. False reads
  // "measuring", never zero saved: after a model change nothing is comparable for a while.
  bool neural_measured = 12;
  // Who asked for this Tread's runs this month, most spend first.
  repeated SpendByPerson people = 13;
  // Every Tread in the workspace with a run this month, most spend first, each with the
  // people who asked for its runs. A member sees the Treads they belong to and the
  // public ones; a workspace admin sees them all. The workspace totals above count
  // every Tread either way.
  repeated SpendByTread treads = 14;
}
// What one person's asks cost: the runs they requested, this month and today. Dollars
// are marked up like everything else on the switchboard.
message SpendByPerson {
  string user_id = 1;
  string display_name = 2;
  int32 runs_month = 3;
  double spend_month_usd = 4;
  int32 runs_today = 5;
  double spend_today_usd = 6;
}
// What one Tread's runs cost, and who asked for them.
message SpendByTread {
  string channel_id = 1;
  string name = 2;
  int32 runs_month = 3;
  double spend_month_usd = 4;
  int32 runs_today = 5;
  double spend_today_usd = 6;
  repeated SpendByPerson people = 7;
}
// What one Ops team's runs cost, and who asked for them.
message SpendByTeam {
  string team_id = 1;
  string name = 2;
  int32 runs_month = 3;
  double spend_month_usd = 4;
  int32 runs_today = 5;
  double spend_today_usd = 6;
  repeated SpendByPerson people = 7;
}
// One UTC day of the workspace's agent spend.
message SpendByDay {
  string day = 1;  // YYYY-MM-DD, UTC
  int32 runs = 2;
  double spend_usd = 3;
}
// Who ran it: the Tread's own agents, Crew members, or an Ops team.
message SpendByKind {
  string kind = 1;  // tread | crew | ops
  int32 runs_month = 2;
  double spend_month_usd = 3;
  int32 runs_today = 4;
  double spend_today_usd = 5;
}
// Spend: the whole picture of the workspace's agent money. Dollars are at the Tread rate,
// the number Books books. A member sees the Treads they belong to and the public ones; a
// workspace admin sees them all. The totals count every Tread either way.
message WorkspaceSpend {
  double spend_today_usd = 1;
  double spend_month_usd = 2;
  int32 runs_today = 3;
  int32 runs_month = 4;
  int32 running_now = 5;
  double cap_month_usd = 6;         // the workspace's monthly cap; 0 = none
  double booked_month_usd = 7;      // what Books holds for this month so far
  repeated SpendByPerson people = 8;
  repeated SpendByTread treads = 9;
  repeated SpendByTeam teams = 10;
  repeated SpendByKind kinds = 11;
  repeated SpendByDay days = 12;    // the last thirty-one days, oldest first
  // Whether Books is turned on in this workspace. Off, Books books nothing, so the page says
  // so rather than promising the roll-up (2026-11-10: edero had $0 booked for that reason).
  bool books_on = 13;
  // Cost per run over the last ninety days, oldest first, at the Tread rate: whether the work
  // is getting cheaper as Neural Knowledge learns the workspace's repositories.
  repeated CostPerRunDay cost_per_run = 14;
  // What Neural Knowledge saved this workspace this month, at what it pays: its share of the
  // saving (Robby, 2026-11-10: TANK keeps half). The rate behind it is never shown.
  double neural_saved_month_usd = 15;
  // The workspace's Claude 5 spend this month against its Claude 5 cap, when one is set
  // (2026-11-12), at the Tread rate like every dollar here. Past the cap its agents carry on
  // on Claude Sonnet 4.6. claude5_capped false = no cap, and the page shows neither.
  bool claude5_capped = 16;
  double claude5_month_usd = 17;
  double claude5_cap_month_usd = 18;
}
// One UTC day of agent runs (Neural chats excluded: a reply is not a run). Dollars at the
// Tread rate. cost_per_run_usd is the day's spend over its runs, 0 on a day with none;
// trailing_7d_usd is the seven days ending here, summed spend over summed runs, the line to read.
message CostPerRunDay {
  string day = 1;  // YYYY-MM-DD, UTC
  int32 runs = 2;
  double spend_usd = 3;
  double cost_per_run_usd = 4;
  double trailing_7d_usd = 5;
}
message GetWorkspaceSpendRequest { string workspace_id = 1; }
message GetWorkspaceSpendResponse {
  WorkspaceSpend spend = 1;
  bool can_manage = 2;
}
message GetTreadSwitchboardRequest { string channel_id = 1; }
message GetTreadSwitchboardResponse {
  TreadMetrics metrics = 1;
  TreadSettings settings = 2;
  bool can_manage = 3;
  // The workspace's Auto default, which this Tread follows when
  // settings.auto_follows_workspace is set.
  WorkspaceAuto workspace_auto = 4;
}
message SetTreadSettingsRequest {
  string channel_id = 1;
  TreadSettings settings = 2;
}
message SetTreadSettingsResponse { TreadSettings settings = 1; }

message GetRepoConnectionRequest { string channel_id = 1; }
message GetRepoConnectionResponse { RepoConnection connection = 1; }

// StartGitHubConnect mints the one-time state GitHub carries through an install and
// returns where to send somebody. Admins only.
message StartGitHubConnectRequest { string workspace_id = 1; }
message StartGitHubConnectResponse { string install_url = 1; }

message BindRepoRequest {
  string channel_id = 1;
  string repo = 2;
  string base_branch = 3; // empty means "main"
  string toolchain = 4;   // empty means "node"
}
message BindRepoResponse { RepoBinding binding = 1; }

message UnbindRepoRequest { string channel_id = 1; }
message UnbindRepoResponse {}

// What neuralsecurity last found on the code a Tread is connected to: the newest finished
// scan of a push to the repository, as the Home screen shows it beside the Tread. One row
// per Tread that has a repository bound; a Tread with none is not listed.
message TreadSecurity {
  string channel_id = 1;
  string repo = 2;                             // owner/name
  // clean      the last scan finished with no secret and no fixable critical or high advisory
  // findings   it finished and found some (the counts below say what)
  // scanning   a scan is queued or running and none has finished yet
  // failed     the last scan could not run (the Tread has the card saying why)
  // unscanned  nothing has been pushed since the Tread was bound
  string state = 3;
  int32 secrets = 4;
  int32 vulns_critical = 5;
  int32 vulns_high = 6;
  string sha = 7;                              // the commit the counts are about
  google.protobuf.Timestamp scanned_at = 8;    // when that scan finished
}
// Every app the workspace hosts on TANK, with the Tread it belongs to: the list the
// workspace settings show, so an address is found without opening each Tread.
message WorkspaceDeployment {
  string channel_id = 1;
  string channel_name = 2;
  TreadDeployment deployment = 3;
}
message ListWorkspaceDeploymentsRequest { string workspace_id = 1; }
message ListWorkspaceDeploymentsResponse { repeated WorkspaceDeployment deployments = 1; }
message ListTreadSecurityRequest { string workspace_id = 1; }
message ListTreadSecurityResponse { repeated TreadSecurity treads = 1; }

// A Tread's hosting on TANK's own cluster: the repository TANK generated for it and
// whether the app built from it is awake at its URL.
message TreadDeployment {
  string slug = 1;   // <slug>.tank.chat and the repository agenture-<slug>
  string repo = 2;   // owner/name
  string url = 3;    // https://<slug>.tank.chat
  bool awake = 4;    // running (1 replica) or asleep (0); builds never wake it
  google.protobuf.Timestamp updated_at = 5;
  bool managed = 6;            // TANK generated the repository; otherwise it is the workspace's own
  bool workflow_present = 7;   // the repository carries .github/workflows/tank.yml on its default branch
  string image_tag = 8;        // empty until the first build on main has landed
  string workflow_snippet = 9; // the workflow file to add, for a repository the workspace brought
}
// CreateTreadRepo asks TANK to generate a repository for this Tread from its template, in
// TANK's organization, and bind it. Premium workspaces, admins only, one per Tread.
message CreateTreadRepoRequest { string channel_id = 1; }
message CreateTreadRepoResponse {
  RepoBinding binding = 1;
  TreadDeployment deployment = 2;
}
// SetTreadDeployment wakes the Tread's app on TANK's cluster or puts it to sleep.
message SetTreadDeploymentRequest {
  string channel_id = 1;
  bool awake = 2;
}
message SetTreadDeploymentResponse { TreadDeployment deployment = 1; }

// A Tread's plan ledger: the whole of what the Tread set out to build (a document like a
// master build plan, or the first approved plan), item by item, with where each stands.
// Runs keep it current; people read it as one progress bar under the goal and tap for the
// list (Robby, 2026-10-25: "I don't know where we are at"). The first version's size is kept,
// so a plan that grew says so.
enum PlanItemStatus {
  PLAN_ITEM_STATUS_UNSPECIFIED = 0;
  PLAN_ITEM_STATUS_TODO = 1;
  PLAN_ITEM_STATUS_DOING = 2;
  PLAN_ITEM_STATUS_DONE = 3;    // seen working by a run, never assumed
  PLAN_ITEM_STATUS_NEEDS_PERSON = 4; // a trademark search, a domain to buy, a decision
  PLAN_ITEM_STATUS_DROPPED = 5; // taken out of the plan on purpose
}

message TreadPlanItem {
  string key = 1;   // stable across versions, e.g. "data.osm-places"
  string title = 2;
  PlanItemStatus status = 3;
  string phase = 4; // the section or phase of the plan it belongs to
  string note = 5;  // one line: what is left, or why it waits
}

message TreadPlan {
  string channel_id = 1;
  string title = 2;   // what the plan is, e.g. "Datum Master Build Plan"
  string source = 3;  // the document it was drawn from, when there is one
  repeated TreadPlanItem items = 4;
  int32 version = 5;  // grows when items are added or dropped
  int32 first_total = 6; // how many items the first version had
  google.protobuf.Timestamp updated_at = 7;
}

message GetTreadPlanRequest {
  string channel_id = 1;
}
message GetTreadPlanResponse {
  TreadPlan plan = 1; // unset when the Tread has none
}

service AgentService {
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc OpenThread(OpenThreadRequest) returns (OpenThreadResponse);
  // An agent's reply written in a thread without a run (2026-11-23): an agent that answers from
  // the Neural model alone talks within half a second, so the control plane posts its words as
  // the agent the moment they start and replaces the text as the rest is written. The first
  // call posts (message_id empty) and returns the message; later calls name it and carry the
  // whole text so far. Bot tokens only, on the requester's membership, like OpenThread; the
  // agent must be one of the workspace's own and allowed to run there.
  rpc Reply(ReplyRequest) returns (ReplyResponse);
  // Shows an agent at work in a Tread or a thread before it has anything to say: the same
  // agent.status frame a run's status sends, with no run (Overdrive, 2026-11-24: a person
  // sees the agent respond within a few hundred milliseconds of pressing Send, every time).
  // Nothing is stored and nothing is posted; clients drop the frame after 30 s or when an
  // empty status follows. Bot tokens only; the agent must be one of the workspace's own and
  // a member of the Tread.
  rpc ShowWorking(ShowWorkingRequest) returns (ShowWorkingResponse);
  rpc GetWorkspaceAgentSettings(GetWorkspaceAgentSettingsRequest) returns (GetWorkspaceAgentSettingsResponse);
  rpc SetWorkspaceAgentSettings(SetWorkspaceAgentSettingsRequest) returns (SetWorkspaceAgentSettingsResponse);
  rpc GetTreadPlan(GetTreadPlanRequest) returns (GetTreadPlanResponse);
  rpc StopRun(StopRunRequest) returns (StopRunResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc RenewRunToken(RenewRunTokenRequest) returns (RenewRunTokenResponse);
  rpc GetRunStreamTail(GetRunStreamTailRequest) returns (GetRunStreamTailResponse);
  rpc PublishRunStream(PublishRunStreamRequest) returns (PublishRunStreamResponse);
  rpc SetStatus(SetStatusRequest) returns (SetStatusResponse);
  // A product's brand and landing page, set by the run working in it (an agenture only).
  rpc SetProductBrand(SetProductBrandRequest) returns (SetProductBrandResponse);
  rpc SetProductLanding(SetProductLandingRequest) returns (SetProductLandingResponse);
  rpc RecordProductFinding(RecordProductFindingRequest) returns (RecordProductFindingResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);

  // Connecting a Tread to code. A Radar is private and so is this: only workspace
  // admins may connect an org or bind a repository.
  rpc GetRepoConnection(GetRepoConnectionRequest) returns (GetRepoConnectionResponse);
  rpc StartGitHubConnect(StartGitHubConnectRequest) returns (StartGitHubConnectResponse);
  rpc BindRepo(BindRepoRequest) returns (BindRepoResponse);
  rpc UnbindRepo(UnbindRepoRequest) returns (UnbindRepoResponse);
  rpc SetRepoAccess(SetRepoAccessRequest) returns (SetRepoAccessResponse);
  // Repositories and hosting on request, for premium workspaces.
  rpc CreateTreadRepo(CreateTreadRepoRequest) returns (CreateTreadRepoResponse);
  rpc SetTreadDeployment(SetTreadDeploymentRequest) returns (SetTreadDeploymentResponse);
  // Previews for repositories the workspace has already connected: TANK opens a pull
  // request in each one adding the workflow that reports its builds, and hands back the
  // token that CI will need. Admins only, premium only, never a side effect.
  rpc SetUpRepoPreviews(SetUpRepoPreviewsRequest) returns (SetUpRepoPreviewsResponse);
  rpc ListRepoPreviewSetups(ListRepoPreviewSetupsRequest) returns (ListRepoPreviewSetupsResponse);
  // Overdrive: where each connected repository builds and deploys, and the work TANK
  // has built ahead for the workspace. Admins set; members read.
  rpc ListRepoDelivery(ListRepoDeliveryRequest) returns (ListRepoDeliveryResponse);
  rpc SetRepoDelivery(SetRepoDeliveryRequest) returns (SetRepoDeliveryResponse);
  // The workspace's own choice, which every repository follows unless it has its own
  // (Robby, 2026-11-24: "set it globally for a workspace so they don't need to be set per
  // tread"). Admins only. Choosing TANK's runners opens the switch pull request in every
  // repository that follows it, and in each repository connected later.
  rpc SetWorkspaceDelivery(SetWorkspaceDeliveryRequest) returns (SetWorkspaceDeliveryResponse);
  rpc ListPredictedWork(ListPredictedWorkRequest) returns (ListPredictedWorkResponse);
  rpc DismissPredictedWork(DismissPredictedWorkRequest) returns (DismissPredictedWorkResponse);
  // Take work TANK built ahead: a run carries on its branch in a thread of the Tread it was
  // predicted in, finishes it and asks for the merge like any other run. A prediction from a
  // queued task is taken by starting the task instead.
  rpc TakePredictedWork(TakePredictedWorkRequest) returns (TakePredictedWorkResponse);
  // The Tread's switchboard: metrics for members, settings for admins.
  rpc GetTreadSwitchboard(GetTreadSwitchboardRequest) returns (GetTreadSwitchboardResponse);
  rpc SetTreadSettings(SetTreadSettingsRequest) returns (SetTreadSettingsResponse);
  // The workspace's Auto default: whether TANK approves plans and merges pull requests by
  // itself in every Tread that has no Auto choice of its own (Robby, 2026-11-25). Members
  // read; admins set. Turning either on decides what is already waiting in the Treads that
  // follow it.
  rpc GetWorkspaceAuto(GetWorkspaceAutoRequest) returns (GetWorkspaceAutoResponse);
  rpc SetWorkspaceAuto(SetWorkspaceAutoRequest) returns (SetWorkspaceAutoResponse);
  // Spend: the workspace's agent money by Tread, person, team, kind and day.
  rpc GetWorkspaceSpend(GetWorkspaceSpendRequest) returns (GetWorkspaceSpendResponse);
  // The security state of every Tread in the workspace that is connected to a repository.
  rpc ListTreadSecurity(ListTreadSecurityRequest) returns (ListTreadSecurityResponse);
  // Every app the workspace hosts on TANK, for the Treads the caller is in.
  rpc ListWorkspaceDeployments(ListWorkspaceDeploymentsRequest) returns (ListWorkspaceDeploymentsResponse);
  // The control plane's own Tread in a workspace, found by name or made, with the
  // workspace's agent, owners and admins in it. Platform token only. First use: Neural
  // Knowledge refreshes live in #neural-knowledge rather than a Tread like #general
  // (Robby, 2026-11-01).
  rpc EnsureAgentTread(EnsureAgentTreadRequest) returns (EnsureAgentTreadResponse);
}

message EnsureAgentTreadRequest {
  string workspace_id = 1;
  // The Tread's name, without '#': 1-80 of a-z 0-9 . _ -
  string name = 2;
}
message EnsureAgentTreadResponse {
  string channel_id = 1;
  bool created = 2;
}

// ---- Overdrive: where a repository builds and deploys (Robby, 2026-11-23) ----

// DeliveryMode is who runs a repository's CI. Whichever it is, the repository's own
// workflow files stay the definition of passing, and its deploy still goes where it
// goes today.
enum DeliveryMode {
  DELIVERY_MODE_UNSPECIFIED = 0;
  // TANK's runners: TANK opens one pull request switching the repository's jobs to the
  // workspace's own runner label. Its secrets stay in GitHub.
  DELIVERY_MODE_TANK_RUNNERS = 1;
  // The CI it has today: nothing moves. TANK hears results by webhook, reads the
  // failure log and fixes it.
  DELIVERY_MODE_OWN_CI = 2;
  // Another CI system: it reports each result to TANK with one call, authenticated by
  // the report token. The same fix loop follows.
  DELIVERY_MODE_OTHER_CI = 3;
}

// ChecksMode is who decides a change's checks (Overdrive, 2026-11-24: TANK runs them itself,
// not tied to any git host). TANK: TANK finds and runs the repository's checks on its own
// nodes on the exact commit and tells the git host the result as the check "TANK"; that
// result is what Ready to check and the merge wait for. OWN_CI: wait for the repository's
// own CI, as before. UNSPECIFIED on a repository follows the workspace; a workspace with
// none is TANK.
enum ChecksMode {
  CHECKS_MODE_UNSPECIFIED = 0;
  CHECKS_MODE_TANK = 1;
  CHECKS_MODE_OWN_CI = 2;
}

// RepoDelivery is one repository's setting. A repository with no setting behaves as
// DELIVERY_MODE_OWN_CI, which is how every repository worked before the setting existed.
message RepoDelivery {
  string repo = 1;  // owner/name
  DeliveryMode mode = 2;
  // TANK_RUNNERS: the pull request that switches the jobs, and where it stands:
  // none | opened | merged | refused.
  string switch_pull_request_url = 3;
  string switch_status = 4;
  string reason = 5;  // why a switch was refused, in a sentence; empty otherwise
  // OTHER_CI: whether a report token exists, and where reports are sent. The token
  // itself is only ever in the response to the SetRepoDelivery that issued it.
  bool has_report_token = 6;
  string report_url = 7;
  // The address TANK checks after a deploy to say whether the change is live; empty
  // when the repository has no environment to check.
  string live_check_url = 8;
  // False until the workspace's runners are approved for it: TANK_RUNNERS cannot be
  // chosen while this is false, and the reason says why.
  bool tank_runners_available = 9;
  string tank_runners_reason = 10;
  google.protobuf.Timestamp updated_at = 11;
  string updated_by = 12;
  // True when the repository has no choice of its own and follows the workspace's; mode is
  // then the workspace default it follows.
  bool follows_default = 13;
  // Who decides this repository's checks, as it stands (never UNSPECIFIED here), and whether
  // that is the workspace's choice it follows rather than its own.
  ChecksMode checks_mode = 14;
  bool checks_follows_default = 15;
  // How TANK's checks have gone on this repository lately (the last 30 days); unset when
  // TANK has not checked it.
  ChecksReport checks_report = 16;
}

// ChecksReport is a repository's record of TANK's own checks (TANK-native checks 1c/1d,
// 2026-11-25), computed by the control plane from every job it ran. Times are whole jobs,
// from the record starting to its verdict.
message ChecksReport {
  int32 runs = 1;          // full check jobs in the window
  int32 passed = 2;
  int32 p50_ms = 3;
  int32 p95_ms = 4;
  // Time a job waited for its machine before it began, p50 and p95.
  int32 wait_p50_ms = 5;
  int32 wait_p95_ms = 6;
  // Steps that failed and then passed on a second run of the same commit.
  repeated FlakyStep flaky = 7;
  // The image the checks run in, and whether it was pinned from the first green run
  // ("first_green") or set by a person ("person"); empty follows TANK's current image.
  string image = 8;
  string image_source = 9;
  // The latest commit both TANK and the repository's own CI finished, for "TANK 48s ·
  // GitHub 7m 12s"; zero when there is none.
  int32 compare_tank_ms = 10;
  int32 compare_own_ci_ms = 11;
  string compare_sha = 12;
  int32 cache_hits = 13;
  int32 cache_misses = 14;
  google.protobuf.Timestamp last_at = 15;
}

message FlakyStep {
  string step = 1;
  int32 flaky = 2;  // runs it was flaky in
  int32 runs = 3;   // runs it ran in
}

message ListRepoDeliveryRequest { string workspace_id = 1; }
message ListRepoDeliveryResponse {
  repeated RepoDelivery repos = 1;
  // The workspace's own choice; UNSPECIFIED is the same as OWN_CI (nothing moves).
  DeliveryMode workspace_default = 2;
  // Why the workspace default could not be applied, in one sentence; empty when it was.
  string workspace_reason = 3;
  // Whether TANK's runners can be chosen in this workspace now, and why not.
  bool tank_runners_available = 4;
  string tank_runners_reason = 5;
  // The workspace's checks choice as it stands (TANK when it has none).
  ChecksMode workspace_checks_mode = 6;
}

message SetRepoDeliveryRequest {
  string workspace_id = 1;
  string repo = 2;
  DeliveryMode mode = 3;
  // OTHER_CI: issue a new report token and revoke the one before it.
  bool rotate_report_token = 4;
  // Drop the repository's own choice: it follows the workspace default again (mode is
  // then ignored).
  bool use_default = 5;
  // The repository's checks choice. UNSPECIFIED leaves it as it is. With mode UNSPECIFIED
  // and use_default false, only the checks choice changes.
  ChecksMode checks_mode = 6;
  // Drop the repository's own checks choice: it follows the workspace's again.
  bool checks_use_default = 7;
  // The image TANK's checks run in: set_checks_image with checks_image pins it (an image of
  // TANK's own sandbox repositories only); set_checks_image with "" goes back to pinning
  // from the next green run.
  bool set_checks_image = 8;
  string checks_image = 9;
}
message SetRepoDeliveryResponse {
  RepoDelivery repo = 1;
  // Shown once, when a token was issued by this call.
  string report_token = 2;
}

message SetWorkspaceDeliveryRequest {
  string workspace_id = 1;
  DeliveryMode mode = 2;
  // The workspace's checks choice. UNSPECIFIED leaves it as it is; with mode UNSPECIFIED
  // only the checks choice changes.
  ChecksMode checks_mode = 3;
}
// The whole list again, every repository with what it now follows.
message SetWorkspaceDeliveryResponse { ListRepoDeliveryResponse delivery = 1; }

// WorkspaceAuto is the workspace's Auto default. Both off (and no row) is the platform's
// own behavior: every plan and every pull request waits for a person unless its Tread says
// otherwise.
message WorkspaceAuto {
  bool approve_plans = 1;
  // Merge once the checks pass, in Treads where TANK may merge at all.
  bool merge_pull_requests = 2;
  google.protobuf.Timestamp updated_at = 3;
  string updated_by = 4;
  // How many of the workspace's Treads follow it, and how many have Auto settings of their own.
  int32 treads_following = 5;
  int32 treads_own = 6;
}
message GetWorkspaceAutoRequest { string workspace_id = 1; }
message GetWorkspaceAutoResponse {
  WorkspaceAuto auto = 1;
  bool can_manage = 2;
}
message SetWorkspaceAutoRequest {
  string workspace_id = 1;
  bool approve_plans = 2;
  bool merge_pull_requests = 3;
}
message SetWorkspaceAutoResponse { WorkspaceAuto auto = 1; }

// ---- Overdrive: predicted work, an add-on (Robby, 2026-11-23) ----

// PredictedWork is something TANK built, or proposes to build, before it was asked for.
// It lives on a branch that is never merged until a person takes it.
message PredictedWork {
  string id = 1;
  string workspace_id = 2;
  string channel_id = 3;
  string thread_root_id = 4;
  string task_id = 5;      // the finished task it is offered on as a next step, if any
  string title = 6;
  string summary = 7;
  // Where the prediction came from, most certain first:
  // queued_task | plan_step | conversation | guess.
  string source = 8;
  // idea: a suggestion only (the workspace does not have the add-on).
  // building | ready: on a branch, checks green and a preview ready when ready.
  // stale: main moved and it has not been brought up to date yet.
  // taken | dismissed | expired.
  string state = 9;
  string repo = 10;
  string branch = 11;
  string preview_url = 12;
  // A database change proven ahead: none | structure | questions | clone, the furthest
  // tier it was proven at, and how long it took to apply there.
  string migration_proof = 13;
  int32 migration_ms = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp ready_at = 16;
  string run_id = 17;      // the run that built it, when one did
  // source = queued_task: the task waiting in Queued that this was predicted from.
  // Starting that task is how an idea is taken.
  string source_task_id = 18;
  // The draft pull request it was built on, when it was built.
  string pr_url = 19;
}

message ListPredictedWorkRequest {
  string workspace_id = 1;
  string task_id = 2;         // only the next suggestions for this task (at most three)
  string thread_root_id = 3;  // only this thread's
  bool include_closed = 4;    // taken, dismissed and expired too
}
message ListPredictedWorkResponse {
  repeated PredictedWork work = 1;
  // Whether the workspace has the add-on: without it every item is an idea.
  bool addon = 2;
  // Of the items offered in the last 30 days, how many were taken.
  int32 offered_30d = 3;
  int32 taken_30d = 4;
}

message DismissPredictedWorkRequest {
  string workspace_id = 1;
  string id = 2;
}
message DismissPredictedWorkResponse {}

message TakePredictedWorkRequest {
  string workspace_id = 1;
  string id = 2;
}
message TakePredictedWorkResponse {
  // Where the run that carries it on is working.
  string channel_id = 1;
  string thread_root_id = 2;
}
