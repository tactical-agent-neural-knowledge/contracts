syntax = "proto3";

package tank.agentctl.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "tank/agent/v1/agent.proto";
import "tank/blocks/v1/blocks.proto";
import "tank/board/v1/board.proto";
import "tank/books/v1/books.proto";
import "tank/canvas/v1/canvas.proto";
import "tank/social/v1/social.proto";

// Runner <-> control-plane contract. The in-sandbox agent runner talks only to
// agent-control (never to the messaging core directly): every thread post, card
// edit, GitHub action and approval goes through RunnerService, authenticated
// with the per-run RUN_TOKEN. All ids are Snowflake decimal strings.

// ---------------------------------------------------------------- run context

// Phase the runner is being started for. The control plane decides; the runner
// picks its permission mode from it (planning -> "plan", implementing ->
// "acceptEdits").
enum RunPhase {
  RUN_PHASE_UNSPECIFIED = 0;
  RUN_PHASE_PLANNING = 1;
  RUN_PHASE_IMPLEMENTING = 2;
}

// A file a human put in the thread. The sandbox has no route to the file
// store, so the bytes come back through GetAttachment; this is only what the
// agent needs to decide whether it wants them.
message Attachment {
  string file_id = 1;
  string name = 2;
  string mime = 3;
  int64 size = 4;
  string message_id = 5; // the message it arrived on
}

message ThreadMessage {
  string message_id = 1;
  string author_id = 2;
  string author_name = 3;
  string author_kind = 4; // user | bot | agent
  string text = 5;
  google.protobuf.Timestamp created_at = 6;
  repeated Attachment attachments = 7;
}

// The subset of policy.v1 the runner enforces locally (deny lists, models,
// limits). The control plane remains authoritative; this is a mirror.
message PolicySummary {
  string mode = 1; // propose_only | can_merge
  repeated string tools_deny = 2;
  repeated string network_allowed_hosts = 3;
  string default_model = 4;
  string subagent_model = 5;
  int32 max_turns = 6;
  double max_budget_usd = 7;
  repeated string rules = 8; // advisory rules surfaced to the model
  // policy's tools.gate.destructive_tool: the patterns that must open a
  // destructive_tool gate instead of running.
  //
  // This field was absent until 2026-10-07, and its absence was not a weak
  // control but no control at all. The patterns were in every workspace's
  // policy, the control plane evaluated them, and nothing inside a sandbox was
  // ever told about them — so the gate the policy promised could not open and
  // the command simply ran. A deny list the runner cannot see denies nothing.
  repeated string tools_gate_destructive = 9;
}

message ApprovedPlan {
  string plan_hash = 1;
  string summary = 2;
  repeated tank.blocks.v1.PlanStep steps = 3;
  repeated string risks = 4;
  string approved_by = 5;
  google.protobuf.Timestamp approved_at = 6;
  string feedback = 7; // approver comments carried into implementation
}

message RunContext {
  string run_id = 1;
  string workspace_id = 2;
  string channel_id = 3;
  string thread_root_id = 4;
  string agent_id = 5;
  string agent_name = 6;
  string requested_by = 7;
  RunPhase phase = 8;
  string instructions = 9; // the user's ask, e.g. "fix the typo in README"
  repeated ThreadMessage thread_excerpt = 10;
  string repo = 11;        // owner/name, or a file:// / https:// URL for local dev
  string base_branch = 12;
  string branch = 13;      // agent/<channel>/<run>-<slug>
  string toolchain = 14;
  PolicySummary policy = 15;
  string operating_rules = 16; // TANK.md for the channel/workspace
  ApprovedPlan approved_plan = 17; // set when resuming after plan approval
  string sdk_session_id = 18;      // set when resuming an SDK session
  string workspace_dir = 19;       // deterministic cwd so projectKey matches across pods
  string git_remote_url = 20;      // clone URL; credentials come from GetGitCredential
  // Everything attached in this thread, newest last. Present from the first
  // turn so the agent knows an image or a video exists without asking for it:
  // "add a filter to this image" is unanswerable otherwise.
  repeated Attachment attachments = 21;
  // Further repositories this Tread may reach, and how far; the run's own repo is
  // always writable in the implementing phase.
  repeated RepoAccess repo_access = 22;
  // True for a run inside one of TANK's own board products. The board's tools —
  // commit_files, set_brand, set_landing, record_finding, board_research — exist only
  // for those; a customer's run never sees them.
  bool product_run = 23;
  // The Tread's own purpose and goal, so an agent reading the code knows what the
  // Tread is for and can offer the first step towards it.
  string channel_purpose = 24;
  string channel_goal = 25;
  // A Crew member's title and skill: who this agent is and what it does, from the
  // switchboard; empty for the workspace agent.
  string agent_title = 28;
  string agent_skill = 29;
  // True when this run must not read or write the repository's Neural Knowledge:
  // the Tread turned it off, or the run is the control half of a measurement.
  bool skip_neural_knowledge = 26;
  // How the control plane classed the ask: "single_area" (one place in the code, implemented
  // without a plan stage, on the cheaper model) or "multi_area". Empty on older runs and
  // special modes.
  string task_class = 27;
  // The thread's Workbench: the board the agent lays its steps and its work on while
  // people watch in the thread. Empty for runs nobody watches (neural, recon, remediation).
  string workbench_board_id = 30;
  // Everything the Tread holds, as one brief the control plane writes: its settings, what
  // TANK hosts for it and anything waiting on an owner, recent runs, boards and pages, the
  // latest messages with who wrote them (the agent's own notices included), and what the
  // Neural Vault knows about the ask. The same brief the agent's thread replies are written
  // from, so a run and a reply never disagree about the Tread.
  string tread_brief = 31;
  // The Tread's plan ledger as it stands, so the run works against the whole plan and keeps
  // it current with UpdateTreadPlan. Unset when the Tread has none yet.
  tank.agent.v1.TreadPlan tread_plan = 32;
  // How the run was started: "" (a summon), recon, neural, remediation, continue,
  // verify, crew, or ops (an Ops team member at work).
  string mode = 33;
  // The Ops team this run's agent is on, when it is on one: the roster, who may hand
  // work to whom, and the triggers that route an ask.
  TeamContext team = 34;
  // The run that handed this one its work, for a hand-off; empty otherwise.
  string parent_run_id = 35;
  // The hand-off this run is: what was asked, what to return, how it will be checked,
  // and what it may spend. Empty for a run a person started.
  Handoff handoff = 36;
  // What this run may still hand out: its own envelope less what its hand-offs have
  // taken. Zero means no envelope (the policy's budget applies).
  Envelope envelope_left = 37;
}

// An Ops team as a run sees it (tank.agentops.v1 holds the full record).
message TeamContext {
  string team_id = 1;
  string name = 2;
  string handle = 3;
  string purpose = 4;
  repeated TeamMember members = 5;
  // This run's own seat on the team.
  string member_id = 6;
  bool coordinator = 7;
  // The team's formation board, which the run draws its lane and edges on.
  string board_id = 8;
  // Draining: make no new hand-off; finish what is in hand.
  bool paused = 9;
  // Set near the daily cap: finish, do not start.
  string cap_note = 10;
}

// Claims: a run holds files, tables, routes or Treads for its duration, so two
// members of a team never work the same thing at once. Held means another run has
// it; the caller waits for it to end or works on something else.
message ClaimItem {
  string kind = 1;  // path | table | route | tread
  string key = 2;
}
message HeldClaim {
  ClaimItem item = 1;
  string run_id = 2;
  string title = 3;   // who holds it
  string ask = 4;     // what for
  google.protobuf.Timestamp since = 5;
}
message ClaimRequest {
  repeated ClaimItem items = 1;
  string note = 2;  // what for, shown to whoever is refused
}
message ClaimResponse {
  repeated ClaimItem granted = 1;
  repeated HeldClaim held = 2;
}
message ReleaseClaimsRequest {
  repeated ClaimItem items = 1;  // empty = everything this run holds
}
message ReleaseClaimsResponse {}
// A single file about to be edited: held by somebody else, or claimed for this run
// now if it was free.
message CheckClaimRequest { ClaimItem item = 1; }
message CheckClaimResponse {
  bool ok = 1;
  HeldClaim held = 2;
}
message ListClaimsRequest {}
message ListClaimsResponse {
  repeated HeldClaim mine = 1;
  repeated HeldClaim others = 2;  // held by other runs of the team
}
message TeamMember {
  string member_id = 1;
  string agent_id = 2;
  string title = 3;
  string handle = 4;
  bool coordinator = 5;
  repeated string triggers = 6;
  bool delegate = 7;
  repeated string delegate_to = 8;  // member ids; empty with delegate = any specialist
  Envelope envelope = 9;            // the default for a hand-off to this member
  bool enabled = 10;
  bool is_me = 11;
}
message Envelope {
  double usd = 1;
  int32 turns = 2;
  int32 minutes = 3;
}
// A hand-off contract: a delegation carries what is asked, the shape of what comes
// back, and how the result will be checked. The coordinator cannot mark it done until
// the check passes (proof, not claims, between agents).
message Handoff {
  string ask = 1;
  string return_shape = 2;
  string acceptance_check = 3;
  Envelope envelope = 4;
  string from_title = 5;  // who handed it
  string to_title = 6;    // who took it
}
// Where a hand-off stands, for the run that made it.
message HandoffStatus {
  string child_run_id = 1;
  string member_id = 2;
  string title = 3;
  string handle = 4;
  string state = 5;         // running | done | failed | budget_exhausted | timed_out | cancelled
  double cost_usd = 6;
  Envelope envelope = 7;
  Handoff handoff = 8;
  string result = 9;        // the child's completion, as text, once it ended
  string thread_root_id = 10;
  // accepted: the coordinator checked the result against the acceptance check.
  // "" until it decides; "accepted" or "rejected" after.
  string verdict = 11;
  string verdict_note = 12;
}

// Hand a bounded piece of work to a team member: a child run in a new sub-thread of
// this Tread, with an envelope carved from this run's. Refused when this run may not
// delegate, the member is not one it may hand to, or the envelope is more than it has left.
message DelegateRequest {
  string member_handle = 1;
  string ask = 2;
  string return_shape = 3;
  string acceptance_check = 4;
  Envelope envelope = 5;  // zero fields take the member's default, bounded by what is left
}
message DelegateResponse {
  string child_run_id = 1;
  string thread_root_id = 2;
  Envelope envelope = 3;      // what the child actually got
  Envelope envelope_left = 4; // what this run has left to hand out
}
// The coordinator's verdict on a hand-off, after checking the result against the
// acceptance check. A rejected hand-off may be handed again.
message AcceptHandoffRequest {
  string child_run_id = 1;
  bool accepted = 2;
  string note = 3;
}
message AcceptHandoffResponse {}
message ListHandoffsRequest {}
message ListHandoffsResponse {
  repeated HandoffStatus handoffs = 1;
  Envelope envelope_left = 2;
}

message GetRunContextRequest {}
message GetRunContextResponse {
  RunContext context = 1;
}

message RepoAccess {
  string repo = 1;   // owner/name
  string access = 2; // read | write
}

message GetGitCredentialRequest {
  string scope = 1; // read | write
  string repo = 2;  // owner/name git is asking about; empty means the run's own repository
}
message GetGitCredentialResponse {
  string username = 1; // x-access-token for GitHub
  string password = 2;
  google.protobuf.Timestamp expires_at = 3;
  string remote_url = 4; // remote to use with these credentials
}

// ----------------------------------------------------------------- thread I/O

message PostToThreadRequest {
  string text = 1;
  string client_msg_id = 2; // idempotency key
  bool also_send_to_tread = 3; // the message shows in the Tread too, not only in the thread
}
message PostToThreadResponse {
  string message_id = 1;
}

message PostPlanRequest {
  string summary = 1;
  repeated tank.blocks.v1.PlanStep steps = 2;
  repeated string risks = 3;
  repeated string questions = 4;
  // Artifacts from AttachArtifact, rendered above the approve buttons so a
  // human can see what the agent is proposing to change before approving it:
  // the page as it looks now, the slide being rewritten, the source image.
  repeated string preview_file_ids = 5;
}
message PostPlanResponse {
  string card_id = 1;   // run_cards.id
  string gate_id = 2;   // run_gates.id (plan gate)
  string plan_hash = 3;
}

// AttachArtifact publishes one file the sandbox produced (a screenshot, a
// rendered slide, an exported image) into the run's channel, and returns the
// file id to put on a card. The sandbox has no storage credentials and no
// egress to S3: the bytes go through the control plane, which uploads them as
// the agent principal. Capped at max_artifact_bytes; anything larger belongs
// in the repo, not in a card.
message AttachArtifactRequest {
  string name = 1;
  string mime = 2;
  bytes content = 3;
  // Shown under the preview. Say what the reader is looking at.
  string caption = 4;
  // This is the finished thing, not something to look at before deciding. The
  // control plane posts it into the thread on its own message immediately,
  // which is both how a person gets it and the only way it becomes readable:
  // file_shares rows come from a message's file_ids and nothing else. A
  // preview waits instead for the plan card that will carry it.
  bool deliver = 5;
}
message AttachArtifactResponse {
  string file_id = 1;
}

// GetAttachment streams one attachment's bytes into the sandbox. Server
// streaming because a video is not a message-sized thing, and because the
// runner writes each chunk straight to disk rather than holding the file in
// memory.
message GetAttachmentRequest {
  string file_id = 1;
}
message GetAttachmentResponse {
  // Set on the first response only.
  Attachment attachment = 1;
  bytes chunk = 2;
}

message UpdateCardRequest {
  string card_id = 1;
  tank.blocks.v1.Blocks blocks = 2;
  string text = 3; // plain-text fallback
}
message UpdateCardResponse {}

message AskForApprovalRequest {
  tank.blocks.v1.GateKind kind = 1;
  string subject = 2;  // what is being approved (scope change description, command, ...)
  string reason = 3;
}
message AskForApprovalResponse {
  string gate_id = 1;
  string decision = 2; // approved | rejected | expired (empty when async)
  string feedback = 3;
}

message AskQuestionRequest {
  string question = 1;
  repeated string options = 2;
  bool multi_select = 3;
}
message AskQuestionResponse {
  string card_id = 1;
  string answer = 2; // empty when async; the answer arrives as a steer message
}

message ReportStatusRequest {
  string status = 1; // "reading repo", "running tests"
  string detail = 2;
}
message ReportStatusResponse {}

// Progress through the approved plan, shown on the plan card as it moves: a step is
// running when the run starts it and done when it is proven. Steps are named by the id
// they were posted with, or by their 1-based position ("3"). A continuation run updates
// the plan card of the thread's approved plan, whichever run posted it.
// Keeps the Tread's plan ledger. Items are matched by key: a new key adds an item, a known
// key updates its title, status, phase or note. replace_all sets the whole list (a new
// version; keys left out are dropped), for creating the ledger or when the scope changes.
message UpdateTreadPlanRequest {
  string title = 1;
  string source = 2;
  repeated tank.agent.v1.TreadPlanItem items = 3;
  bool replace_all = 4;
}
message UpdateTreadPlanResponse {
  tank.agent.v1.TreadPlan plan = 1;
}

message UpdatePlanStepsRequest {
  repeated PlanStepUpdate steps = 1;
}
message PlanStepUpdate {
  string id = 1;
  tank.blocks.v1.StepStatus status = 2;
}
message UpdatePlanStepsResponse {
  repeated string unknown_ids = 1; // ids that matched no step on the card
}

message ReportCompletionRequest {
  repeated string done = 1;       // parts of the ask finished and pushed
  repeated string remaining = 2;  // parts not started or not finished, in order
  repeated string blocked = 3;    // parts that need a person: a decision, access, money
}
message ReportCompletionResponse {}

message ReadProductRequest {
  int32 tail_lines = 1;         // 0 = 200, at most 2000
  int32 pull_request = 2;       // read that pull request's preview instead of the live product
}
message ReadProductResponse {
  string slug = 1;
  ProductState state = 2;
  string logs = 3;
  string note = 4;              // why nothing could be read (no product for this repository)
}

message CheckLiveRequest {
  string path = 1;              // "/map"; the host is the product TANK runs for this repository
  int32 viewport_width = 2;     // 0 = 1440
  int32 viewport_height = 3;    // 0 = 900
  string expect_sha = 4;        // wait (up to ten minutes) until the live build is this commit
  int32 pull_request = 5;       // open that pull request's preview (<slug>--pr<n>) instead of the live product
}
message CheckLiveResponse {
  string url = 1;
  int32 status = 2;             // the page's HTTP status; 0 when it did not load
  string build_sha = 3;         // what the live product says it is (/healthz X-Build-Sha)
  bool deployed = 4;            // build_sha matches expect_sha (or none was asked for)
  string title = 5;
  int32 text_length = 6;        // characters of visible text; near zero is a blank page
  repeated string errors = 7;   // console errors and failed loads
  bytes screenshot_png = 8;
  string note = 9;              // why nothing could be checked
}

message ReadThreadRequest {
  int64 after_thread_seq = 1;
  int32 limit = 2;
}
message ReadThreadResponse {
  repeated ThreadMessage messages = 1;
}

// What the board already found, from every product's research: the tools people use,
// what each gets right and wrong, prices, verdicts. Asked before fetching the web, so
// a trade is researched once and every product in it inherits the finding.
message BoardResearchRequest {
  string query = 1;
  int32 limit = 2;
}
message ResearchHit {
  string product = 1;
  string slug = 2;
  string url = 3;
  string industry = 4;
  string stage = 5;
  string excerpt = 6;
}
message BoardResearchResponse {
  repeated ResearchHit hits = 1;
}

// Progress in the repository from every stage, without a sandbox: the control plane
// commits the files as the App. Commits skip CI unless build is set, so a page of
// writing does not build an image nobody runs.
message RepoFile {
  string path = 1;
  string content = 2;
}
message CommitFilesRequest {
  repeated RepoFile files = 1;
  string message = 2;
  bool build = 3;
}
message CommitFilesResponse {
  int32 committed = 1;
}

// The product's brand and landing page, through the run's own identity.
message SetBrandRequest {
  string icon_svg = 1;
  string primary = 2;
  string secondary = 3;
  string background = 4;
  string accent = 5;
  string tagline = 6;
}
message SetBrandResponse {
  string icon_url = 1;
}
message SetLandingRequest {
  string html = 1;
}
message SetLandingResponse {}

// RecordFinding writes one structured fact the agent learned about an existing tool
// during research: what it costs, what people complain about, what it gets right, who
// is leaving it. The board reads these across every product; prose cannot be counted.
message RecordFindingRequest {
  string tool = 1;      // the tool's name as people say it: "Jobber", "QuickBooks"
  string kind = 2;      // price | complaint | strength | gap | switching_cost | segment_leaving | evidence | other
  string value = 3;     // the fact in one sentence
  double amount = 4;    // a number when the fact is one: a monthly price, a percentage
  string unit = 5;      // usd_month | usd_year | percent | count | "" 
  string quote = 6;     // the words it rests on, when there are some
  string url = 7;       // where they were read, when there is one
}
message RecordFindingResponse {}

// Neuralbooks, from the thread. The run acts as the workspace's agent: the same
// service a person uses from the page, with the same checks.
message BooksSummaryRequest {}
message BooksSummaryResponse {
  bool enabled = 1;                              // false: say so and stop; nothing else is set
  tank.books.v1.CashSummary summary = 2;
  repeated tank.books.v1.Invoice open_invoices = 3;
  repeated tank.books.v1.Customer customers = 4;
}
message BooksCreateInvoiceRequest {
  string customer_name = 1;                      // found or created, case-insensitively
  repeated tank.books.v1.InvoiceLine lines = 2;  // description, quantity, unit_cents
  int64 tax_cents = 3;
  int32 due_days = 4;                            // 0 = the workspace default
  string notes = 5;
  bool send = 6;
}
message BooksCreateInvoiceResponse { tank.books.v1.Invoice invoice = 1; }
message BooksRecordExpenseRequest {
  string vendor = 1;
  string category = 2;
  int64 amount_cents = 3;
  string notes = 4;
  string receipt_file_id = 5;                    // from list_attachments, when it came from a receipt
}
message BooksRecordExpenseResponse { tank.books.v1.Expense expense = 1; }
message BooksRecordPaymentRequest {
  string invoice_number = 1;                     // e.g. INV-0007
  int64 amount_cents = 2;                        // 0 = what is still due
  string method = 3;
  string reference = 4;
}
message BooksRecordPaymentResponse { tank.books.v1.Invoice invoice = 1; }
message BooksReportRequest {
  string period = 1;               // this_month | last_month | this_quarter | this_year | last_30_days
}
// Flare from the thread. The run posts as the workspace: the same service a
// person uses from the settings page, with the same checks.
message SocialAccountsRequest {}
message SocialAccountsResponse {
  bool enabled = 1;                              // false: say so and stop; nothing else is set
  bool review_required = 2;                      // true: the post is a draft; ask for a go, then social_publish
  repeated tank.social.v1.Account accounts = 3;
  string voice = 4;
}
message SocialCreatePostRequest {
  tank.social.v1.Platform platform = 1;
  string text = 2;
  repeated string file_ids = 3;                  // from list_attachments; Instagram needs one
}
message SocialCreatePostResponse {
  tank.social.v1.Post post = 1;
  bool needs_review = 2;                         // the post is a draft until social_publish
}
message SocialPublishPostRequest { string post_id = 1; }
message SocialPublishPostResponse { tank.social.v1.Post post = 1; }
// Neuralcanvas from the thread: write the page up, read one, ask the pages.
message WriteUpThreadRequest {
  string title = 1;                 // empty lets the server name it from the thread
}
message WriteUpThreadResponse {
  string canvas_id = 1;
  string title = 2;
  int32 blocks = 3;
  int32 decisions = 4;
}
message ReadCanvasRequest { string canvas_id = 1; }
message ReadCanvasResponse {
  tank.canvas.v1.Canvas canvas = 1;
}
message AskCanvasRequest {
  string question = 1;
  int32 limit = 2;
}
message AskCanvasResponse {
  string summary = 1;
  repeated tank.canvas.v1.Answer answers = 2;
}

message BooksReportResponse {
  bool enabled = 1;
  tank.books.v1.Report report = 2;
}

// ----------------------------------------------------------------- Neuralboards

// The agent works in a Neuralboard beside the people in it: it reads the board, draws
// on it, and tidies it, and the control plane publishes its cursor while it does so.

message ListBoardsRequest {
  int32 limit = 1;                   // 0 takes the server's default
}
message BoardListing {
  string board_id = 1;
  string title = 2;
  int32 objects = 3;
  int32 app_frames = 4;              // frames holding a running application
}
message ListBoardsResponse { repeated BoardListing boards = 1; }

message ReadBoardRequest { string board_id = 1; }
message ReadBoardResponse {
  tank.board.v1.Board board = 1;
}

// One thing to draw. Compact on purpose: the model says what and where, and the
// control plane fills in the rest of the object — paint order, revision, the style a
// sticky note is expected to have.
message BoardShape {
  string id = 1;            // empty draws a new one; an id from read_board changes that one
  string kind = 2;          // frame | rect | ellipse | line | arrow | text | sticky | connector
  double x = 3;
  double y = 4;
  double w = 5;
  double h = 6;
  string text = 7;
  string fill = 8;          // #rrggbb; empty takes the kind's default
  string parent_id = 9;     // the frame it sits inside
  string from_id = 10;      // connector: what it comes from
  string to_id = 11;        // connector: what it goes to
  // kind "image": one of this run's own artifacts (attach_preview returns the id).
  string file_id = 12;
  // Step frames on a Workbench: pending | running | done | failed; the fill follows.
  string status = 13;
  // kind "frame": the frame shows a running app; the server resolves where it is served.
  AppFrameSpec app = 14;
}
message AppFrameSpec {
  string repo = 1;               // owner/name
  string ref = 2;                // branch or sha
  string path = 3;               // route inside the app
  int32 viewport_width = 4;      // 0 takes 1280
  int32 viewport_height = 5;     // 0 takes 800
}

// The Workbench: the process row across the top of the thread's board, and the stage
// below it. The control plane does the layout so the model never computes coordinates.
message WorkbenchStep {
  string id = 1;            // stable across calls, e.g. "plan", "tests", "deploy"
  string title = 2;
  string status = 3;        // pending | running | done | failed
}
message WorkbenchStepsRequest {
  repeated WorkbenchStep steps = 1;   // the whole row, in order; a step left out is removed
}
message WorkbenchStepsResponse {
  string board_id = 1;
}
message WorkbenchShowRequest {
  string kind = 1;          // slides | screen | diagram | note | image
  repeated string file_ids = 2;   // slides, image, screen (a screenshot): this run's artifacts, in order
  AppFrameSpec app = 3;     // screen: a running build the platform serves
  string text = 4;          // note: what the sticky says; also the caption under a stage
  string diagram = 5;       // diagram: erd | architecture, drawn by the server from the repository
  string title = 6;         // the stage's heading
}
message WorkbenchShowResponse {
  string board_id = 1;
  repeated string object_ids = 2;
}
message DrawOnBoardRequest {
  string board_id = 1;
  repeated BoardShape shapes = 2;
  repeated string delete_ids = 3;
  // The revisions the agent last read, keyed by object id, so a shape a person moved
  // since is reported rather than overwritten.
  map<string, int32> base_revs = 4;
}
message DrawOnBoardResponse {
  repeated string object_ids = 1;    // what was written, in the order asked
  int32 objects = 2;                 // how many are on the board now
  repeated string conflict_ids = 3;  // left alone because somebody else had moved them
  string conflict_note = 4;
}

message ArrangeBoardRequest {
  string board_id = 1;
  repeated string object_ids = 2;
  string layout = 3;        // row | column | grid
  double gap = 4;           // 0 takes the default
  int32 columns = 5;        // grid only; 0 picks a near-square
  map<string, int32> base_revs = 6;
}
message ArrangeBoardResponse {
  int32 moved = 1;
  string note = 2;                   // what the result looks like, in a sentence
  repeated string conflict_ids = 3;
  string conflict_note = 4;
}

// --------------------------------------------------------------------- GitHub

message OpenPullRequestRequest {
  string title = 1;
  string body = 2;
  string head_sha = 3;
  bool draft = 4;
}
message OpenPullRequestResponse {
  string pr_url = 1;
  int32 pr_number = 2;
}

message RequestCiWatchRequest {
  string head_sha = 1;
  repeated string workflows = 2; // empty = binding's watched workflows
}
message RequestCiWatchResponse {
  string watch_id = 1;
}

message GetCiFailureRequest {
  string head_sha = 1;
}
message GetCiFailureResponse {
  bool complete = 1; // all watched workflows finished
  bool green = 2;
  repeated tank.blocks.v1.Check checks = 3;
  string failed_log_excerpt = 4;
}

// ------------------------------------------------------------------ knowledge

message RecordDecisionRequest {
  string title = 1;
  string body = 2;
  repeated string tags = 3;
}
message RecordDecisionResponse {
  string decision_id = 1;
}

message RememberRequest {
  string key = 1;
  string value = 2;
}
message RememberResponse {}

// ----------------------------------------------------------------- run events

enum RunEventKind {
  RUN_EVENT_KIND_UNSPECIFIED = 0;
  RUN_EVENT_KIND_ASSISTANT_DELTA = 1;
  RUN_EVENT_KIND_TOOL_CALL = 2;
  RUN_EVENT_KIND_TOOL_RESULT = 3;
  RUN_EVENT_KIND_PERMISSION_REQUEST = 4;
  RUN_EVENT_KIND_RESULT = 5;
  RUN_EVENT_KIND_USAGE = 6;
  RUN_EVENT_KIND_STATUS = 7;
  RUN_EVENT_KIND_LOG = 8;
}

message Usage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 cache_read_input_tokens = 3;
  int64 cache_creation_input_tokens = 4;
  double cost_usd = 5;
  string model = 6;
}

message RunEvent {
  int64 seq = 1;                        // runner-assigned, monotonic per run
  google.protobuf.Timestamp at = 2;
  RunEventKind kind = 3;
  string sdk_session_id = 4;
  string text = 5;                      // assistant_delta text, status, log line
  string tool_name = 6;                 // tool_call / tool_result / permission_request
  string tool_use_id = 7;
  google.protobuf.Struct tool_input = 8;
  string tool_output = 9;               // truncated
  string tool_output_sha256 = 10;
  bool is_error = 11;
  Usage usage = 12;                     // result / usage
  string result_subtype = 13;           // success | error_max_turns | ...
  int32 num_turns = 14;
  int64 duration_ms = 15;
}

message StreamEventsRequest {
  RunEvent event = 1;
}
message StreamEventsResponse {
  int64 accepted = 1;
}

// ------------------------------------------------------------- session store

// Mirrors the Claude Agent SDK SessionStore contract (append/load keyed by
// projectKey + sessionId + optional subpath for subagent transcripts, plus a
// per-session summary), so a new pod can resume the session.
message SessionEntry {
  string session_id = 1;
  string project_key = 2;
  string subpath = 3;            // "" for the main transcript
  int64 seq = 4;                 // server-assigned append order
  string entry_uuid = 5;         // SDK entry uuid, used for de-duplication
  bytes payload = 6;             // the SDK entry, JSON-encoded
  google.protobuf.Timestamp created_at = 7;
}

message SessionSummary {
  string session_id = 1;
  int64 mtime_ms = 2;
  google.protobuf.Struct data = 3; // SDK-owned, persisted verbatim
}

message SessionStorePutRequest {
  repeated SessionEntry entries = 1;
  SessionSummary summary = 2; // optional: replaces the session's summary
}
message SessionStorePutResponse {
  int32 written = 1;
}

message SessionStoreListRequest {
  string session_id = 1;
  string project_key = 2;
  string subpath = 3;
  int64 after_seq = 4;
  int32 limit = 5;
}
message SessionStoreListResponse {
  repeated SessionEntry entries = 1;
  bool has_more = 2;
  bool found = 3; // false when no entries exist for the key at all
}

message SessionStoreListSessionsRequest {
  string project_key = 1;
}
message SessionStoreListSessionsResponse {
  repeated SessionSummary sessions = 1;
}

message SessionStoreListSubkeysRequest {
  string session_id = 1;
  string project_key = 2;
}
message SessionStoreListSubkeysResponse {
  repeated string subpaths = 1;
}

message SessionStoreDeleteRequest {
  string session_id = 1;
  string project_key = 2;
  string subpath = 3;
}
message SessionStoreDeleteResponse {}

// ---------------------------------------------------------------------- inbox

// Human -> agent traffic queued by the control plane for the runner: steer
// messages, approval decisions, question answers, cancel.
enum InboxKind {
  INBOX_KIND_UNSPECIFIED = 0;
  INBOX_KIND_STEER = 1;
  INBOX_KIND_APPROVAL = 2;
  INBOX_KIND_ANSWER = 3;
  INBOX_KIND_CANCEL = 4;
  // A hand-off this run made has ended: text carries the child's result, handoff the rest.
  INBOX_KIND_HANDOFF = 5;
}

message InboxItem {
  int64 seq = 1;
  InboxKind kind = 2;
  string user_id = 3;
  string user_name = 4;
  string text = 5;      // steer text, answer, feedback
  string gate_id = 6;   // approval
  string decision = 7;  // approved | rejected
  string card_id = 8;   // answer
  google.protobuf.Timestamp at = 9;
  HandoffStatus handoff = 10;  // INBOX_KIND_HANDOFF
}

// Long-poll: returns as soon as an item with seq > after_seq exists, or after
// wait_ms with an empty list.
message PollInboxRequest {
  int64 after_seq = 1;
  int32 wait_ms = 2;
}
message PollInboxResponse {
  repeated InboxItem items = 1;
}

// RunnerService is the only network surface the sandbox may reach besides the
// LLM gateway. Every call carries "Authorization: Bearer <RUN_TOKEN>".
service RunnerService {
  rpc GetRunContext(GetRunContextRequest) returns (GetRunContextResponse);
  rpc GetGitCredential(GetGitCredentialRequest) returns (GetGitCredentialResponse);

  rpc PostToThread(PostToThreadRequest) returns (PostToThreadResponse);
  rpc AttachArtifact(AttachArtifactRequest) returns (AttachArtifactResponse);
  rpc GetAttachment(GetAttachmentRequest) returns (stream GetAttachmentResponse);
  rpc PostPlan(PostPlanRequest) returns (PostPlanResponse);
  rpc UpdateCard(UpdateCardRequest) returns (UpdateCardResponse);
  rpc AskForApproval(AskForApprovalRequest) returns (AskForApprovalResponse);
  rpc AskQuestion(AskQuestionRequest) returns (AskQuestionResponse);
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse);
  rpc UpdatePlanSteps(UpdatePlanStepsRequest) returns (UpdatePlanStepsResponse);
  rpc UpdateTreadPlan(UpdateTreadPlanRequest) returns (UpdateTreadPlanResponse);
  // How far the run got against the whole ask (2026-10-23): what is done, what is left,
  // and what needs a person. Items left with nothing blocked start a continuation run.
  rpc ReportCompletion(ReportCompletionRequest) returns (ReportCompletionResponse);
  // Ops teams: hand work to a member as a child run, judge what came back, see where
  // every hand-off stands.
  rpc Delegate(DelegateRequest) returns (DelegateResponse);
  rpc AcceptHandoff(AcceptHandoffRequest) returns (AcceptHandoffResponse);
  rpc ListHandoffs(ListHandoffsRequest) returns (ListHandoffsResponse);
  rpc Claim(ClaimRequest) returns (ClaimResponse);
  rpc ReleaseClaims(ReleaseClaimsRequest) returns (ReleaseClaimsResponse);
  rpc CheckClaim(CheckClaimRequest) returns (CheckClaimResponse);
  rpc ListClaims(ListClaimsRequest) returns (ListClaimsResponse);
  // Opens a page of the product TANK hosts for this run's repository, as a visitor would,
  // once it serves the expected build: status, errors, how much it shows, a screenshot.
  rpc CheckLive(CheckLiveRequest) returns (CheckLiveResponse);
  // The product TANK runs for this run's repository, as its operator sees it: whether it
  // is up, how often it has restarted and why, recent cluster events and its log. So an
  // agent can see the product it built fail instead of hearing about it from a person.
  rpc ReadProduct(ReadProductRequest) returns (ReadProductResponse);
  // Checks a tank.yaml the way a deploy will and prices it, before anything is built.
  rpc ValidateSpec(ValidateSpecRequest) returns (ValidateSpecResponse);
  rpc ReadThread(ReadThreadRequest) returns (ReadThreadResponse);
  rpc BoardResearch(BoardResearchRequest) returns (BoardResearchResponse);
  rpc CommitFiles(CommitFilesRequest) returns (CommitFilesResponse);
  rpc SetBrand(SetBrandRequest) returns (SetBrandResponse);
  rpc SetLanding(SetLandingRequest) returns (SetLandingResponse);
  rpc RecordFinding(RecordFindingRequest) returns (RecordFindingResponse);
  rpc BooksSummary(BooksSummaryRequest) returns (BooksSummaryResponse);
  rpc BooksCreateInvoice(BooksCreateInvoiceRequest) returns (BooksCreateInvoiceResponse);
  rpc BooksRecordExpense(BooksRecordExpenseRequest) returns (BooksRecordExpenseResponse);
  rpc BooksRecordPayment(BooksRecordPaymentRequest) returns (BooksRecordPaymentResponse);
  rpc BooksReport(BooksReportRequest) returns (BooksReportResponse);
  rpc SocialAccounts(SocialAccountsRequest) returns (SocialAccountsResponse);
  rpc SocialCreatePost(SocialCreatePostRequest) returns (SocialCreatePostResponse);
  rpc SocialPublishPost(SocialPublishPostRequest) returns (SocialPublishPostResponse);
  rpc WriteUpThread(WriteUpThreadRequest) returns (WriteUpThreadResponse);
  rpc ReadCanvas(ReadCanvasRequest) returns (ReadCanvasResponse);
  rpc AskCanvas(AskCanvasRequest) returns (AskCanvasResponse);
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);
  rpc ReadBoard(ReadBoardRequest) returns (ReadBoardResponse);
  rpc DrawOnBoard(DrawOnBoardRequest) returns (DrawOnBoardResponse);
  rpc ArrangeBoard(ArrangeBoardRequest) returns (ArrangeBoardResponse);
  rpc WorkbenchSteps(WorkbenchStepsRequest) returns (WorkbenchStepsResponse);
  rpc WorkbenchShow(WorkbenchShowRequest) returns (WorkbenchShowResponse);
  rpc PollInbox(PollInboxRequest) returns (PollInboxResponse);

  rpc OpenPullRequest(OpenPullRequestRequest) returns (OpenPullRequestResponse);
  rpc RequestCiWatch(RequestCiWatchRequest) returns (RequestCiWatchResponse);
  rpc GetCiFailure(GetCiFailureRequest) returns (GetCiFailureResponse);

  rpc RecordDecision(RecordDecisionRequest) returns (RecordDecisionResponse);
  rpc Remember(RememberRequest) returns (RememberResponse);

  // Client-streaming transcript: assistant_delta, tool_call, tool_result,
  // permission_request, result, usage. Persisted to agent.run_events.
  rpc StreamEvents(stream StreamEventsRequest) returns (StreamEventsResponse);

  rpc SessionStorePut(SessionStorePutRequest) returns (SessionStorePutResponse);
  rpc SessionStoreList(SessionStoreListRequest) returns (SessionStoreListResponse);
  rpc SessionStoreListSessions(SessionStoreListSessionsRequest) returns (SessionStoreListSessionsResponse);
  rpc SessionStoreListSubkeys(SessionStoreListSubkeysRequest) returns (SessionStoreListSubkeysResponse);
  rpc SessionStoreDelete(SessionStoreDeleteRequest) returns (SessionStoreDeleteResponse);
}

// ------------------------------------------------------------ control service

// ControlService is the operator/product surface of agent-control (run panel,
// slash commands, tests). Authenticated with a service token, never a RUN_TOKEN.

message StartRunRequest {
  string workspace_id = 1;
  string channel_id = 2;
  string thread_root_id = 3;
  string agent_id = 4;
  string requested_by = 5;
  string instructions = 6;
  // "" for an ordinary run; "neural" for a Neural Knowledge refresh, which
  // skips planning and works in `repo` regardless of the Tread's binding.
  string mode = 7;
  string repo = 8; // owner/name; required for mode "neural"
  // Run without reading or writing the repository's Neural Knowledge. For measuring
  // the layer: the same task with and without it.
  bool skip_neural_knowledge = 9;
}
message StartRunResponse {
  tank.agent.v1.Run run = 1;
}

message GetRunRequest {
  string run_id = 1;
}
message GetRunResponse {
  tank.agent.v1.Run run = 1;
  string sdk_session_id = 2;
  string head_sha = 3;
  repeated Gate gates = 4;
}

message Gate {
  string id = 1;
  tank.blocks.v1.GateKind kind = 2;
  string subject_hash = 3;
  repeated string required_approvers = 4;
  int32 min_approvals = 5;
  google.protobuf.Timestamp expires_at = 6;
  string decision = 7; // pending | approved | rejected | expired
  repeated GateDecision decisions = 8;
}
message GateDecision {
  string user_id = 1;
  string decision = 2;
  string feedback = 3;
  google.protobuf.Timestamp at = 4;
}

message ListRunsRequest {
  string workspace_id = 1;
  string channel_id = 2;
  string thread_root_id = 3;
  int32 limit = 4;
}
message ListRunsResponse {
  repeated tank.agent.v1.Run runs = 1;
}

message DecideGateRequest {
  string run_id = 1;
  string gate_id = 2;
  string user_id = 3;
  string decision = 4; // approved | rejected
  string feedback = 5;
}
message DecideGateResponse {
  Gate gate = 1;
}

message SteerRunRequest {
  string run_id = 1;
  string user_id = 2;
  string text = 3;
}
message SteerRunResponse {}

message CancelRunRequest {
  string run_id = 1;
  string user_id = 2;
  string reason = 3;
}
message CancelRunResponse {}

message ListRunEventsRequest {
  string run_id = 1;
  int64 after_seq = 2;
  int32 limit = 3;
}
message ListRunEventsResponse {
  repeated RunEvent events = 1;
  bool has_more = 2;
}

// Refresh a repository's Neural Knowledge: the control plane finds a Tread in the
// workspace with access to the repository, keeps one standing thread per repository
// for the refreshes, and starts a neural run there. Idempotent while one is active.
message RefreshNeuralKnowledgeRequest {
  string workspace_id = 1;
  string repo = 2;         // owner/name
  string requested_by = 3; // user id; empty means the platform (a push)
}
message RefreshNeuralKnowledgeResponse {
  string channel_id = 1;
  string thread_root_id = 2;
  bool started = 3;        // false when a refresh was already running for this repository
}

// Opens a thread in a Tread as the workspace's agent and returns its root. Used by
// the platform when it needs a thread of its own: a measurement run, a refresh.
message OpenThreadRequest {
  string workspace_id = 1;
  string channel_id = 2;
  string text = 3;
}
message OpenThreadResponse {
  string thread_root_id = 1;
}

service ControlService {
  // ArenaTurn writes one turn of a service's public conversation on TANK's own model,
  // text only, with no tools and no sandbox, so it can only be answered by TANK's
  // weights. Refused when tank-neural is not served by TANK's own model server.
  rpc ArenaTurn(ArenaTurnRequest) returns (ArenaTurnResponse);
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc OpenThread(OpenThreadRequest) returns (OpenThreadResponse);
  rpc RefreshNeuralKnowledge(RefreshNeuralKnowledgeRequest) returns (RefreshNeuralKnowledgeResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc DecideGate(DecideGateRequest) returns (DecideGateResponse);
  rpc SteerRun(SteerRunRequest) returns (SteerRunResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  rpc ListRunEvents(ListRunEventsRequest) returns (ListRunEventsResponse);
  // Creates the repository a product's code lives in, from the product template.
  // The control plane does it because it holds the GitHub App; api asks at product
  // birth. Idempotent: asking twice for the same product returns the same repo.
  rpc CreateProductRepo(CreateProductRepoRequest) returns (CreateProductRepoResponse);
  rpc CommitProductFiles(CommitProductFilesRequest) returns (CommitProductFilesResponse);
  // Wakes a product (replicas 1) or puts it to sleep (replicas 0). A product is
  // asleep by default and a new image never wakes it: waking is a decision — a
  // preview, a sale — made here, and recorded in GitOps like everything else.
  rpc SetProductReplicas(SetProductReplicasRequest) returns (SetProductReplicasResponse);
  // Hosting for a repository TANK did not generate: writes the slug's deployment file
  // naming that repository, so its CI may push images for the slug and the app can be
  // woken like a product. The workspace's own installation must reach the repository.
  rpc RegisterDeployment(RegisterDeploymentRequest) returns (RegisterDeploymentResponse);
  // What GitOps holds for a slug right now, and whether the repository carries the
  // deploy workflow yet.
  rpc GetDeployment(GetDeploymentRequest) returns (GetDeploymentResponse);
  // The running state of a slug read from the cluster, with its log tail: what the
  // Infrastructure page shows. Read only.
  rpc GetProductState(GetProductStateRequest) returns (GetProductStateResponse);
  // Opens a page of a slug's product through the headless reader, as a visitor would.
  rpc CheckProductPage(CheckProductPageRequest) returns (CheckProductPageResponse);
  // A product's compiled spec, its cost, a build waiting to land, and the operations taken.
  rpc GetProductSpec(GetProductSpecRequest) returns (GetProductSpecResponse);
  // Lands a build that waits on a cost approval. The sha must be the waiting build's.
  rpc ApproveProductBuild(ApproveProductBuildRequest) returns (ApproveProductBuildResponse);
  // Restart, pause or resume a schedule, run a job: recorded in GitOps like everything else.
  rpc OperateProduct(OperateProductRequest) returns (OperateProductResponse);
  // The product's history: every deploy, hold, approval and operation, newest first.
  rpc ListProductChanges(ListProductChangesRequest) returns (ListProductChangesResponse);
  // Puts an earlier build back, with the tank.yaml it was built from.
  rpc RollbackProduct(RollbackProductRequest) returns (RollbackProductResponse);
  // Changes one process's size, scale or schedule as a commit to the product's tank.yaml,
  // authored as the person who asked; the build that follows deploys it.
  rpc UpdateProductSpec(UpdateProductSpecRequest) returns (UpdateProductSpecResponse);
  // What a change to tank.yaml would cost and whether it compiles, without making it.
  rpc PreviewProductSpec(PreviewProductSpecRequest) returns (PreviewProductSpecResponse);
  // Makes the change: a commit to tank.yaml in the person's name, deployed on the running
  // build; one that costs more lands at once only with an owner's accepted price.
  rpc ApplyProductSpec(ApplyProductSpecRequest) returns (ApplyProductSpecResponse);
  rpc GetProductSpecText(GetProductSpecTextRequest) returns (GetProductSpecTextResponse);
  // The running product as a docker-compose file anybody can run without TANK.
  rpc ExportProduct(ExportProductRequest) returns (ExportProductResponse);
  // Sets one of a product's declared secrets. The value is stored and never returned.
  rpc SetProductSecret(SetProductSecretRequest) returns (SetProductSecretResponse);
  // Adds the preview-reporting workflow to repositories the workspace's own
  // installation reaches, each as a pull request: branch, file, pull request. Nothing
  // is merged and nothing is written to a default branch — TANK proposes, the
  // workspace decides. Idempotent per repository, and one repository's refusal never
  // stops the others.
  rpc SetUpPreviewWorkflow(SetUpPreviewWorkflowRequest) returns (SetUpPreviewWorkflowResponse);
  // Reads a repository the workspace's own installation reaches, at a ref: one file's
  // content, or the list of file paths. For a board's route list and code frames. api
  // asks only after its own grant check; this refuses a repository the installation
  // does not reach, so a workspace can never read through TANK's own installation.
  rpc ReadRepo(ReadRepoRequest) returns (ReadRepoResponse);
  // Builds a branch of a repository the workspace's own installation reaches into a
  // static site served at https://<build_id>.preview.<domain>, for board frames. Queues
  // once per commit; answers with the newest build's state for that commit. Refused for
  // a repository outside the installation and past the workspace's daily build cap.
  rpc BuildPreview(BuildPreviewRequest) returns (BuildPreviewResponse);
  // Opens (or finds) the one pull request that connects a repository's app to boards: the
  // domain proof file and TANK's board bridge, placed for the repository's framework.
  rpc OpenSetupPullRequest(OpenSetupPullRequestRequest) returns (OpenSetupPullRequestResponse);
  // What a page shows at a point, read by a headless browser on TANK's side.
  rpc ReadElementAt(ReadElementAtRequest) returns (ReadElementAtResponse);
  // Merges the pull request of the newest run in a thread, only when its head is exactly
  // sha (the commit a person saw previewed). api asks after its own checks.
  rpc MergeChange(MergeChangeRequest) returns (MergeChangeResponse);

  // Writes into schema `agent`, which belongs to the control plane. The
  // messaging core may read that schema and may not write it, so each of these
  // is a thing it needs done rather than a statement it issues. See the block
  // of messages below for why this is a call and not a wider grant.
  rpc BindChannelRepo(BindChannelRepoRequest) returns (BindChannelRepoResponse);
  rpc UnbindChannelRepo(UnbindChannelRepoRequest) returns (UnbindChannelRepoResponse);
  rpc SetChannelRepoAccess(SetChannelRepoAccessRequest) returns (SetChannelRepoAccessResponse);
  rpc CreateGitHubConnectState(CreateGitHubConnectStateRequest) returns (CreateGitHubConnectStateResponse);
  rpc SetChannelAgentSettings(SetChannelAgentSettingsRequest) returns (SetChannelAgentSettingsResponse);
  rpc SetWorkspaceAgentPolicy(SetWorkspaceAgentPolicyRequest) returns (SetWorkspaceAgentPolicyResponse);
}

// The control plane composes the workflow file itself: only it can see the repository,
// so only it knows which workflows the file should run after and what the default
// branch is called. api passes the things only api knows — where TANK answers, which
// workspace is reporting, and the name of the secret holding the token.
message SetUpPreviewWorkflowRequest {
  string workspace_id = 1;
  repeated string repos = 2;  // owner/name each
  string base_branch = 3;     // empty = each repository's own default branch
  string api_url = 4;         // the TANK origin their CI posts to, e.g. https://api.tank.chat
  string secret_name = 5;     // the repository secret holding the TANK token
  string branch = 6;          // head branch to push to; empty = tank/preview-reporting
}

message PreviewWorkflowResult {
  string repo = 1;
  string status = 2;            // opened | already_open | refused
  string pull_request_url = 3;
  string branch = 4;
  string base_branch = 5;
  string workflow_path = 6;
  string reason = 7;            // why it was refused, in a sentence; empty otherwise
}

message SetUpPreviewWorkflowResponse { repeated PreviewWorkflowResult results = 1; }

message RegisterDeploymentRequest {
  string workspace_id = 1;
  string slug = 2;         // <slug>.tank.chat
  string repo = 3;         // owner/name the images come from
  string description = 4;
}
message RegisterDeploymentResponse {
  string url = 1;
}
message GetDeploymentRequest { string slug = 1; }

// One process of a product: a service, a worker, a schedule or a job.
message ProductProcess {
  string name = 1;
  string kind = 2;              // service | worker | cron | job
  string size = 3;              // s | m | l | xl | 2xl
  string cpu = 4;
  string memory = 5;
  int32 port = 6;
  bool public = 7;              // served at <slug>.tank.chat (web)
  int32 min = 8;
  int32 max = 9;
  string schedule = 10;
  int32 timeout_seconds = 11;
  repeated string command = 12;
  string volume = 13;           // web's data volume, "20Gi"
  int32 scratch_gi = 14;        // working disk at /scratch for a worker, schedule or job
}
// What else a product is made of besides its processes.
message ProductParts {
  repeated ProductDatabase databases = 1;
  string cache_size = 2;        // empty: no cache
  repeated string buckets = 3;
  repeated string datasets = 4;
  repeated string library = 5;  // every dataset TANK's library offers
}
message ProductDatabase {
  string name = 1;
  string size = 2;
  string storage = 3;           // "20Gi"
  repeated string extensions = 4;
}
// One change to tank.yaml from hosting settings. kind and name say what it is about.
message ProductSpecChange {
  string kind = 1;              // service | worker | cron | job | database | cache | bucket | dataset | env
  string name = 2;              // empty for cache
  bool remove = 3;
  string size = 4;              // empty leaves it
  int32 min = 5;                // 0 leaves it
  int32 max = 6;
  string schedule = 7;
  string storage = 8;           // a database's storage, or web's /data volume: "40Gi"
  repeated string extensions = 9;
  repeated string command = 10;
  string scratch = 11;          // "50Gi"; "0" removes it
  string timeout = 12;
  string value = 13;            // env
}
message PreviewProductSpecRequest {
  string slug = 1;
  oneof edit {
    ProductSpecChange change = 2;
    string text = 3;            // the whole tank.yaml
  }
}
message PreviewProductSpecResponse {
  string text = 1;              // tank.yaml as it would be
  ProductCost before = 2;       // what the running build costs
  ProductCost after = 3;
  repeated string problems = 4; // non-empty: the change cannot be made as it is
}
message ApplyProductSpecRequest {
  string slug = 1;
  oneof edit {
    ProductSpecChange change = 2;
    string text = 3;
  }
  string author_name = 4;
  string author_email = 5;
  // The monthly total an owner saw and accepted. A change that costs more lands at once
  // when this equals its estimate; otherwise it waits for an owner like any build.
  int64 accepted_total_cents = 6;
  string accepted_by = 7;
}
message ApplyProductSpecResponse {
  string commit_sha = 1;
  ProductCost estimate = 2;
  bool live = 3;                // false: held, see GetProductSpec's pending
}
message GetProductSpecTextRequest { string slug = 1; }
message GetProductSpecTextResponse {
  string text = 1;              // empty: the product has no tank.yaml yet
}
message ProductCost {
  int64 base_cents = 1;
  int64 overage_cents = 2;
  repeated string lines = 3;
}
message PendingBuild {
  string sha = 1;
  string reason = 2;            // spec | cost
  repeated string problems = 3;
  ProductCost estimate = 4;
  string at = 5;                // RFC 3339
  repeated ProductProcess processes = 6;
}
message ProcessState {
  string name = 1;
  string kind = 2;
  int32 desired = 3;
  int32 ready = 4;
  bool suspended = 5;           // a paused schedule
  string last_run_at = 6;       // RFC 3339, schedules and jobs
  string last_run_result = 7;   // succeeded | failed | running
}
message JobRun {
  string job = 1;
  string id = 2;
}
message ProductChange {
  string sha = 1;               // the GitOps commit
  string message = 2;
  string at = 3;                // RFC 3339
  string image_tag = 4;         // the build the product ran after it, when it changed
}

message ValidateSpecRequest { string tank_yaml = 1; }
message ValidateSpecResponse {
  bool ok = 1;
  repeated string problems = 2;
  ProductCost estimate = 3;
  repeated ProductProcess processes = 4;
}
message GetProductSpecRequest { string slug = 1; }
message GetProductSpecResponse {
  repeated ProductProcess processes = 1;   // empty: the single web process of a product with no tank.yaml
  ProductCost estimate = 2;
  PendingBuild pending = 3;
  string restarted_at = 4;
  repeated string paused = 5;
  repeated JobRun runs = 6;
  repeated string env_keys = 7;
  repeated string secrets = 8;
  repeated ProductPreview previews = 9;   // open pull requests' previews
  repeated string secrets_set = 10;       // the declared secrets that have a value
  ProductParts parts = 11;
}
message ProductPreview {
  int32 pull_request = 1;
  string url = 2;
  string image_tag = 3;
  string expires_at = 4;        // RFC 3339
}
message ApproveProductBuildRequest {
  string slug = 1;
  string sha = 2;
  string by = 3;                // who, for the commit message
}
message ApproveProductBuildResponse {}
message OperateProductRequest {
  string slug = 1;
  string action = 2;            // restart | pause | resume | run
  string process = 3;           // the schedule or job; empty for restart
  string by = 4;
}
message OperateProductResponse { string run_id = 1; }
message ListProductChangesRequest {
  string slug = 1;
  int32 limit = 2;              // 0 = 30, at most 100
}
message ListProductChangesResponse { repeated ProductChange changes = 1; }
message RollbackProductRequest {
  string slug = 1;
  string sha = 2;               // the build (product repository commit) to put back
  string by = 3;
}
message RollbackProductResponse {
  bool applied = 1;
  string reason = 2;            // spec | cost when it waits instead
  repeated string problems = 3;
  ProductCost estimate = 4;
}
message SetProductSecretRequest {
  string slug = 1;
  string name = 2;              // one of the names its tank.yaml declares
  string value = 3;             // empty clears it
}
message SetProductSecretResponse {}
message ExportProductRequest { string slug = 1; }
message ExportProductResponse {
  string compose_yaml = 1;
  string image = 2;             // the image it names, for the buyer to pull or rebuild
}
message UpdateProductSpecRequest {
  string slug = 1;
  string process = 2;
  string size = 3;              // empty leaves it
  int32 min = 4;                // 0 leaves it
  int32 max = 5;
  string schedule = 6;          // empty leaves it
  string author_name = 7;
  string author_email = 8;
}
message UpdateProductSpecResponse {
  string commit_sha = 1;
  ProductCost estimate = 2;     // what the product will cost once the build lands
}

// What the cluster says about a running product.
message ProductState {
  string phase = 1;             // not_deployed | asleep | starting | running | failing
  string image_tag = 2;         // what the workload runs
  int32 replicas = 3;           // wanted
  int32 ready = 4;              // serving
  int32 restarts = 5;           // since the pod started
  string last_exit_reason = 6;  // "Error", "OOMKilled", … of the last crash
  int32 last_exit_code = 7;
  string started_at = 8;        // RFC 3339, when the current pod started
  int64 disk_bytes = 9;         // capacity of the product's data volume
  string cpu_limit = 10;        // "1"
  string memory_limit = 11;     // "2Gi"
  repeated ProductEvent events = 12;
  repeated ProcessState processes = 13;
}
message ProductEvent {
  string at = 1;                // RFC 3339
  string type = 2;              // Normal | Warning
  string reason = 3;
  string message = 4;
}
message CheckProductPageRequest {
  string slug = 1;
  string path = 2;              // "/" when empty
}
message CheckProductPageResponse { CheckLiveResponse check = 1; }
message GetProductStateRequest {
  string slug = 1;
  int32 tail_lines = 2;         // 0 = 200, at most 2000
}
message GetProductStateResponse {
  ProductState state = 1;
  string logs = 2;              // the app's log tail; the previous container's when it crashed
}
message GetDeploymentResponse {
  string repo = 1;              // owner/name recorded for the slug
  string url = 2;
  string image_tag = 3;         // empty until a build on main has landed
  int32 replicas = 4;
  bool workflow_present = 5;    // .github/workflows/tank.yml exists on the repository's default branch
  bool managed = 6;             // TANK generated the repository (agenture-<slug> in TANK's org)
}

message SetProductReplicasRequest {
  string slug = 1;
  int32 replicas = 2;   // 0 or 1; the database lives in the pod, so never more
  string reason = 3;    // "preview", "sale", "idle" — goes in the commit message
}
message SetProductReplicasResponse {
  string url = 1;       // https://<slug>.tank.chat
}

message CreateProductRepoRequest {
  string workspace_id = 1;  // the product
  string slug = 2;          // becomes agenture-<slug>
  string description = 3;   // the repo's description on GitHub: name and one line
}
message CreateProductRepoResponse {
  string repo = 1;          // owner/name
}

// CommitProductFiles writes files to a product's repository as the App, for the board's
// own writing — a stage done without a sandbox still leaves its document behind.
message CommitProductFilesRequest {
  string slug = 1;
  repeated RepoFile files = 2;
  string message = 3;
  bool build = 4;
}
message CommitProductFilesResponse {
  int32 committed = 1;
}

// ------------------------------------------- the agent schema's own writes
//
// Schema `agent` belongs to the control plane. The application role is granted
// USAGE on the schema and SELECT on its tables and nothing else, which is the
// separation the grant states in words. The messaging core nonetheless issued
// twenty INSERT and DELETE statements against agent.repo_bindings,
// agent.repo_access, agent.github_connect_states and agent.policies — writes
// that cannot succeed from an api pod and were only ever green in CI, where the
// test fixture grants itself DML on the schema.
//
// The fix is a call, not a wider grant. Widening the grant to match the code
// would make the control-plane separation imaginary, which is the one thing the
// grant exists to assert. So these RPCs are the boundary, and they are
// deliberately narrow: each one is a thing the messaging core needs done rather
// than a general way to write to the schema. There is no RPC that takes a
// table and a statement, and there will not be one.
//
// Every one of them is authenticated with the control-plane service token, like
// the rest of ControlService, and every one validates against what the control
// plane alone can see — which installation reaches which repository, whether a
// policy document narrows its parent or widens it.

message BindChannelRepoRequest {
  string workspace_id = 1;
  string channel_id = 2;
  string repo = 3;        // owner/name
  string base_branch = 4; // empty = main
  string toolchain = 5;   // node | go | python | expo; empty = node
  // Set when the repository is one TANK generated for this workspace's hosting.
  // Such a repository lives under TANK's own installation rather than the
  // workspace's, so the reachability check is a different one.
  bool hosted = 6;
  string requested_by = 7; // user id, for the record
}
message BindChannelRepoResponse {
  string repo = 1;
  string base_branch = 2;
  string toolchain = 3;
  // What was bound before, so the caller can offer a catch-up only when the
  // binding actually changed.
  string previous_repo = 4;
}

message UnbindChannelRepoRequest {
  string workspace_id = 1;
  string channel_id = 2;
  string requested_by = 3;
}
message UnbindChannelRepoResponse {
  bool removed = 1;
}

message RepoAccessEntry {
  string repo = 1;   // owner/name, or "*" for every repository the installation covers
  string access = 2; // read | write
}

// Replaces a Tread's whole access list in one call. Replacing rather than
// patching is deliberate: a diff applied by two callers at once leaves a set
// nobody asked for, and the set is small enough to send whole.
message SetChannelRepoAccessRequest {
  string workspace_id = 1;
  string channel_id = 2;
  repeated RepoAccessEntry entries = 3;
  string requested_by = 4;
}
message SetChannelRepoAccessResponse {
  repeated RepoAccessEntry entries = 1;
  // Repositories that were not in the list before, so the caller can offer a
  // catch-up for exactly those.
  repeated string added = 2;
}

// The one-time state GitHub carries through an installation, which is what ties
// the installation it reports back to the workspace that asked.
message CreateGitHubConnectStateRequest {
  string workspace_id = 1;
  string created_by = 2;
  int32 ttl_seconds = 3; // empty = the control plane's own default
}
message CreateGitHubConnectStateResponse {
  string state_token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// A Tread's agent settings, as the switchboard screen sets them. Typed rather
// than a policy document on purpose: the messaging core does not author policy,
// it asks for five things to be true, and the control plane decides whether its
// own document can say that.
message SetChannelAgentSettingsRequest {
  string workspace_id = 1;
  string channel_id = 2;
  tank.agent.v1.TreadSettings settings = 3;
  string requested_by = 4;
}
message SetChannelAgentSettingsResponse {
  tank.agent.v1.TreadSettings settings = 1;
}

// A whole policy.v1 document at workspace scope, for the one caller that has
// one: the board, which narrows every product it stands up to the same figures.
// The control plane parses it and refuses a document that widens the default
// rather than narrowing it, so this is not a back door to the typed call above.
message SetWorkspaceAgentPolicyRequest {
  string workspace_id = 1;
  bytes policy = 2; // policy.v1 JSON
  string requested_by = 3;
}
message SetWorkspaceAgentPolicyResponse {
  bytes policy = 1; // what was stored, after narrowing
}

message ArenaTurnRequest {
  string environment_id = 1;
  string round_id = 2;
  string product_workspace_id = 3;
  string system = 4;
  string user = 5;
  int32 max_tokens = 6;                   // 0 = the control plane's default
}
message ArenaTurnResponse {
  string text = 1;
  string model = 2;                       // the model that answered, resolved, never the alias
  string prompt_hash = 3;                 // sha256 of system + user
  int32 input_tokens = 4;
  int32 output_tokens = 5;
}

message ReadRepoRequest {
  string workspace_id = 1;
  string repo = 2;              // owner/name
  string ref = 3;               // branch or commit; empty = the default branch
  string path = 4;              // a file; empty with tree = the whole repository
  bool tree = 5;                // list file paths under path instead of reading one
  int32 max_bytes = 6;          // cap on content; 0 = 256 KiB
}
message ReadRepoResponse {
  string sha = 1;               // the commit read
  bytes content = 2;
  repeated string paths = 3;    // with tree: file paths, capped
  string status = 4;            // "ok" | "missing" | "denied" | "too_large"
  string reason = 5;
  bool truncated = 6;
}

message BuildPreviewRequest {
  string workspace_id = 1;
  string repo = 2;              // owner/name
  string ref = 3;               // branch; empty = the default branch
}
message BuildPreviewResponse {
  string state = 1;             // "queued" | "building" | "done" | "failed" | "refused"
  string url = 2;               // when done
  string sha = 3;               // the commit being or been built
  string reason = 4;            // when failed or refused, in a sentence
  string framework = 5;
}

message OpenSetupPullRequestRequest {
  string workspace_id = 1;
  string repo = 2;              // owner/name, granted to the workspace
  string verify_token = 3;      // "tank-verify=…", written to .well-known/tank-verify.txt
  string bridge_tag = 4;        // the exact <script> tag, pinned by its hash
}
message OpenSetupPullRequestResponse {
  string url = 1;
  string state = 2;             // "open" | "merged" | "closed"
  string framework = 3;
  // Files the pull request changes, and what it could not place (then the person adds the
  // tag by hand; the note says where).
  repeated string files = 4;
  string note = 5;
}

message ReadElementAtRequest {
  string url = 1;               // https, public; checked again on TANK's side
  int32 viewport_width = 2;
  int32 viewport_height = 3;
  double x = 4;
  double y = 5;
}
message ReadElementAtResponse {
  string tag = 1;
  string text = 2;
  string test_id = 3;
  repeated string classes = 4;
  string selector = 5;
  double x = 6;
  double y = 7;
  double w = 8;
  double h = 9;
  string note = 10;             // why nothing was read
}

message MergeChangeRequest {
  string workspace_id = 1;
  string thread_root_id = 2;
  string sha = 3;
}
message MergeChangeResponse {
  bool merged = 1;
  string pull_request_url = 2;
  string note = 3;
}
