syntax = "proto3";

package tank.channel.v1;

import "google/protobuf/timestamp.proto";

// A Channel is presented as a "Tread" in the product: an objective-centric
// stream with a pinned Goal Header. The wire name stays Channel.
enum ChannelType {
  CHANNEL_TYPE_UNSPECIFIED = 0;
  CHANNEL_TYPE_PUBLIC = 1;
  CHANNEL_TYPE_PRIVATE = 2;
  CHANNEL_TYPE_DM = 3;
  CHANNEL_TYPE_MPDM = 4;
  // A Radar: a grid of widgets instead of a message list. See tank.monitor.v1.
  CHANNEL_TYPE_MONITOR = 5;
}

// Per-member notification level for a channel.
enum NotifyPref {
  NOTIFY_PREF_UNSPECIFIED = 0; // follow the workspace preference
  NOTIFY_PREF_ALL = 1;
  NOTIFY_PREF_MENTIONS = 2;
  NOTIFY_PREF_NOTHING = 3;
}

// The pinned Goal Header of a Tread.
message TreadGoal {
  string goal = 1;
  repeated string assignee_ids = 2;
  // Free-form pipeline status rendered in the header, e.g. "PR #12 · CI green".
  string pipeline_status = 3;
  google.protobuf.Timestamp updated_at = 4;
  string updated_by = 5;
}

message Channel {
  string id = 1;
  string workspace_id = 2;
  ChannelType type = 3;
  string name = 4;
  string topic = 5;
  string purpose = 6;
  // Gapless per-channel sequence of the newest message; unread = last_seq - last_read_seq.
  int64 last_seq = 7;
  int32 member_count = 8;
  google.protobuf.Timestamp last_message_at = 9;
  google.protobuf.Timestamp archived_at = 10;
  google.protobuf.Timestamp created_at = 11;
  TreadGoal goal = 12;
  // DM / MPDM participants.
  repeated string member_ids = 13;
  // Whether the caller is a member (public channels are listed even when not joined).
  bool joined = 14;
  // A generated or uploaded picture for the Tread; empty means the # or lock glyph.
  string icon_file_id = 15;
}

// Where the viewer has read to in one thread. Served with the bootstrap so a
// second device, or a fresh install, does not count every reply as new.
message ThreadReadState {
  string thread_root_id = 1;
  int64 last_read_thread_seq = 2;
}

message ChannelReadState {
  string channel_id = 1;
  int64 last_read_seq = 2;
  int32 mention_count = 3;
  bool muted = 4;
  bool starred = 5;
  NotifyPref notify_pref = 6;
  // How many messages after last_read_seq the channel view would actually show.
  //
  // last_seq - last_read_seq is not that number: every row consumes a
  // channel_seq, including thread replies the channel hides and messages that
  // were later deleted, so the arithmetic counted things nobody could read and
  // a Tread stayed unread with nothing new in it. Only the server can see what
  // is visible, so only the server can count it. Optional so a client can tell
  // "the server said zero" from "an older server said nothing" and fall back.
  optional int32 unread_count = 7;
}

message CreateChannelRequest {
  string workspace_id = 1;
  ChannelType type = 2;
  string name = 3;
  string purpose = 4;
  repeated string member_ids = 5; // DM/MPDM participants or initial invitees
}
message CreateChannelResponse {
  Channel channel = 1;
}

message ListChannelsRequest {
  string workspace_id = 1;
  // Only channels the caller can see; public ones the caller has not joined are included.
  bool include_unjoined_public = 2;
  string cursor = 3;
  int32 limit = 4;
}
message ListChannelsResponse {
  repeated Channel channels = 1;
  string next_cursor = 2;
}

message GetChannelRequest {
  string channel_id = 1;
}
message GetChannelResponse {
  Channel channel = 1;
  ChannelReadState read_state = 2;
}

message JoinChannelRequest {
  string channel_id = 1;
}
message JoinChannelResponse {
  Channel channel = 1;
}

message LeaveChannelRequest {
  string channel_id = 1;
}
message LeaveChannelResponse {}

message InviteToChannelRequest {
  string channel_id = 1;
  repeated string member_ids = 2;
}
message InviteToChannelResponse {}

message SetGoalRequest {
  string channel_id = 1;
  TreadGoal goal = 2;
}
message SetGoalResponse {
  Channel channel = 1;
}
// Any member of the Tread may set its icon; an empty file_id resets it.
message SetChannelIconRequest {
  string channel_id = 1;
  string file_id = 2;
}
message SetChannelIconResponse {
  Channel channel = 1;
}
// What "a Tread for the Q4 launch with a checklist and a Radar on signups" becomes:
// a name, a purpose, a goal header, posts to pin, and optionally a Radar.
message TreadPlan {
  string name = 1;    // the slug, lowercase-dashes
  string purpose = 2;
  string goal = 3;
  repeated PlannedPost pins = 4;
  bool radar = 5;
  repeated string radar_metrics = 6; // internal metric keys the Radar starts with
  string description = 7;            // what it was made from
}
message PlannedPost {
  string title = 1;
  string body = 2; // plain text, may hold a checklist as lines starting with "- [ ] "
}
// A sentence → a plan to review; nothing is created.
message DescribeTreadRequest {
  string workspace_id = 1;
  string description = 2; // at most 15 words
}
message DescribeTreadResponse {
  TreadPlan plan = 1;
}
// Creates the Tread (and Radar) the plan describes, as the caller.
message CreateTreadFromPlanRequest {
  string workspace_id = 1;
  TreadPlan plan = 2;
  bool private = 3;
}
message CreateTreadFromPlanResponse {
  Channel channel = 1;
  Channel radar = 2; // unset when the plan had none
}

message ListChannelMembersRequest {
  string channel_id = 1;
  string cursor = 2;
  int32 limit = 3;
}
message ListChannelMembersResponse {
  repeated string member_ids = 1;
  string next_cursor = 2;
}

// Unset fields are left unchanged.
message UpdateChannelRequest {
  string channel_id = 1;
  optional string name = 2;
  optional string topic = 3;
  optional string purpose = 4;
}
message UpdateChannelResponse {
  Channel channel = 1;
}

// Archived channels stay readable; posting is refused until unarchived.
message ArchiveChannelRequest {
  string channel_id = 1;
}
message ArchiveChannelResponse {
  Channel channel = 1;
}

// Deletes a Tread or Radar for everyone: it leaves every list and cannot be opened again.
// Admins, or whoever may archive it. #general cannot be deleted.
message DeleteChannelRequest {
  string channel_id = 1;
}
message DeleteChannelResponse {
  int32 cancelled_runs = 1; // agent runs that were still open in it and were cancelled
}

message UnarchiveChannelRequest {
  string channel_id = 1;
}
message UnarchiveChannelResponse {
  Channel channel = 1;
}

// The caller's own per-channel settings; unset fields are left unchanged.
message SetChannelPreferenceRequest {
  string channel_id = 1;
  optional NotifyPref notify_pref = 2;
  optional bool muted = 3;
  optional bool starred = 4;
}
message SetChannelPreferenceResponse {
  ChannelReadState read_state = 1;
}

service ChannelService {
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse);
  rpc JoinChannel(JoinChannelRequest) returns (JoinChannelResponse);
  rpc LeaveChannel(LeaveChannelRequest) returns (LeaveChannelResponse);
  rpc InviteToChannel(InviteToChannelRequest) returns (InviteToChannelResponse);
  rpc SetGoal(SetGoalRequest) returns (SetGoalResponse);
  rpc SetChannelIcon(SetChannelIconRequest) returns (SetChannelIconResponse);
  rpc DescribeTread(DescribeTreadRequest) returns (DescribeTreadResponse);
  rpc CreateTreadFromPlan(CreateTreadFromPlanRequest) returns (CreateTreadFromPlanResponse);
  rpc ListChannelMembers(ListChannelMembersRequest) returns (ListChannelMembersResponse);
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse);
  rpc ArchiveChannel(ArchiveChannelRequest) returns (ArchiveChannelResponse);
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse);
  rpc UnarchiveChannel(UnarchiveChannelRequest) returns (UnarchiveChannelResponse);
  rpc SetChannelPreference(SetChannelPreferenceRequest) returns (SetChannelPreferenceResponse);
}
