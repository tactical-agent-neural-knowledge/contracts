syntax = "proto3";

package tank.board.v1;

import "google/protobuf/timestamp.proto";

// Neuralboards: an infinite board inside the workspace, shared by people and the
// agent. Its difference from every other canvas is that a frame can hold the running
// application rather than a picture of one — see Frame.app below.

enum ObjectKind {
  OBJECT_KIND_UNSPECIFIED = 0;
  OBJECT_KIND_FRAME = 1;      // an artboard; may hold the running app
  OBJECT_KIND_RECT = 2;
  OBJECT_KIND_ELLIPSE = 3;
  OBJECT_KIND_LINE = 4;
  OBJECT_KIND_ARROW = 5;
  OBJECT_KIND_TEXT = 6;
  OBJECT_KIND_STICKY = 7;     // the FigJam/Lucidspark note
  OBJECT_KIND_IMAGE = 8;
  OBJECT_KIND_CONNECTOR = 9;  // joins two objects and follows them
  OBJECT_KIND_DRAW = 10;      // freehand, a path of points
}

// Where a thing sits. Boards are infinite, so these are board coordinates, not pixels
// on anybody's screen.
message Rect {
  double x = 1;
  double y = 2;
  double w = 3;
  double h = 4;
}

message Style {
  string fill = 1;          // #rrggbb, or empty for none
  string stroke = 2;
  double stroke_width = 3;
  double opacity = 4;       // 0..1; 0 is treated as 1 so an unset style is visible
  double corner_radius = 5;
  string dash = 6;          // "", "dashed", "dotted"
  int32 font_size = 7;
  string font_weight = 8;   // "", "500", "700"
  string align = 9;         // "", "center", "right"
  // "0 2 8 #00000055" — offset x, offset y, blur, colour. Empty for none.
  string shadow = 10;
  // Gaussian blur radius on the object itself.
  double blur = 11;
}

// A frame holding the running application. This is the product: not a screenshot, the
// app itself at a commit, which a person can click into and ask for changes.
message AppFrame {
  string repo = 1;               // owner/name
  string ref = 2;                // branch or sha the frame is showing
  string path = 3;               // route inside the app, e.g. /w/acme/books
  string platform = 4;           // "web" | "ios" | "android"
  int32 viewport_width = 5;      // the device the frame is standing in for
  int32 viewport_height = 6;
  string preview_url = 7;        // server-filled: where the running app is served
  string status = 8;             // server-filled: building | live | failed | asleep
  string note = 9;               // server-filled: why it is not live, in a sentence
  // The commit this frame was drawn from. Set when somebody draws or refreshes it;
  // comparing it with what is deployed now is how a board learns it has gone stale.
  string drawn_from_sha = 10;
  google.protobuf.Timestamp drawn_at = 11;
  // Server-filled: the app has moved on since this frame was drawn.
  bool moved_on = 12;
  string moved_note = 13;        // "the app has moved 23 commits since this was drawn"
}

message BoardObject {
  string id = 1;
  ObjectKind kind = 2;
  Rect at = 3;
  Style style = 4;
  string text = 5;              // text, sticky, and a label on a shape
  double rotation = 6;
  int32 z = 7;                  // paint order
  string parent_id = 8;         // the frame it belongs to, when it is inside one
  // Connector: the two things it joins, so it follows them when they move.
  string from_id = 9;
  string to_id = 10;
  repeated double points = 11;  // freehand: x,y pairs in board coordinates
  string file_id = 12;          // image
  string file_url = 13;         // server-filled
  AppFrame app = 14;            // frame only
  bool locked = 15;
  // Relationships a renderer does not need but an editor does: which component this
  // is an instance of, the named style it follows, how a frame lays its children out,
  // how a child is pinned when its parent resizes, whether it is hidden.
  //
  // One opaque string rather than a field per idea, because these are the editor's
  // own vocabulary and will keep growing; geometry and colour stay in their real
  // fields so a renderer that knows nothing about any of this still draws the board
  // correctly. Clients that do not understand a record leave it alone.
  string meta = 18;
  string created_by = 16;
  // Bumped on every write, so two people editing different objects never collide and
  // the same object twice is reported rather than silently overwritten.
  int32 rev = 17;
}

message Board {
  string id = 1;
  string workspace_id = 2;
  string channel_id = 3;        // the Tread it belongs to; empty for workspace-wide
  string title = 4;
  string icon = 5;
  repeated BoardObject objects = 6;
  int32 version = 7;
  string created_by = 8;
  google.protobuf.Timestamp created_at = 9;
  string updated_by = 10;
  google.protobuf.Timestamp updated_at = 11;
  // 0 is current; 100 is nothing it was drawn from is still as it was. The same idea
  // as a Neuralcanvas page: a board nobody can trust is a board nobody opens.
  int32 staleness = 12;
  // What has moved, in a sentence. Empty when the board still matches the product.
  string staleness_note = 13;
}

message BoardSummary {
  string id = 1;
  string title = 2;
  string icon = 3;
  int32 objects = 4;
  int32 app_frames = 5;
  google.protobuf.Timestamp updated_at = 6;
  string channel_id = 7;
  int32 staleness = 8;
  string staleness_note = 9;
}

message ListBoardsRequest {
  string workspace_id = 1;
  string channel_id = 2;
  int32 limit = 3;
}
message ListBoardsResponse { repeated BoardSummary boards = 1; }

message GetBoardRequest {
  string workspace_id = 1;
  string id = 2;
}
message GetBoardResponse { Board board = 1; }

message CreateBoardRequest {
  string workspace_id = 1;
  string channel_id = 2;
  string title = 3;
  string icon = 4;
  repeated BoardObject objects = 5;
  // A starting shape, from ListTemplates. Nobody opens a blank infinite canvas and
  // feels invited; a flowchart that already has three boxes and two arrows does.
  string template = 6;
}
message CreateBoardResponse { Board board = 1; }

message UpdateBoardRequest {
  string workspace_id = 1;
  string id = 2;
  string title = 3;
  string icon = 4;
  // Which Tread the board belongs to. A board with no Tread has nowhere for a change
  // request to be discussed, and without this there was no way out of that state.
  string channel_id = 5;
  bool set_channel = 6;
}
message UpdateBoardResponse { Board board = 1; }

message DeleteBoardRequest {
  string workspace_id = 1;
  string id = 2;
}
message DeleteBoardResponse {}

// One object at a time, for the same reason a canvas page writes one block at a time:
// two people moving different shapes are not in conflict, and the only real collision
// is the same shape twice.
message PutObjectsRequest {
  string workspace_id = 1;
  string board_id = 2;
  repeated BoardObject objects = 3;   // created when the id is unknown, else updated
  repeated string delete_ids = 4;
  // The revs the editor started from, keyed by object id. A mismatch is reported
  // rather than overwritten. Empty means "do not check".
  map<string, int32> base_revs = 5;
}
message PutObjectsResponse {
  Board board = 1;
  // Objects somebody else changed while this editor was working on them. Nothing was
  // overwritten; these are their versions.
  repeated BoardObject conflicts = 2;
  string conflict_note = 3;
}

// What was clicked inside a running frame: the element, and where it came from in
// the source. The browser inside the frame reports this; it is the whole reason the
// preview build stamps elements with their origin.
message Element {
  string source = 1;        // "src/features/shell/Logo.tsx:8:5"
  string tag = 2;           // "button"
  string text = 3;          // what it says, for a human to recognise it by
  string test_id = 4;
  Rect at = 5;              // where it sits inside the frame
  repeated string classes = 6;
}

// Ask for a change to something in a running frame. This is the product's point: the
// design and the code stop being two places.
message RequestChangeRequest {
  string workspace_id = 1;
  string board_id = 2;
  string object_id = 3;     // the frame it was asked of
  Element element = 4;
  string ask = 5;           // "make this the same blue as the header"
}
message RequestChangeResponse {
  // Where the work is being discussed and watched: a thread in the Tread the board
  // belongs to, which is where the agent posts its plan and its cards.
  string thread_root_id = 6;
  string channel_id = 7;
  // What was asked, as it was sent to the agent, so the board can show it back.
  string prompt = 8;
}

message BoardTemplate {
  string name = 1;          // what to pass as CreateBoardRequest.template
  string title = 2;
  string icon = 3;
  string about = 4;         // one line: what it is for
  string group = 5;         // "Diagram" | "Design" | "Together" | "From your code"
}

message ListTemplatesRequest {}
message ListTemplatesResponse { repeated BoardTemplate templates = 1; }

// Export a board, or part of one, as a file somebody can send to a person who does
// not have a TANK account.
message ExportBoardRequest {
  string workspace_id = 1;
  string id = 2;
  string format = 3;            // "svg"
  repeated string object_ids = 4;  // empty exports everything
  bool transparent = 5;
}
message ExportBoardResponse {
  string filename = 1;
  string content_type = 2;
  bytes body = 3;
}

// One thing somebody did while clicking through a running frame.
message FlowStep {
  Element element = 1;
  string action = 2;        // "click" | "fill" | "press" | "expect" | "goto"
  string value = 3;         // what was typed, the key, or the text expected
  string note = 4;          // what the person said about this step
}

// Turn a journey through the running app into a test. Clicking through a flow to
// check it works and writing the test that checks it works are the same activity
// done twice; this makes the second one fall out of the first.
message GenerateTestRequest {
  string workspace_id = 1;
  string board_id = 2;
  string object_id = 3;     // the frame the flow was recorded in
  string name = 4;          // "a customer pays an invoice"
  repeated FlowStep steps = 5;
}
message GenerateTestResponse {
  string playwright_path = 1;   // e2e/<name>.spec.ts
  string playwright = 2;
  string maestro_path = 3;      // mobile/.maestro/<name>.yaml
  string maestro = 4;
  // Steps the recorder could not turn into an assertion anybody should trust.
  repeated string skipped = 5;
}

service BoardService {
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);
  rpc GetBoard(GetBoardRequest) returns (GetBoardResponse);
  rpc CreateBoard(CreateBoardRequest) returns (CreateBoardResponse);
  rpc UpdateBoard(UpdateBoardRequest) returns (UpdateBoardResponse);
  rpc DeleteBoard(DeleteBoardRequest) returns (DeleteBoardResponse);
  rpc PutObjects(PutObjectsRequest) returns (PutObjectsResponse);
  rpc RequestChange(RequestChangeRequest) returns (RequestChangeResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc ExportBoard(ExportBoardRequest) returns (ExportBoardResponse);
  rpc GenerateTest(GenerateTestRequest) returns (GenerateTestResponse);
}
