syntax = "proto3";

package tank.billing.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/tactical-agent-neural-knowledge/contracts/gen/go/tank/billing/v1;billingv1";

// BillingService is what money goes through: taking over a product from the board,
// and keeping a workspace that has agents in it.
//
// Two shapes of charge. Taking over an agenture is a one-off whose size depends on
// how much agent work has gone into it, and it starts a subscription. A venture is
// free until it has agents, and then it is the same subscription.

// Price is what a product costs to take over right now, and why.
message Price {
  string slug = 1;
  string name = 2;
  string description = 3;
  int64 agent_minutes = 4;   // how much agent work has gone into it
  int64 price_cents = 5;     // what that makes it cost today
  bool available = 6;        // false once somebody has taken it over
}

// GetPrice is public: the claim page shows it before anybody has signed in.
message GetPriceRequest { string slug = 1; }
message GetPriceResponse { Price price = 1; }

// StartClaimCheckout begins paying for a product. It holds the product for a short
// while so that two people cannot pay for the same one, and returns somewhere to pay.
message StartClaimCheckoutRequest {
  string slug = 1;
  // Where to send the buyer afterwards. Must be a path on the app's own origin.
  string success_path = 2;
  string cancel_path = 3;
}
message StartClaimCheckoutResponse {
  string checkout_url = 1;
  google.protobuf.Timestamp held_until = 2;
}

// Subscription is what a workspace is paying, and what it is running up.
message Subscription {
  string workspace_id = 1;
  string plan = 2;                        // free | premium
  string status = 3;                       // none | active | past_due | canceled
  int64 monthly_cents = 4;
  int64 agent_minute_cents = 5;
  // This period's agent time and what it has cost so far.
  int64 agent_minutes_this_period = 6;
  int64 agent_fees_cents_this_period = 7;
  google.protobuf.Timestamp period_end = 8;
  bool has_agents = 9;
  // The add-ons on for the workspace: shield, books, blueprint, atlas.
  repeated string addons = 10;
  // Agent usage this calendar month at the metered price, and the cap an owner set.
  int64 agent_usage_cents_this_month = 11;
  int64 agent_cap_cents = 12;
  // Who sold the subscription: "stripe", "apple", "manual", or "" for none. "fake" in
  // a build with no provider, which the clients read as "write to us instead".
  string provider = 13;
  // How many seats premium covers; the first ten are the flat price.
  int32 seats = 14;
}

message GetSubscriptionRequest { string workspace_id = 1; }
message GetSubscriptionResponse { Subscription subscription = 1; }

// StartUpgradeCheckout starts a subscription on the web: premium (the workspace's seat
// count is the quantity), an add-on, or the bundle. The phone buys through the App
// Store instead and reports the purchase with VerifyAppleTransaction.
message StartUpgradeCheckoutRequest {
  string workspace_id = 1;
  string success_path = 2;
  string cancel_path = 3;
  // premium | shield | books | blueprint | atlas | bundle. Empty means premium.
  string product = 4;
}
message StartUpgradeCheckoutResponse { string checkout_url = 1; }

// OpenBillingPortal sends an owner to change a card or cancel.
message OpenBillingPortalRequest {
  string workspace_id = 1;
  string return_path = 2;
}
message OpenBillingPortalResponse { string url = 1; }

// VerifyAppleTransaction hands the api a signed StoreKit transaction so the purchase
// counts here the same way a Stripe checkout does. Apple's own server notifications
// keep it current afterwards.
message VerifyAppleTransactionRequest {
  string workspace_id = 1;
  // The JWS of the transaction, as StoreKit 2 gives it to the app.
  string signed_transaction = 2;
}
message VerifyAppleTransactionResponse {
  string product = 1;
  string status = 2;
}

// SetAgentCap is the owner raising or lowering the month's agent usage cap. A run that
// would go past it is refused with the sentence saying so; the default is in
// docs/pricing/CLAIMS.md.
message SetAgentCapRequest {
  string workspace_id = 1;
  int64 agent_cap_cents = 2;
}
message SetAgentCapResponse {
  int64 agent_cap_cents = 1;
}

service BillingService {
  rpc GetPrice(GetPriceRequest) returns (GetPriceResponse);
  rpc StartClaimCheckout(StartClaimCheckoutRequest) returns (StartClaimCheckoutResponse);
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);
  rpc StartUpgradeCheckout(StartUpgradeCheckoutRequest) returns (StartUpgradeCheckoutResponse);
  rpc OpenBillingPortal(OpenBillingPortalRequest) returns (OpenBillingPortalResponse);
  rpc VerifyAppleTransaction(VerifyAppleTransactionRequest) returns (VerifyAppleTransactionResponse);
  rpc SetAgentCap(SetAgentCapRequest) returns (SetAgentCapResponse);

  // Services (2026-10-20): a person subscribes to one service product, monthly. It
  // unlocks that product's upcoming predictions in the apps and through an API key.
  rpc StartServiceCheckout(StartServiceCheckoutRequest) returns (StartServiceCheckoutResponse);
  rpc ListServiceSubscriptions(ListServiceSubscriptionsRequest) returns (ListServiceSubscriptionsResponse);
  rpc OpenServicePortal(OpenServicePortalRequest) returns (OpenServicePortalResponse);
  // A new key replaces the old one; the key is shown once and stored as a hash.
  rpc CreateServiceApiKey(CreateServiceApiKeyRequest) returns (CreateServiceApiKeyResponse);

  // Agent time (2026-11-06) is prepaid. Premium includes an amount each month, spent
  // first; past it an admin buys agent time in advance, by hand or with auto-refill.
  // At zero no run starts and a running one stops with its work saved.
  rpc GetAgentTime(GetAgentTimeRequest) returns (GetAgentTimeResponse);
  rpc StartAgentTimeCheckout(StartAgentTimeCheckoutRequest) returns (StartAgentTimeCheckoutResponse);
  rpc SetAutoRefill(SetAutoRefillRequest) returns (SetAutoRefillResponse);
}

// AgentTime is a workspace's prepaid agent time. Every amount is in cents of what
// the workspace pays (agent usage is priced at cost x 2 before it reaches here).
message AgentTime {
  int64 balance_cents = 1;                // purchased time left; may dip a little below zero
  int64 included_cents = 2;               // included with Premium each month
  int64 included_left_cents = 3;          // of that, what is left this month
  int64 used_this_month_cents = 4;        // all agent usage this month
  bool blocked = 5;                       // true when nothing is left and no run may start
  AutoRefill auto_refill = 6;
  int64 auto_refilled_this_month_cents = 7;
  bool has_payment_method = 8;            // a saved card auto-refill can charge
  repeated AgentTimeEntry history = 9;    // newest first
  repeated int64 pack_cents = 10;         // the preset amounts to buy
  int64 min_custom_cents = 11;            // the smallest custom amount
  bool can_manage = 12;                   // the caller may buy and change auto-refill
  bool prepaid = 13;                      // false: the workspace is not on prepaid agent time yet
}

message AutoRefill {
  bool enabled = 1;
  int64 below_cents = 2;                  // refill when the balance falls below this
  int64 amount_cents = 3;                 // how much each refill buys
  int64 monthly_cap_cents = 4;            // the most auto-refill may buy in a month; 0 = no cap
  string last_error = 5;                  // why the last refill failed, in words people read
}

message AgentTimeEntry {
  string kind = 1;                        // purchase | auto_refill | adjustment
  int64 cents = 2;
  google.protobuf.Timestamp at = 3;
  string note = 4;
}

message GetAgentTimeRequest { string workspace_id = 1; }
message GetAgentTimeResponse { AgentTime agent_time = 1; }

message StartAgentTimeCheckoutRequest {
  string workspace_id = 1;
  int64 cents = 2;
  string return_path = 3;
}
message StartAgentTimeCheckoutResponse { string checkout_url = 1; }

message SetAutoRefillRequest {
  string workspace_id = 1;
  AutoRefill auto_refill = 2;             // last_error is ignored
}
message SetAutoRefillResponse { AgentTime agent_time = 1; }

message ServiceSubscription {
  string product_workspace_id = 1;
  string product_slug = 2;
  string product_name = 3;
  string status = 4;                      // active, past_due, canceled
  google.protobuf.Timestamp current_period_end = 5;
  int64 price_cents = 6;
  bool has_api_key = 7;
  string api_key_hint = 8;                // the last six characters
}

message StartServiceCheckoutRequest {
  string product_slug = 1;
  string return_path = 2;
}
message StartServiceCheckoutResponse { string checkout_url = 1; }

message ListServiceSubscriptionsRequest {}
message ListServiceSubscriptionsResponse {
  repeated ServiceSubscription subscriptions = 1;
  int64 price_cents = 2;                  // what one service costs a month
}

message OpenServicePortalRequest { string return_path = 1; }
message OpenServicePortalResponse { string portal_url = 1; }

message CreateServiceApiKeyRequest {}
message CreateServiceApiKeyResponse {
  string key = 1;                         // shown once
  string hint = 2;
}
