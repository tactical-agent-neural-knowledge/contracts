syntax = "proto3";

package tank.books.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/tactical-agent-neural-knowledge/contracts/gen/go/tank/books/v1;booksv1";

// Neuralbooks: the money side of a small business, kept by an agent inside the
// workspace. Double entry underneath; the surface is customers, invoices,
// payments, expenses and a cash summary. Amounts are integer cents in the
// workspace's currency. Ids are Snowflake ids as strings, like everything else.

enum InvoiceStatus {
  INVOICE_STATUS_UNSPECIFIED = 0;
  INVOICE_STATUS_DRAFT = 1;   // written, not sent
  INVOICE_STATUS_SENT = 2;    // sent, unpaid, not yet due
  INVOICE_STATUS_OVERDUE = 3; // sent, unpaid, past due
  INVOICE_STATUS_PAID = 4;    // paid in full
  INVOICE_STATUS_VOID = 5;    // cancelled; never counted
}

message Settings {
  bool enabled = 1;            // Neuralbooks is on for this workspace (premium)
  string currency = 2;         // ISO 4217, e.g. "USD"
  string business_name = 3;    // on invoices
  string invoice_prefix = 4;   // e.g. "INV-"
  int32 next_invoice_number = 5;
  int32 default_due_days = 6;  // invoices are due this many days after issue
  int32 chase_every_days = 7;  // the agent chases an unpaid invoice on this cadence; 0 = never
  // Tools this business competes with or replaces, by name as people say them
  // ("QuickBooks"): the market panel reads TANK's research on them.
  repeated string competes_with = 8;
  // How a customer pays: bank details or instructions, printed on the invoice page.
  string payment_instructions = 9;
  // The business's own Stripe secret key, so money goes to the business, not to TANK.
  // Write-only: set it to store it, send it empty to leave it alone, and read it back
  // as the last four characters in stripe_key_hint.
  string stripe_secret_key = 10;
  string stripe_key_hint = 11;   // e.g. "…a4F2"; empty when no key is stored
  bool payments_ready = 12;      // a key is stored, so sent invoices carry a pay link
  // The month the fiscal year starts, 1 (January, the default) to 12. Quarters and
  // years in a statement are cut from it. A fiscal year is named by the calendar year
  // it ends in: with April, April 2026 to March 2027 is FY2027.
  int32 fiscal_year_start_month = 13;
  // IANA zone the books are kept in, e.g. "America/New_York". Every period (a month,
  // a quarter, "this month" in a report) is cut at midnight here. Empty on write
  // leaves it as it is; it defaults to the workspace owner's zone, else UTC.
  string timezone = 14;
  // The Tread Books notices and the CFO post in; empty for none.
  string finance_channel_id = 15;
}

message Customer {
  string id = 1;
  string name = 2;
  string email = 3;
  string notes = 4;
  google.protobuf.Timestamp created_at = 5;
  int64 owed_cents = 6;        // open invoices, for the list
}

message InvoiceLine {
  string description = 1;
  double quantity = 2;
  int64 unit_cents = 3;
  int64 total_cents = 4;       // quantity × unit, server-computed
}

message Invoice {
  string id = 1;
  string customer_id = 2;
  string customer_name = 3;
  string number = 4;           // prefix + sequence, e.g. INV-0007
  InvoiceStatus status = 5;
  repeated InvoiceLine lines = 6;
  int64 subtotal_cents = 7;
  int64 tax_cents = 8;
  int64 total_cents = 9;
  int64 paid_cents = 10;
  int64 due_cents = 11;        // total − paid
  google.protobuf.Timestamp issued_at = 12;
  google.protobuf.Timestamp due_at = 13;
  google.protobuf.Timestamp sent_at = 14;
  google.protobuf.Timestamp paid_at = 15;
  string notes = 16;
  // Where it came from: the thread it was asked for in, when a person asked the agent.
  string thread_root_id = 17;
  // The learning layer's read: when this invoice will actually be paid, and how sure.
  google.protobuf.Timestamp predicted_paid_at = 18;
  double predicted_confidence = 19;
  google.protobuf.Timestamp last_chased_at = 20;
  int32 chase_count = 21;
  // A page the customer can open without an account: the invoice, how to pay, and
  // its state. Set once the invoice is sent.
  string share_url = 22;
  // Where the customer pays by card, when the business has connected Stripe. Minted
  // when the invoice is sent.
  string pay_url = 23;
  // The income category the invoice's revenue is filed under (a Category id).
  string category_id = 24;
}

message Payment {
  string id = 1;
  string invoice_id = 2;
  int64 amount_cents = 3;
  google.protobuf.Timestamp at = 4;
  string method = 5;           // bank, card, cash, other
  string reference = 6;
}

message Expense {
  string id = 1;
  string vendor = 2;
  string category = 3;         // e.g. software, travel, supplies
  int64 amount_cents = 4;
  google.protobuf.Timestamp at = 5;
  string notes = 6;
  string receipt_file_id = 7;  // a TANK file, when it came from a receipt
  string booked_by = 8;        // user id, or "agent"
  google.protobuf.Timestamp created_at = 9;
  // The period a bill or a usage figure covers (a cloud bill for October: Oct 1 to
  // Oct 31, both inclusive, at midnight UTC). Unset for a one-off purchase.
  google.protobuf.Timestamp period_start = 10;
  google.protobuf.Timestamp period_end = 11;
  // Where the figure came from, e.g. "aws-cost-explorer". With the period and the
  // category it is the key a repeated collection revises instead of duplicating.
  string source = 12;
  // The expense category it is filed under (a Category id). `category` above is the
  // old free text and stays until every client reads this.
  string category_id = 13;
  // When the money went out. Unset = an unpaid bill: it counts as spent when earned
  // and as cash out only once it is paid.
  google.protobuf.Timestamp paid_at = 14;
  // The category was filed automatically from old free text that matched nothing
  // (it sits under Other) and a person should check it.
  bool category_needs_review = 15;
}

enum CategoryKind {
  CATEGORY_KIND_UNSPECIFIED = 0;
  CATEGORY_KIND_INCOME = 1;
  CATEGORY_KIND_EXPENSE = 2;
}

// A line on the statement. Every workspace starts with the standard chart; people may
// add categories or rename them within a group, never move one between groups.
message Category {
  string id = 1;
  string key = 2;              // stable machine name, e.g. "hosting"
  string name = 3;             // what people read, e.g. "Hosting"
  CategoryKind kind = 4;
  // income | cost_of_revenue | payroll | operating. Gross profit is income less
  // cost_of_revenue.
  string group = 5;
  int32 sort = 6;
  bool archived = 7;
  bool standard = 8;           // from the standard chart, not added by a person
}

// "Cash in the bank on <date>": what ending cash is counted from.
message CashBalance {
  string id = 1;
  // The day, at midnight in the books' timezone; the amount is the balance at the
  // end of that day.
  google.protobuf.Timestamp as_of = 2;
  int64 amount_cents = 3;
  string note = 4;
  string set_by = 5;           // user id, or "agent"
  google.protobuf.Timestamp created_at = 6;
}

// The numbers a person asks for first, with nothing to click into.
message CashSummary {
  google.protobuf.Timestamp as_of = 1;
  string currency = 2;
  int64 owed_cents = 3;            // open invoices
  int64 overdue_cents = 4;         // the part past due
  int32 open_invoices = 5;
  int32 overdue_invoices = 6;
  int64 received_30d_cents = 7;    // payments in the last 30 days
  int64 spent_30d_cents = 8;       // expenses in the last 30 days
  int64 expected_30d_cents = 9;    // what the model expects to arrive in the next 30 days
  int64 expected_6w_cents = 10;    // and in six weeks
}

message GetSettingsRequest { string workspace_id = 1; }
message GetSettingsResponse { Settings settings = 1; }
message UpdateSettingsRequest {
  string workspace_id = 1;
  Settings settings = 2;
}
message UpdateSettingsResponse { Settings settings = 1; }

message ListCustomersRequest { string workspace_id = 1; }
message ListCustomersResponse { repeated Customer customers = 1; }
message UpsertCustomerRequest {
  string workspace_id = 1;
  string id = 2;               // empty to create
  string name = 3;
  string email = 4;
  string notes = 5;
}
message UpsertCustomerResponse { Customer customer = 1; }

message ListInvoicesRequest {
  string workspace_id = 1;
  InvoiceStatus status = 2;    // unspecified = all but void
  string customer_id = 3;
}
message ListInvoicesResponse { repeated Invoice invoices = 1; }
message GetInvoiceRequest {
  string workspace_id = 1;
  string id = 2;
  // Mint a new share link and stop the old one working.
  //
  // The share token is stored as a hash, so an ordinary read returns an empty
  // share_url: the link exists once, when the invoice is created or sent, and cannot
  // be read back afterwards by anyone including TANK. That is right for a credential
  // and it leaves one hole — a business that loses the link has no way to get another,
  // and an unpaid invoice nobody can open is a billing problem rather than a security
  // one. This is that way out. Admin only, and the old link dies the moment the new
  // one is issued, because a rotation that leaves both working is not a rotation.
  bool rotate = 3;
}
message GetInvoiceResponse {
  Invoice invoice = 1;
  repeated Payment payments = 2;
}
message CreateInvoiceRequest {
  string workspace_id = 1;
  string customer_id = 2;      // or customer_name to find-or-create
  string customer_name = 3;
  repeated InvoiceLine lines = 4;
  int64 tax_cents = 5;
  int32 due_days = 6;          // 0 = the workspace default
  string notes = 7;
  string thread_root_id = 8;
  bool send = 9;               // send on creation
  string category_id = 10;     // an income Category id; empty = Sales
}
message CreateInvoiceResponse { Invoice invoice = 1; }
message SendInvoiceRequest {
  string workspace_id = 1;
  string id = 2;
}
message SendInvoiceResponse { Invoice invoice = 1; }
message RecordPaymentRequest {
  string workspace_id = 1;
  string invoice_id = 2;
  int64 amount_cents = 3;      // 0 = the amount due
  string method = 4;
  string reference = 5;
  google.protobuf.Timestamp at = 6;
  // When the agent records a payment: the message in its thread where a person said
  // the money arrived. A payment is money received, never a charge or a receivable,
  // so an agent's payment without one is refused. A person's own call needs none.
  string evidence_message_id = 7;
}
message RecordPaymentResponse {
  Invoice invoice = 1;
  Payment payment = 2;
}
message VoidInvoiceRequest {
  string workspace_id = 1;
  string id = 2;
  string reason = 3;
}
message VoidInvoiceResponse { Invoice invoice = 1; }

message ListExpensesRequest {
  string workspace_id = 1;
  int32 days = 2;              // 0 = 90
  // Only the expenses filed automatically whose category a person should check, at
  // any date (days is ignored).
  bool needs_review = 3;
}
message ListExpensesResponse { repeated Expense expenses = 1; }
message RecordExpenseRequest {
  string workspace_id = 1;
  string vendor = 2;
  string category = 3;
  int64 amount_cents = 4;
  google.protobuf.Timestamp at = 5;
  string notes = 6;
  string receipt_file_id = 7;
  // The period the expense covers. Required with a source; the expense is dated at
  // the period's end. Booking the same source, category and period start again
  // revises that expense (amount, end) rather than adding a second one.
  google.protobuf.Timestamp period_start = 8;
  google.protobuf.Timestamp period_end = 9;
  string source = 10;
  // A Category id; empty files it from `category` text (unknown text goes under Other).
  string category_id = 11;
  // Unset = paid when it happened, as before. false = an unpaid bill (pay it later
  // with PayExpense); true = paid, at paid_at or else at the expense's date.
  optional bool paid = 12;
  google.protobuf.Timestamp paid_at = 13;
}
message RecordExpenseResponse {
  Expense expense = 1;
  string outcome = 2;          // booked | revised | unchanged
}

message GetCashSummaryRequest { string workspace_id = 1; }
message GetCashSummaryResponse { CashSummary summary = 1; }

// The bank feed, as a file first. A line is money in (positive) or out (negative);
// reconciliation is matching each line to an invoice or an expense, and the match
// always says why in a sentence.
message BankTransaction {
  string id = 1;
  google.protobuf.Timestamp at = 2;
  string description = 3;
  int64 amount_cents = 4;          // positive in, negative out
  string reference = 5;
  string matched_kind = 6;         // "" | invoice | expense
  string matched_id = 7;
  string matched_label = 8;        // e.g. "INV-0007 · Acme" or "AWS · hosting"
  string explanation = 9;          // why it matched, or why it is suggested
  // The best guess for an unmatched line, when there is one.
  string suggested_kind = 10;      // invoice | expense | new_expense
  string suggested_id = 11;
  string suggested_label = 12;
  double suggested_confidence = 13;
}
message ImportBankTransactionsRequest {
  string workspace_id = 1;
  string csv = 2;                  // a bank export: date, description, amount (or debit/credit), reference
  string account_name = 3;
}
message ImportBankTransactionsResponse {
  int32 imported = 1;
  int32 skipped = 2;               // already known
  int32 auto_matched = 3;          // matched on the spot, with an explanation
  repeated BankTransaction transactions = 4;
}
message ListBankTransactionsRequest {
  string workspace_id = 1;
  bool unmatched_only = 2;
}
message ListBankTransactionsResponse { repeated BankTransaction transactions = 1; }
message MatchBankTransactionRequest {
  string workspace_id = 1;
  string transaction_id = 2;
  string invoice_id = 3;           // money in: records a payment on it
  string expense_id = 4;           // money out: ties to an expense already booked
  string new_expense_vendor = 5;   // money out: books a new expense with this vendor
  string new_expense_category = 6;
}
message MatchBankTransactionResponse { BankTransaction transaction = 1; }

// A report is an answer: how the period went, from the journal, in the words a person
// asks with. Profit is revenue less expenses; cash is what the journal says is in hand.
message ReportLine {
  string label = 1;              // e.g. "hosting", or a customer's name
  int64 cents = 2;
}
message Report {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  string currency = 3;
  int64 revenue_cents = 4;       // invoiced in the period
  int64 expenses_cents = 5;
  int64 profit_cents = 6;        // revenue − expenses
  int64 received_cents = 7;      // payments that arrived
  int64 cash_cents = 8;          // cash account balance, all time
  int64 receivable_cents = 9;    // still owed, all time
  repeated ReportLine expenses_by_category = 10;
  repeated ReportLine revenue_by_customer = 11;
  string sentence = 12;          // the report in one sentence
}
// A receipt, read by the model: what a person would have typed in.
message ReadReceiptRequest {
  string workspace_id = 1;
  string file_id = 2;              // an image or PDF already uploaded to this workspace
}
message ReadReceiptResponse {
  string vendor = 1;
  string category = 2;
  int64 amount_cents = 3;
  google.protobuf.Timestamp at = 4;
  double confidence = 5;           // 0 to 1; low means ask the person
  string note = 6;                 // what could not be read, in a sentence
  string currency = 7;             // as printed on the receipt, when it differs
}

// Everything in the period as a file an accountant can open.
message ExportRequest {
  string workspace_id = 1;
  string period = 2;               // as in a report
  string kind = 3;                 // invoices | expenses | journal | statement
  // For kind statement: the statement to write (its workspace_id is ignored). Unset =
  // this fiscal year by month, earned. period is not used for a statement.
  GetStatementRequest statement = 4;
  // For the other kinds with period "custom": the window, from inclusive, to exclusive.
  google.protobuf.Timestamp from = 5;
  google.protobuf.Timestamp to = 6;
}
message ExportResponse {
  string filename = 1;
  string csv = 2;
  int32 rows = 3;
}

message GetReportRequest {
  string workspace_id = 1;
  // this_month | last_month | this_quarter | last_quarter | this_year | last_year |
  // last_30_days (default) | custom. Quarters and years are fiscal, cut in the books'
  // timezone.
  string period = 2;
  // For custom: from inclusive, to exclusive.
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}
message GetReportResponse { Report report = 1; }

message ListCategoriesRequest {
  string workspace_id = 1;
  bool include_archived = 2;
}
message ListCategoriesResponse { repeated Category categories = 1; }
message UpsertCategoryRequest {
  string workspace_id = 1;
  string id = 2;               // empty to add one
  string name = 3;
  string group = 4;            // required to add; a category never changes group
  bool archived = 5;           // archive (true) or bring back (false); edits only
  int32 sort = 6;              // 0 = leave (edit) or after the group's last (add)
}
message UpsertCategoryResponse { Category category = 1; }

message SetCashBalanceRequest {
  string workspace_id = 1;
  google.protobuf.Timestamp as_of = 2;   // the day; unset = today
  int64 amount_cents = 3;                // may be negative (overdrawn)
  string note = 4;
}
message SetCashBalanceResponse { CashBalance balance = 1; }

message PayExpenseRequest {
  string workspace_id = 1;
  string id = 2;                         // an unpaid bill
  google.protobuf.Timestamp paid_at = 3; // unset = now
}
message PayExpenseResponse { Expense expense = 1; }

enum StatementGrain {
  STATEMENT_GRAIN_UNSPECIFIED = 0;  // = month
  STATEMENT_GRAIN_MONTH = 1;
  STATEMENT_GRAIN_QUARTER = 2;      // fiscal quarters
  STATEMENT_GRAIN_YEAR = 3;         // fiscal years
}

enum StatementBasis {
  STATEMENT_BASIS_UNSPECIFIED = 0;  // = earned
  STATEMENT_BASIS_EARNED = 1;       // the P&L: invoiced and billed, from the journal
  STATEMENT_BASIS_CASH = 2;         // money that arrived and went out
}

enum PeriodKind {
  PERIOD_KIND_UNSPECIFIED = 0;
  PERIOD_KIND_PAST = 1;
  PERIOD_KIND_CURRENT = 2;          // today falls in it: actual to date + expected rest
  PERIOD_KIND_FUTURE = 3;
}

enum CellState {
  CELL_STATE_UNSPECIFIED = 0;
  CELL_STATE_ACTUAL = 1;
  CELL_STATE_EXPECTED = 2;
  CELL_STATE_MIXED = 3;             // actual to date plus expected for the rest
}

enum StatementRowKind {
  STATEMENT_ROW_KIND_UNSPECIFIED = 0;
  STATEMENT_ROW_KIND_CATEGORY = 1;
  STATEMENT_ROW_KIND_SUBTOTAL = 2;  // a group's total
  STATEMENT_ROW_KIND_TOTAL = 3;     // gross profit, net and the cash lines
}

// One column of a statement.
message StatementPeriod {
  // month "2026-04", quarter "FY2027-Q1", year "FY2027" (named by the calendar year
  // the fiscal year ends in). Accepted back as from_period / to_period.
  string key = 1;
  string label = 2;                         // e.g. "Apr 2026", "Q1 FY2027", "FY2027"
  google.protobuf.Timestamp start = 3;      // inclusive, midnight in the books' timezone
  google.protobuf.Timestamp end = 4;        // exclusive
  PeriodKind kind = 5;
}

// One figure. What the cell shows is actual + expected; budget is beside it.
// Expected and budget are zero until forecasts (phase 2) and budgets (phase 3).
message StatementCell {
  int64 actual_cents = 1;
  int64 expected_cents = 2;
  int64 budget_cents = 3;
  CellState state = 4;
}

message StatementRow {
  StatementRowKind kind = 1;
  string category_id = 2;        // for a category row
  string group = 3;              // income | cost_of_revenue | payroll | operating; empty on totals
  string label = 4;
  // Stable name for subtotals and totals: "group:income", "group:cost_of_revenue",
  // "group:payroll", "group:operating", "expenses", "gross_profit", "net",
  // "cash_in", "cash_out", "ending_cash". Empty on category rows.
  string key = 5;
  repeated StatementCell cells = 6;   // one per period, in order
  StatementCell total = 7;            // across every period; unset for ending_cash
}

message GetStatementRequest {
  string workspace_id = 1;
  StatementGrain grain = 2;
  StatementBasis basis = 3;
  // The range, by period key ("2026-04", "FY2027-Q1", "FY2027") of any grain, or by
  // dates: every period that overlaps [from, to) is a column. Nothing given = this
  // fiscal year (year grain: the last two fiscal years and this one).
  string from_period = 4;
  string to_period = 5;
  google.protobuf.Timestamp from = 6;
  google.protobuf.Timestamp to = 7;
  // A scenario to lay over the forecast (phase 4). Ignored until then.
  string scenario_id = 8;
}

message GetStatementResponse {
  string currency = 1;
  StatementGrain grain = 2;
  StatementBasis basis = 3;
  int32 fiscal_year_start_month = 4;
  string timezone = 5;
  repeated StatementPeriod periods = 6;
  // Income categories and their subtotal, then each expense group's categories and
  // subtotal, then the expenses total and gross profit. Categories with nothing in
  // any period are left out, except that every group's subtotal is always there.
  repeated StatementRow rows = 7;
  StatementRow net = 8;          // income − expenses
  StatementRow cash_in = 9;      // payments received (either basis)
  StatementRow cash_out = 10;    // expenses paid (either basis)
  // Cash at each period's end: the latest balance set plus cash movements since.
  // Empty cells when no balance has ever been set (has_opening_balance false).
  StatementRow ending_cash = 11;
  bool has_opening_balance = 12;
  CashBalance opening_balance = 13;   // the latest one set, when there is one
}

// What is behind one cell: the invoices, payments and expenses in a category and a
// period, on a basis.
message ListTransactionsRequest {
  string workspace_id = 1;
  string category_id = 2;
  google.protobuf.Timestamp start = 3;   // inclusive
  google.protobuf.Timestamp end = 4;     // exclusive
  StatementBasis basis = 5;
}

message StatementTransaction {
  string kind = 1;               // invoice | payment | expense
  string id = 2;                 // of that invoice, payment or expense
  google.protobuf.Timestamp at = 3;
  string label = 4;              // "INV-0007 · Acme", or the vendor
  int64 amount_cents = 5;        // what it adds to the cell; negative for a reversal
  string memo = 6;               // the journal entry's memo, on the earned basis
  string invoice_id = 7;         // for a payment, the invoice it paid
  string category_id = 8;
}

message ListTransactionsResponse {
  repeated StatementTransaction transactions = 1;
  int64 total_cents = 2;         // equals the cell's actual
}

service BooksService {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);
  rpc UpsertCustomer(UpsertCustomerRequest) returns (UpsertCustomerResponse);
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);
  rpc CreateInvoice(CreateInvoiceRequest) returns (CreateInvoiceResponse);
  rpc SendInvoice(SendInvoiceRequest) returns (SendInvoiceResponse);
  rpc RecordPayment(RecordPaymentRequest) returns (RecordPaymentResponse);
  rpc VoidInvoice(VoidInvoiceRequest) returns (VoidInvoiceResponse);
  rpc ListExpenses(ListExpensesRequest) returns (ListExpensesResponse);
  rpc RecordExpense(RecordExpenseRequest) returns (RecordExpenseResponse);
  rpc GetCashSummary(GetCashSummaryRequest) returns (GetCashSummaryResponse);
  rpc ImportBankTransactions(ImportBankTransactionsRequest) returns (ImportBankTransactionsResponse);
  rpc ListBankTransactions(ListBankTransactionsRequest) returns (ListBankTransactionsResponse);
  rpc MatchBankTransaction(MatchBankTransactionRequest) returns (MatchBankTransactionResponse);
  rpc GetReport(GetReportRequest) returns (GetReportResponse);
  rpc ReadReceipt(ReadReceiptRequest) returns (ReadReceiptResponse);
  rpc Export(ExportRequest) returns (ExportResponse);
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc UpsertCategory(UpsertCategoryRequest) returns (UpsertCategoryResponse);
  rpc SetCashBalance(SetCashBalanceRequest) returns (SetCashBalanceResponse);
  rpc PayExpense(PayExpenseRequest) returns (PayExpenseResponse);
  rpc GetStatement(GetStatementRequest) returns (GetStatementResponse);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
}
