syntax = "proto3";

package tank.richtext.v1;

// Portable rich-text AST (the shape of Slack's rich_text block). Editors
// convert to and from this; Markdown is never the storage format.
message RichText {
  repeated RichTextBlock blocks = 1;
}

message RichTextBlock {
  oneof kind {
    RichTextSection section = 1;
    RichTextCode code = 2;
    RichTextQuote quote = 3;
    RichTextList list = 4;
    // Added 2026-11-12 so an agent's Markdown (headings, GitHub tables, rules) has a
    // shape. A client that predates them sees an unset kind and draws nothing, so
    // the server only emits them once every client renders them.
    RichTextHeading heading = 5;
    RichTextTable table = 6;
    RichTextDivider divider = 7;
  }
}

message Style {
  bool bold = 1;
  bool italic = 2;
  bool strike = 3;
  bool code = 4;
}

message RichTextElement {
  oneof kind {
    TextElement text = 1;
    EmojiElement emoji = 2;
    UserMention user = 3;
    ChannelMention channel = 4;
    BroadcastMention broadcast = 5;
    LinkElement link = 6;
    UserGroupMention user_group = 7;
  }
}

// @handle of a tank.workspace.v1.UserGroup; the notify worker expands it to
// the group's members.
message UserGroupMention {
  string group_id = 1;
  string handle = 2;
}

message TextElement {
  string text = 1;
  Style style = 2;
}

message EmojiElement {
  string name = 1;
  string unicode = 2;
}

message UserMention {
  string user_id = 1;
  Style style = 2;
}

message ChannelMention {
  string channel_id = 1;
}

enum Broadcast {
  BROADCAST_UNSPECIFIED = 0;
  BROADCAST_HERE = 1;
  BROADCAST_CHANNEL = 2;
  BROADCAST_EVERYONE = 3;
}

message BroadcastMention {
  Broadcast range = 1;
}

message LinkElement {
  string url = 1;
  string text = 2;
  Style style = 3;
}

message RichTextSection {
  repeated RichTextElement elements = 1;
}

message RichTextCode {
  string language = 1;
  string text = 2;
}

message RichTextQuote {
  repeated RichTextElement elements = 1;
}

message RichTextList {
  bool ordered = 1;
  int32 indent = 2;
  repeated RichTextSection items = 3;
  // The first item's number in an ordered list; 0 means 1. A Markdown list
  // that a nested list splits into several blocks keeps counting through it.
  int32 start = 4;
}

// A heading line; level 1 to 6, as in Markdown's # to ######.
message RichTextHeading {
  int32 level = 1;
  repeated RichTextElement elements = 2;
}

enum TableAlign {
  TABLE_ALIGN_UNSPECIFIED = 0;
  TABLE_ALIGN_LEFT = 1;
  TABLE_ALIGN_CENTER = 2;
  TABLE_ALIGN_RIGHT = 3;
}

// A table: a header row, the rows under it, and each column's alignment
// (align[i] is column i; a missing entry is unspecified, drawn as left).
message RichTextTable {
  RichTextTableRow header = 1;
  repeated RichTextTableRow rows = 2;
  repeated TableAlign align = 3;
}

message RichTextTableRow {
  repeated RichTextTableCell cells = 1;
}

message RichTextTableCell {
  repeated RichTextElement elements = 1;
}

// A horizontal rule between blocks.
message RichTextDivider {}
