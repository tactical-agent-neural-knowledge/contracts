syntax = "proto3";

package tank.workspace.v1;

import "google/protobuf/timestamp.proto";
import "tank/auth/v1/auth.proto";
import "tank/channel/v1/channel.proto";

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_ADMIN = 2;
  ROLE_MEMBER = 3;
  ROLE_GUEST = 4;
  ROLE_BOT = 5;
}

message Workspace {
  string id = 1;
  string slug = 2;
  string name = 3;
  string icon_url = 4;
  google.protobuf.Timestamp created_at = 5;
}

message Member {
  tank.auth.v1.Principal principal = 1;
  Role role = 2;
  string title = 3;
  string timezone = 4;
  google.protobuf.Timestamp joined_at = 5;
  google.protobuf.Timestamp deactivated_at = 6;
}

message CreateWorkspaceRequest {
  string name = 1;
  string slug = 2;
}
message CreateWorkspaceResponse {
  Workspace workspace = 1;
}

message ListWorkspacesRequest {}
message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

// One call on app open. Everything else is lazy.
message GetBootstrapRequest {
  string workspace_id = 1;
}
message GetBootstrapResponse {
  Workspace workspace = 1;
  Member me = 2;
  repeated tank.channel.v1.Channel channels = 3;
  repeated tank.channel.v1.ChannelReadState read_states = 4;
  repeated Member members = 5; // capped; ListMembers pages the rest
  string custom_emoji_hash = 6;
}

message ListMembersRequest {
  string workspace_id = 1;
  string cursor = 2;
  int32 limit = 3;
}
message ListMembersResponse {
  repeated Member members = 1;
  string next_cursor = 2;
}

message InviteMemberRequest {
  string workspace_id = 1;
  string email = 2;
  Role role = 3;
}
message InviteMemberResponse {
  string invite_id = 1;
}

message JoinWorkspaceRequest {
  string invite_token = 1;
}
message JoinWorkspaceResponse {
  Workspace workspace = 1;
  Member me = 2;
}

service WorkspaceService {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc GetBootstrap(GetBootstrapRequest) returns (GetBootstrapResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);
  rpc JoinWorkspace(JoinWorkspaceRequest) returns (JoinWorkspaceResponse);
}
