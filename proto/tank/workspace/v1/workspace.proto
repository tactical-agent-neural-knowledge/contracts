syntax = "proto3";

package tank.workspace.v1;

import "google/protobuf/timestamp.proto";
import "tank/auth/v1/auth.proto";
import "tank/channel/v1/channel.proto";
import "tank/topo/v1/topo.proto";
import "tank/richtext/v1/richtext.proto";

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_ADMIN = 2;
  ROLE_MEMBER = 3;
  ROLE_GUEST = 4;
  ROLE_BOT = 5;
}

message Workspace {
  string id = 1;
  string slug = 2;
  string name = 3;
  string icon_url = 4;
  google.protobuf.Timestamp created_at = 5;
  // The workspace's look, set by an admin from a description. Unset means TANK's own.
  Theme theme = 6;
  // A generated or uploaded picture for the workspace; empty means the TANK mark.
  string icon_file_id = 7;
}

// A colour theme made from a few words. Every colour is a #rrggbb hex; the
// server checks contrast before it hands one out, so clients apply it as is.
message Theme {
  // What the person typed, so it can be shown back and refined.
  string description = 1;
  // A short name the model gave it: "Midnight glacier".
  string name = 2;
  // "dark" or "light": which base the colours sit on.
  string scheme = 3;
  string primary = 4;
  string secondary = 5;
  string background = 6;
  string surface = 7;
  string on_surface = 8;
  string accent = 9;
}

message Member {
  tank.auth.v1.Principal principal = 1;
  Role role = 2;
  string title = 3;
  string timezone = 4;
  google.protobuf.Timestamp joined_at = 5;
  google.protobuf.Timestamp deactivated_at = 6;
}

message CreateWorkspaceRequest {
  string name = 1;
  string slug = 2;
}
message CreateWorkspaceResponse {
  Workspace workspace = 1;
}

message ListWorkspacesRequest {}
message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

// One call on app open. Everything else is lazy.
message GetBootstrapRequest {
  string workspace_id = 1;
}
message GetBootstrapResponse {
  Workspace workspace = 1;
  Member me = 2;
  repeated tank.channel.v1.Channel channels = 3;
  repeated tank.channel.v1.ChannelReadState read_states = 4;
  repeated Member members = 5; // capped; ListMembers pages the rest
  // Changes whenever the workspace's custom emoji set changes; clients
  // refetch ListEmoji when it differs from their cached value.
  string custom_emoji_hash = 6;
  int32 unread_notification_count = 7;
  Preferences preferences = 8;
  repeated UserGroup user_groups = 9;
  // What this workspace's plan allows, so clients can mark premium surfaces
  // before anyone hits a wall. The server is still the authority: every gated
  // call is checked again server-side.
  Entitlements entitlements = 10;
}

// Everything Slack does is free. The agent and the Neural Vault are what a
// subscription buys; a free workspace gets one of each to try.
message Entitlements {
  // "free" or "premium".
  string plan = 1;
  // Whether another agent run / Neural Vault query is allowed right now.
  bool agent_runs = 2;
  bool neural_vault = 3;
  int32 agent_runs_used = 4;
  int32 agent_runs_limit = 5;
  int32 vault_queries_used = 6;
  int32 vault_queries_limit = 7;
  // Where to write to upgrade; the clients show it rather than hard-coding it.
  string contact_email = 8;
  // Scheduling around people and quiet (send when calm, when they are here,
  // nudge unless answered) is premium; plain "send at a time" is free.
  bool conditional_sends = 9;
}

message ListMembersRequest {
  string workspace_id = 1;
  string cursor = 2;
  int32 limit = 3;
  // Narrow to members whose name, handle or email contains this, case-insensitively.
  //
  // Bootstrap loads at most 200 members, and mention suggestions filtered only
  // that set — so in a larger workspace the person you meant was simply absent
  // from the list, with nothing to say why. Typing @ should ask the server.
  string query = 4;
}
message ListMembersResponse {
  repeated Member members = 1;
  string next_cursor = 2;
}

message InviteMemberRequest {
  string workspace_id = 1;
  string email = 2;
  Role role = 3;
}
message InviteMemberResponse {
  string invite_id = 1;
}

// An invitation that has been sent and not yet accepted. Members lists these
// beside real members: inviting five people and seeing the screen unchanged
// reads as a failure, and there is otherwise no way to tell who is outstanding
// or to take an invite back.
message Invite {
  // Stable handle for revoking. Not the token: that only ever exists in the
  // email, and anyone who can list invites must not be able to accept them.
  string invite_id = 1;
  string email = 2;
  Role role = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message ListInvitesRequest {
  string workspace_id = 1;
}
message ListInvitesResponse {
  repeated Invite invites = 1;
}

message RevokeInviteRequest {
  string workspace_id = 1;
  string invite_id = 2;
}
message RevokeInviteResponse {}

// An invite waiting for the signed-in person, across every workspace. Someone
// who signs up instead of opening the emailed link lands with no workspaces and
// is shown "create one" — so the two people invited to Cache7 each made their
// own workspace and never joined the one they were invited to.
message PendingInvite {
  string workspace_id = 1;
  string workspace_name = 2;
  string workspace_slug = 3;
  Role role = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message ListMyInvitesRequest {}
message ListMyInvitesResponse {
  repeated PendingInvite invites = 1;
}

// Accepts an invite already addressed to the caller. No token: only the hash is
// stored, so the emailed one cannot be handed back — and matching on an address
// the caller proved at sign-in is the stronger check anyway.
message AcceptInviteRequest {
  string workspace_id = 1;
}
message AcceptInviteResponse {
  Workspace workspace = 1;
  Member me = 2;
}

message JoinWorkspaceRequest {
  string invite_token = 1;
}
message JoinWorkspaceResponse {
  Workspace workspace = 1;
  Member me = 2;
}

// ---- Profile & preferences ------------------------------------------------

// Unset fields are left unchanged. display_name and avatar are global to the
// user; title and timezone are per workspace.
message UpdateProfileRequest {
  string workspace_id = 1;
  optional string display_name = 2;
  optional string title = 3;
  optional string timezone = 4; // IANA name
  optional string avatar_file_id = 5; // empty string clears the avatar
}
message UpdateProfileResponse {
  Member me = 1;
}

// Armor Mode (do not disturb) on a schedule, in the user's timezone.
message ArmorModeSchedule {
  bool enabled = 1;
  string start = 2; // "HH:MM" local time
  string end = 3;   // "HH:MM" local time; earlier than start = overnight
  repeated int32 days = 4; // 0 = Sunday .. 6 = Saturday; empty = every day
  string timezone = 5;     // IANA name; empty = profile timezone
  bool allow_critical = 6; // let critical alerts (agent_needs_input, DMs) through
}

message Preferences {
  tank.channel.v1.NotifyPref notify_default = 1;    // channels without their own preference
  tank.channel.v1.NotifyPref dm_notify_default = 2; // DMs and group DMs
  string theme = 3; // system | light | dark
  ArmorModeSchedule armor_mode_schedule = 4;
  bool email_digest = 5;
  bool desktop_sound = 6;
  bool push_on_mention_only = 7;
  TopoPreferences topo = 8;
  // A theme made from a description, for this person; wins over the workspace's. Unset means none.
  Theme custom_theme = 9;
  // How Home is arranged, set from a sentence; unset means TANK's order.
  HomeLayout home = 10;
  // One sentence that styles the "while you were away" narrative ("like a naval log"). Empty means TANK's voice.
  string digest_voice = 11;
  // Which notification sounds play; unset means TANK's own set.
  SoundChoice sounds = 12;
}

// A notification sound set, chosen from TANK's packs by a vibe. Each field names
// a sound id the clients ship ("arcade-mention"); empty means silent for that event.
message SoundChoice {
  string pack = 1;        // the pack the sounds come from
  string mention = 2;     // @mentions and DMs addressed to me
  string dm = 3;          // direct messages
  string agent = 4;       // an agent finished or needs me
  string description = 5; // the vibe it was picked from
}

// The order Home shows its sections in, and which are hidden. Section keys:
// "online", "moved", "waiting", "agents", "threads", "download".
message HomeLayout {
  repeated string order = 1;
  repeated string hidden = 2;
  string description = 3;
}

// Which Topo mark families the strip draws for this person.
//
// `configured` exists because an empty `visible` has two meanings otherwise —
// "never chosen" and "turned everything off" — and UpdatePreferences replaces
// the whole message, so the difference cannot be recovered from the wire.
message TopoPreferences {
  bool configured = 1;
  repeated tank.topo.v1.MarkType visible = 2;
  // Message-indexed (the default) or time-indexed scaling. R6.
  bool time_axis = 3;
}

message GetPreferencesRequest {
  string workspace_id = 1;
}
message GetPreferencesResponse {
  Preferences preferences = 1;
}

message UpdatePreferencesRequest {
  string workspace_id = 1;
  Preferences preferences = 2; // replaces the stored preferences
}
message UpdatePreferencesResponse {
  Preferences preferences = 1;
}

// ---- Custom emoji ----------------------------------------------------------

// The image is a normal uploaded file readable by every workspace member.
message CustomEmoji {
  string id = 1;
  string workspace_id = 2;
  string name = 3; // :name:, unique per workspace
  string file_id = 4;
  string created_by = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListEmojiRequest {
  string workspace_id = 1;
}
message ListEmojiResponse {
  repeated CustomEmoji emoji = 1;
  string hash = 2; // matches GetBootstrap.custom_emoji_hash
}

message CreateEmojiRequest {
  string workspace_id = 1;
  string name = 2;
  string file_id = 3;
}
message CreateEmojiResponse {
  CustomEmoji emoji = 1;
}

message DeleteEmojiRequest {
  string emoji_id = 1;
}
message DeleteEmojiResponse {}

// ---- User groups -----------------------------------------------------------

// @handle that expands to its members when mentioned.
message UserGroup {
  string id = 1;
  string workspace_id = 2;
  string handle = 3; // without the @
  string name = 4;
  string description = 5;
  repeated string member_ids = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListUserGroupsRequest {
  string workspace_id = 1;
}
message ListUserGroupsResponse {
  repeated UserGroup groups = 1;
}

message CreateUserGroupRequest {
  string workspace_id = 1;
  string handle = 2;
  string name = 3;
  string description = 4;
  repeated string member_ids = 5;
}
message CreateUserGroupResponse {
  UserGroup group = 1;
}

message UpdateUserGroupMembersRequest {
  string group_id = 1;
  repeated string member_ids = 2; // replaces the member list
}
message UpdateUserGroupMembersResponse {
  UserGroup group = 1;
}

message DeleteUserGroupRequest {
  string group_id = 1;
}
message DeleteUserGroupResponse {}

// ---- Channel bookmarks -----------------------------------------------------

message ChannelBookmark {
  string id = 1;
  string channel_id = 2;
  string title = 3;
  string url = 4;
  string emoji = 5;
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListBookmarksRequest {
  string channel_id = 1;
}
message ListBookmarksResponse {
  repeated ChannelBookmark bookmarks = 1;
}

message AddBookmarkRequest {
  string channel_id = 1;
  string title = 2;
  string url = 3;
  string emoji = 4;
}
message AddBookmarkResponse {
  ChannelBookmark bookmark = 1;
}

message RemoveBookmarkRequest {
  string bookmark_id = 1;
}
message RemoveBookmarkResponse {}

// ---- Drafts (cross-device) -------------------------------------------------

// One draft per (user, channel) or (user, thread). Private to the user.
message Draft {
  string channel_id = 1;
  string thread_root_id = 2; // empty for the channel composer
  tank.richtext.v1.RichText rich_text = 3;
  string text = 4;
  repeated string file_ids = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetDraftRequest {
  string channel_id = 1;
  string thread_root_id = 2;
}
message GetDraftResponse {
  Draft draft = 1; // unset when there is no draft
}

message PutDraftRequest {
  Draft draft = 1;
}
message PutDraftResponse {
  Draft draft = 1;
}

message DeleteDraftRequest {
  string channel_id = 1;
  string thread_root_id = 2;
}
message DeleteDraftResponse {}

message ListDraftsRequest {
  string workspace_id = 1;
}
message ListDraftsResponse {
  repeated Draft drafts = 1;
}

// ---- Scheduled messages ----------------------------------------------------

message ScheduledMessage {
  string id = 1;
  string workspace_id = 2;
  string channel_id = 3;
  string thread_root_id = 4;
  string text = 5;
  tank.richtext.v1.RichText rich_text = 6;
  repeated string file_ids = 7;
  google.protobuf.Timestamp send_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp sent_at = 10;
  string sent_message_id = 11;
  string error = 12; // set when sending failed (archived channel, left channel, ...)
  // Calm send: waits for this much quiet in the channel after send_at, never past no_later_than.
  int32 quiet_for_seconds = 13;
  google.protobuf.Timestamp no_later_than = 14;
  repeated string wait_for_user_ids = 15;
  string unless_replied_to_message_id = 16;
}

message ScheduleMessageRequest {
  string channel_id = 1;
  string thread_root_id = 2;
  string text = 3;
  tank.richtext.v1.RichText rich_text = 4;
  repeated string file_ids = 5;
  // When to send. With quiet_for_seconds set this is the earliest moment and
  // may be omitted (now); otherwise it is the moment itself.
  google.protobuf.Timestamp send_at = 6;
  // Send when things are calm: once the channel has had no new message for
  // this long (and send_at has passed). 0 = send at send_at exactly.
  int32 quiet_for_seconds = 7;
  // The latest moment a conditional send (calm, or waiting for people) waits
  // for; it goes out then regardless. Defaults to 24 hours after send_at.
  google.protobuf.Timestamp no_later_than = 8;
  // Send when they are here: once every one of these people is active (after
  // send_at, no later than no_later_than). Members of the workspace.
  repeated string wait_for_user_ids = 9;
  // A nudge with a fuse: skip the send if this message has been replied to by
  // someone other than its author before the send is due.
  string unless_replied_to_message_id = 10;
}
message ScheduleMessageResponse {
  ScheduledMessage scheduled = 1;
}

message ListScheduledRequest {
  string workspace_id = 1;
}
message ListScheduledResponse {
  repeated ScheduledMessage scheduled = 1; // pending only, soonest first
}

message CancelScheduledRequest {
  string scheduled_id = 1;
}
message CancelScheduledResponse {}


// An agenture is a business TANK stood up and runs itself. Somebody claims one and it
// becomes their venture, and it leaves the board — agentures are unique.
message Agenture {
  string workspace_id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;   // its #general purpose: what the business does
  bool agent_active = 5;    // an agent is working in it right now
  int32 active_runs = 6;
  string industry = 7;      // the trade it is in, so a bubble says more than a name
  int64 price_cents = 8;    // what it costs to take over today
  // How far along it is: stages of its journey done, out of how many, and the one in
  // progress. The board draws this as a tank filling up.
  int32 stage_done = 9;
  int32 stage_total = 10;
  string stage_title = 11;
}

message ListAgenturesRequest {
  // Paging, because this grows to thousands. Empty cursor starts at the beginning.
  string cursor = 1;
  int32 limit = 2;
}
message ListAgenturesResponse {
  repeated Agenture agentures = 1;
  string next_cursor = 2;
  int32 total = 3;
}

// Which workspaces have an agent working right now. Small and cheap on purpose: the
// board polls it, the list of agentures itself does not change often.
message AgentActivityRequest {}
message AgentActivityResponse {
  repeated string workspace_ids = 1; // workspaces with at least one live run
  // The products themselves, so the board can show one that is being worked on even
  // when it is not in the page of products the board happens to be holding. There
  // are never many: the whole board runs a bounded number of agents at once.
  repeated Agenture agentures = 2;
}

// AgentureWork is one piece of work the agent has done, or is doing now.
message AgentureWork {
  string title = 1;                             // "Sketch the data model"
  string summary = 2;                           // a line of what it produced
  google.protobuf.Timestamp asked_at = 3;
  google.protobuf.Timestamp delivered_at = 4;   // unset while it is still working
}

// AgentureDetail is everything the claim page shows: what the product is, what
// trade it is in, what the agent has built, and what it costs today.
message AgentureDetail {
  string workspace_id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  string industry = 5;
  string buyer = 6;                             // who it is for
  int64 agent_minutes = 7;
  int64 price_cents = 8;
  bool available = 9;
  repeated AgentureWork work = 10;              // newest first
  // The long form: what it is, the problem it solves, who buys it, where it has got
  // to. Markdown. The one-liner above is what a card shows; this is what somebody
  // deciding whether to take it over reads.
  string overview = 11;
}

message GetAgentureRequest { string slug = 1; }
message GetAgentureResponse { AgentureDetail agenture = 1; }

message ClaimAgentureRequest {
  string workspace_id = 1;
  // Or name it by slug, which is what a claim link off the marketing site carries.
  string slug = 2;
}
message ClaimAgentureResponse { Workspace workspace = 1; }

service WorkspaceService {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);

  // The agenture board.
  rpc ListAgentures(ListAgenturesRequest) returns (ListAgenturesResponse);
  rpc AgentActivity(AgentActivityRequest) returns (AgentActivityResponse);
  rpc GetAgenture(GetAgentureRequest) returns (GetAgentureResponse);
  rpc ClaimAgenture(ClaimAgentureRequest) returns (ClaimAgentureResponse);
  rpc GetBootstrap(GetBootstrapRequest) returns (GetBootstrapResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);
  rpc JoinWorkspace(JoinWorkspaceRequest) returns (JoinWorkspaceResponse);
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  rpc ListMyInvites(ListMyInvitesRequest) returns (ListMyInvitesResponse);
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc GetPreferences(GetPreferencesRequest) returns (GetPreferencesResponse);
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse);
  // Turn up to fifteen words into a theme. Nothing is saved; the caller decides.
  rpc GenerateTheme(GenerateThemeRequest) returns (GenerateThemeResponse);
  // Admins only: the workspace's theme, or a reset when theme is unset.
  rpc SetWorkspaceTheme(SetWorkspaceThemeRequest) returns (SetWorkspaceThemeResponse);
  // Turn up to fifteen words into an icon or emoji picture. The file is saved; nothing is applied.
  rpc GenerateArt(GenerateArtRequest) returns (GenerateArtResponse);
  // Admins only: the workspace icon, or a reset when file_id is empty.
  rpc SetWorkspaceIcon(SetWorkspaceIconRequest) returns (SetWorkspaceIconResponse);
  rpc DescribeHomeLayout(DescribeHomeLayoutRequest) returns (DescribeHomeLayoutResponse);
  rpc RewriteText(RewriteTextRequest) returns (RewriteTextResponse);
  rpc DescribeSoundPack(DescribeSoundPackRequest) returns (DescribeSoundPackResponse);
  rpc ListSoundPacks(ListSoundPacksRequest) returns (ListSoundPacksResponse);
  rpc ListEmoji(ListEmojiRequest) returns (ListEmojiResponse);
  rpc CreateEmoji(CreateEmojiRequest) returns (CreateEmojiResponse);
  rpc DeleteEmoji(DeleteEmojiRequest) returns (DeleteEmojiResponse);
  rpc ListUserGroups(ListUserGroupsRequest) returns (ListUserGroupsResponse);
  rpc CreateUserGroup(CreateUserGroupRequest) returns (CreateUserGroupResponse);
  rpc UpdateUserGroupMembers(UpdateUserGroupMembersRequest) returns (UpdateUserGroupMembersResponse);
  rpc DeleteUserGroup(DeleteUserGroupRequest) returns (DeleteUserGroupResponse);
  rpc ListBookmarks(ListBookmarksRequest) returns (ListBookmarksResponse);
  rpc AddBookmark(AddBookmarkRequest) returns (AddBookmarkResponse);
  rpc RemoveBookmark(RemoveBookmarkRequest) returns (RemoveBookmarkResponse);
  rpc GetDraft(GetDraftRequest) returns (GetDraftResponse);
  rpc PutDraft(PutDraftRequest) returns (PutDraftResponse);
  rpc DeleteDraft(DeleteDraftRequest) returns (DeleteDraftResponse);
  rpc ListDrafts(ListDraftsRequest) returns (ListDraftsResponse);
  rpc ScheduleMessage(ScheduleMessageRequest) returns (ScheduleMessageResponse);
  rpc ListScheduled(ListScheduledRequest) returns (ListScheduledResponse);
  rpc CancelScheduled(CancelScheduledRequest) returns (CancelScheduledResponse);
}

message GenerateThemeRequest {
  string workspace_id = 1;
  string description = 2;
}
message GenerateThemeResponse {
  Theme theme = 1;
}

message SetWorkspaceThemeRequest {
  string workspace_id = 1;
  // Unset clears the workspace theme.
  Theme theme = 2;
}
message SetWorkspaceThemeResponse {
  Workspace workspace = 1;
}

// What a generated picture is for. It changes the brief, not the pipeline.
enum ArtKind {
  ART_KIND_UNSPECIFIED = 0;
  ART_KIND_ICON = 1;  // a Tread or workspace icon
  ART_KIND_EMOJI = 2; // a custom emoji
}
// "A copper gear with a lightning bolt" → a small SVG, stored as a file the caller owns.
message GenerateArtRequest {
  string workspace_id = 1;
  ArtKind kind = 2;
  string description = 3; // at most 15 words
}
message GenerateArtResponse {
  // The stored picture; pass its id to SetWorkspaceIcon, SetChannelIcon or CreateEmoji.
  string file_id = 1;
  // The sanitised SVG, for an instant preview.
  string svg = 2;
}
// Admins only: the workspace icon, or a reset when file_id is empty.
message SetWorkspaceIconRequest {
  string workspace_id = 1;
  string file_id = 2;
}
message SetWorkspaceIconResponse {
  Workspace workspace = 1;
}
// "Agents first, then treads I own, hide people" → a HomeLayout to review; nothing is saved.
message DescribeHomeLayoutRequest {
  string workspace_id = 1;
  string description = 2; // at most 15 words
}
message DescribeHomeLayoutResponse {
  HomeLayout home = 1;
}
// Rewrite a draft in the composer: "terser", "friendlier", "as a bulleted decision".
message RewriteTextRequest {
  string workspace_id = 1;
  string text = 2;        // the draft, at most 4000 characters
  string instruction = 3; // at most 15 words
}
message RewriteTextResponse {
  string text = 1;
}
// "Arcade cabinet, quiet" → a SoundChoice to review; nothing is saved.
message DescribeSoundPackRequest {
  string workspace_id = 1;
  string description = 2; // at most 15 words
}
message DescribeSoundPackResponse {
  SoundChoice sounds = 1;
}
// One pack in TANK's library, so a client can offer them without a model call.
message SoundPack {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string sound_ids = 4; // mention, dm, agent, in that order
}
message ListSoundPacksRequest {}
message ListSoundPacksResponse {
  repeated SoundPack packs = 1;
}
