syntax = "proto3";

package tank.hosting.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/tactical-agent-neural-knowledge/contracts/gen/go/tank/hosting/v1;hostingv1";

// HostingService is the Infrastructure page: what a product TANK runs for a Tread is,
// how it is doing, what it costs and what people may change about it. Every request
// names the Tread (channel_id); members of the Tread may read, and what each role may
// change is decided by the server, never by the client.
service HostingService {
  // The product's running state, recent cluster events and log tail.
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  // Opens a page of the product as a visitor would and returns what it showed.
  rpc CheckProduct(CheckProductRequest) returns (CheckProductResponse);
  // What the product is made of (from its tank.yaml), what it costs, and a build waiting
  // to land. Members read it.
  rpc GetResources(GetResourcesRequest) returns (GetResourcesResponse);
  // Owners and billing admins approve a build that costs more than the product was approved for.
  rpc ApproveBuild(ApproveBuildRequest) returns (ApproveBuildResponse);
  // Admins: restart, pause or resume a schedule, run a job.
  rpc Operate(OperateRequest) returns (OperateResponse);
  // Every deploy, hold, approval and operation, newest first. Members read it.
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse);
  // Admins put an earlier build back; one that costs more waits for an owner like any build.
  rpc Rollback(RollbackRequest) returns (RollbackResponse);
  // Admins change a process's size, scale or schedule: a commit to tank.yaml in their name.
  rpc UpdateResource(UpdateResourceRequest) returns (UpdateResourceResponse);
  // Owners set a product's monthly hosting cap (0: none). At 80% the owners are told; at
  // the cap its workers and schedules pause until the 1st or a higher cap, and the site
  // stays up.
  rpc SetCap(SetCapRequest) returns (SetCapResponse);
  // Every product the workspace hosts, for Settings, Billing, Hosting: what each cost so
  // far this month, its cap, and the workspace's allowance. Members of the workspace read.
  rpc ListHosting(ListHostingRequest) returns (ListHostingResponse);
  // Owners set how much more a month a new build may cost before it waits for them.
  rpc SetAllowance(SetAllowanceRequest) returns (SetAllowanceResponse);
  // Admins take the product with them: a docker-compose file that runs it without TANK.
  rpc ExportProduct(ExportProductRequest) returns (ExportProductResponse);
  // Admins set a declared secret's value. Never returned; the product restarts with it.
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  // Hosting settings: what a change would cost before anybody commits to it. Members read.
  rpc PreviewChange(PreviewChangeRequest) returns (PreviewChangeResponse);
  // Makes a change: admins for one that costs the same or less; a change that costs more
  // is a purchase, so it takes an owner and the exact monthly price they were shown.
  rpc ApplyChange(ApplyChangeRequest) returns (ApplyChangeResponse);
  // tank.yaml as it is, for the editor. Members read.
  rpc GetSpecText(GetSpecTextRequest) returns (GetSpecTextResponse);
}

message GetProductRequest {
  string channel_id = 1;
  int32 tail_lines = 2;   // 0 = 200, at most 2000
}
message GetProductResponse {
  Product product = 1;    // absent when the Tread hosts nothing
  string logs = 2;        // the app's log; the crashed container's when it is failing
  repeated ProductEvent events = 3;
}

message Product {
  string slug = 1;
  string repo = 2;                // owner/name
  string url = 3;                 // https://<slug>.tank.chat
  bool awake = 4;
  string status = 5;              // not_deployed | asleep | starting | running | failing | unknown
  string image_tag = 6;           // the build the cluster runs
  int32 restarts = 7;
  string last_exit_reason = 8;    // of the last crash: "Error", "OOMKilled", …
  google.protobuf.Timestamp started_at = 9;
  string cpu_limit = 10;          // "1"
  string memory_limit = 11;       // "2Gi"
  int64 disk_bytes = 12;
  bool can_manage = 13;           // the caller may wake, sleep and (later) change it
  bool managed = 14;              // TANK generated the repository
  google.protobuf.Timestamp updated_at = 15;
}

message ProductEvent {
  google.protobuf.Timestamp at = 1;
  string type = 2;                // Normal | Warning
  string reason = 3;
  string message = 4;
}

message CheckProductRequest {
  string channel_id = 1;
  string path = 2;                // "/" when empty
}
message CheckProductResponse { LiveCheck check = 1; }

message LiveCheck {
  string url = 1;
  int32 status = 2;               // HTTP status; 0 when the page did not load
  string build_sha = 3;
  string title = 4;
  int32 text_length = 5;          // near zero is a blank page
  repeated string errors = 6;
  bytes screenshot_png = 7;
  google.protobuf.Timestamp checked_at = 8;
  string note = 9;                // why nothing could be checked
}

// One process of the product, with what the cluster says about it.
message Resource {
  string name = 1;
  string kind = 2;              // service | worker | cron | job
  string size = 3;              // s | m | l | xl | 2xl
  string cpu = 4;
  string memory = 5;
  bool public = 6;
  int32 min = 7;
  int32 max = 8;
  string schedule = 9;
  int32 timeout_seconds = 10;
  string volume = 11;
  // From the cluster:
  int32 ready = 12;
  int32 desired = 13;
  bool paused = 14;
  google.protobuf.Timestamp last_run_at = 15;
  string last_run_result = 16;  // succeeded | failed | running
  string storage = 17;          // database: "40Gi"
  repeated string extensions = 18; // database: postgis, vector
  int32 scratch_gi = 19;        // worker, schedule or job: working disk at /scratch
}

message Cost {
  int64 base_cents = 1;
  int64 overage_cents = 2;
  int64 total_cents = 3;
  repeated string lines = 4;
}

message PendingBuild {
  string sha = 1;
  string reason = 2;            // spec | cost
  repeated string problems = 3;
  Cost estimate = 4;
  google.protobuf.Timestamp at = 5;
  bool can_approve = 6;         // the caller is an owner or billing admin
}

message GetResourcesRequest { string channel_id = 1; }
message GetResourcesResponse {
  repeated Resource resources = 1;
  Cost estimate = 2;            // what the running build costs a month
  PendingBuild pending = 3;
  repeated string secrets = 4;  // names only, never values
  bool can_manage = 5;          // admins: operate, change, roll back
  int64 month_cents = 6;        // hosting so far this month: the base for the hours it ran, plus use beyond the bundle
  int64 cap_cents = 7;          // the monthly cap; 0 is none
  bool capped = 8;              // at the cap now: workers and schedules paused
  bool can_set_cap = 9;         // the caller is an owner
  repeated Preview previews = 10; // open pull requests running the whole product
  repeated string secrets_set = 11; // the secrets that have a value
  repeated string library = 12;     // datasets TANK's library offers
  repeated string env_keys = 13;    // plain environment names set in tank.yaml
}

message Preview {
  int32 pull_request = 1;
  string url = 2;               // https://<slug>--pr<n>.tank.chat
  string build = 3;             // the commit it runs
  google.protobuf.Timestamp expires_at = 4;
}

message ApproveBuildRequest {
  string channel_id = 1;
  string sha = 2;
}
message ApproveBuildResponse {}

message OperateRequest {
  string channel_id = 1;
  string action = 2;            // restart | pause | resume | run
  string process = 3;
}
message OperateResponse {}

message Change {
  string sha = 1;
  string message = 2;
  google.protobuf.Timestamp at = 3;
}
message ListChangesRequest {
  string channel_id = 1;
  int32 limit = 2;
}
message ListChangesResponse { repeated Change changes = 1; }

message RollbackRequest {
  string channel_id = 1;
  string sha = 2;               // the product repository commit whose build to put back
}
message RollbackResponse {
  bool applied = 1;
  string reason = 2;
  repeated string problems = 3;
  Cost estimate = 4;
}

message UpdateResourceRequest {
  string channel_id = 1;
  string name = 2;
  string size = 3;
  int32 min = 4;
  int32 max = 5;
  string schedule = 6;
}
message UpdateResourceResponse { Cost estimate = 1; }

message SetCapRequest {
  string channel_id = 1;
  int64 cap_cents = 2;          // 0 removes the cap
}
message SetCapResponse {}

message HostedProduct {
  string channel_id = 1;
  string channel_name = 2;
  string slug = 3;
  string url = 4;
  bool awake = 5;
  int64 month_cents = 6;
  int64 cap_cents = 7;
  bool capped = 8;
}
message ListHostingRequest { string workspace_id = 1; }
message ListHostingResponse {
  repeated HostedProduct products = 1;  // the Treads the caller is in
  int64 month_cents = 2;                // all of them
  int64 allowance_cents = 3;
  bool can_set = 4;                     // the caller is an owner
}
message SetAllowanceRequest {
  string workspace_id = 1;
  int64 allowance_cents = 2;
}
message SetAllowanceResponse {}

message ExportProductRequest { string channel_id = 1; }
message ExportProductResponse {
  string filename = 1;          // docker-compose.yml
  string content = 2;
}

message SetSecretRequest {
  string channel_id = 1;
  string name = 2;
  string value = 3;             // empty clears it
}
message SetSecretResponse {}

// One change from hosting settings. kind: service | worker | cron | job | database | cache
// | bucket | dataset | env; name is empty for the cache.
message ResourceChange {
  string kind = 1;
  string name = 2;
  bool remove = 3;
  string size = 4;
  int32 min = 5;
  int32 max = 6;
  string schedule = 7;
  string storage = 8;
  repeated string extensions = 9;
  repeated string command = 10;
  string scratch = 11;
  string timeout = 12;
  string value = 13;
}
message PreviewChangeRequest {
  string channel_id = 1;
  oneof edit {
    ResourceChange change = 2;
    string text = 3;
  }
}
message PreviewChangeResponse {
  string text = 1;
  Cost before = 2;
  Cost after = 3;
  repeated string problems = 4;
  bool needs_owner = 5;         // it costs more: only an owner can buy it
  bool can_apply = 6;           // the caller may make this change
}
message ApplyChangeRequest {
  string channel_id = 1;
  oneof edit {
    ResourceChange change = 2;
    string text = 3;
  }
  int64 accepted_total_cents = 4; // the monthly total the owner was shown, for a change that costs more
}
message ApplyChangeResponse {
  string commit_sha = 1;
  Cost estimate = 2;
  bool live = 3;
}
message GetSpecTextRequest { string channel_id = 1; }
message GetSpecTextResponse {
  string text = 1;
  bool can_edit = 2;
}
