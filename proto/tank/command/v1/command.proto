syntax = "proto3";

package tank.command.v1;

// Slash commands: what a composer offers after "/", and what happens when one
// is sent. The server does the work and tells the client what to show or
// post, so both clients behave the same without knowing each command.

message Command {
  string name = 1;    // "roll"
  string summary = 2; // "Roll dice"
  string usage = 3;   // "/roll 2d6"
  bool takes_text = 4; // the rest of the line is the argument
}

message ListCommandsRequest {
  string workspace_id = 1;
}
message ListCommandsResponse {
  repeated Command commands = 1;
}

message RunCommandRequest {
  string workspace_id = 1;
  string channel_id = 2;
  string thread_root_id = 3; // empty when typed in the Tread itself
  string text = 4;           // the whole line: "/roll 2d6"
  string draft = 5;          // what else is in the composer, for commands that rewrite it
  string local_time = 6;     // "HH:MM" in the person's zone, for times in arguments
}
message RunCommandResponse {
  // Shown only to the person who ran it, in the thread, like an ephemeral card.
  string reply = 1;
  // A message the client posts as the person (the server already did anything else).
  string post = 2;
  // Replace the composer's draft with this (the /tone family).
  string replace_draft = 3;
  // Open this channel (the /tread and /radar family).
  string open_channel_id = 4;
}

// A macro: a name that runs a sequence of command lines. "$1", "$2"… in a step
// take the words given when the macro runs; "$*" takes them all.
message Macro {
  string id = 1;
  string name = 2;           // "standup"; runs as /standup
  repeated string steps = 3; // "/catchup", "/tldr post", "/later 9:00 tomorrow Standup"
  // Empty for a personal macro; a workspace macro (admins) is for everyone.
  bool workspace = 4;
  string created_by = 5;
}
message ListMacrosRequest {
  string workspace_id = 1;
}
message ListMacrosResponse {
  repeated Macro macros = 1;
}
message SaveMacroRequest {
  string workspace_id = 1;
  string name = 2;
  repeated string steps = 3;
  bool workspace = 4;
}
message SaveMacroResponse {
  Macro macro = 1;
}
message DeleteMacroRequest {
  string workspace_id = 1;
  string name = 2;
  bool workspace = 3;
}
message DeleteMacroResponse {}

service CommandService {
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);
  rpc RunCommand(RunCommandRequest) returns (RunCommandResponse);
  rpc ListMacros(ListMacrosRequest) returns (ListMacrosResponse);
  rpc SaveMacro(SaveMacroRequest) returns (SaveMacroResponse);
  rpc DeleteMacro(DeleteMacroRequest) returns (DeleteMacroResponse);
}
