syntax = "proto3";

package tank.platform.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/tactical-agent-neural-knowledge/contracts/gen/go/tank/platform/v1;platformv1";

// PlatformService is the console above every workspace: what the board's own agents
// are doing, and the controls to change it.
//
// Every RPC requires a super admin. The root super admins are named in the deployment
// and cannot be removed from the console; a root may name others (AddSuperAdmin), and
// each change is written to the audit log and mailed to every super admin.

// AgentureRow is one product on the board as the console sees it.
message AgentureRow {
  string workspace_id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;

  // Allocation.
  bool enabled = 5;
  int32 weight = 6;                            // share of the board's attention, 0 to 100
  google.protobuf.Timestamp next_due_at = 7;
  google.protobuf.Timestamp last_run_at = 8;
  int32 runs = 9;                              // spikes asked for since it joined the board
  string last_error = 10;                      // why the last attempt failed, if it did

  // Work.
  int64 agent_minutes = 11;                    // everything an agent has spent in it
  string live_run_id = 12;                     // empty when nothing is running
  string live_state = 13;                      // the live run's state, for the console
  double spend_usd = 14;                       // what its agents have cost, all time

  // Money.
  int64 price_cents = 15;                      // what it would cost to take over right now
  bool claimed = 16;
  // When set, a plan the agent stops at is approved for it rather than waiting for
  // somebody who is not coming.
  bool auto_approve = 17;
}

message ListAgenturesRequest {
  string query = 1;                            // match on name or slug
  int32 limit = 2;
  int32 offset = 3;
}
message ListAgenturesResponse {
  repeated AgentureRow agentures = 1;
  int32 total = 2;
  BoardSummary summary = 3;
}

// BoardSummary is the state of the whole board in one line.
message BoardSummary {
  int32 in_flight = 1;                         // agents working, or briefed and about to be
  int32 max_concurrent = 2;                    // the cap they are held to
  bool enabled = 3;                            // whether the board's agents run at all
  // Stopped outright: nothing starts and anything running is ended. Not the same as
  // a cap of zero, which lets what is running finish.
  bool killed = 8;
  // What a product starts as. Does not reach back and change products that exist.
  bool auto_default = 9;
  // When agents may work. Minutes past midnight in hours_zone; equal means all day.
  int32 hours_from = 10;
  int32 hours_to = 11;
  string hours_zone = 12;
  repeated int32 hours_days = 13;              // 0 is Sunday; empty means every day
  int32 unclaimed = 4;
  int64 agent_minutes_24h = 5;
  double spend_usd_24h = 6;                    // what the board cost in the last day
  double spend_usd_total = 7;
  // The last hour and the last three, for reading a change to the cap or the
  // policy before the day's figure can show it.
  double spend_usd_1h = 14;
  double spend_usd_3h = 15;
}

// SetAllocation changes how much attention a product gets. Weight 0 or enabled=false
// both stop new work; neither touches a run already going.
message SetAllocationRequest {
  string workspace_id = 1;
  bool enabled = 2;
  int32 weight = 3;
  bool run_now = 4;                            // become due now rather than at its next turn
  bool auto_approve = 5;
}
message SetAllocationResponse {
  AgentureRow agenture = 1;
}

// SetBoardSettings changes how the board as a whole behaves.
message SetBoardSettingsRequest {
  int32 max_concurrent = 1;                    // 0 stops new work without losing anything
  bool killed = 2;                             // stop, and end what is running
  bool auto_default = 3;
  int32 hours_from = 4;
  int32 hours_to = 5;
  string hours_zone = 6;
  repeated int32 hours_days = 7;
}
message SetBoardSettingsResponse {
  BoardSummary summary = 1;
}

// StopRun stops an agent that is working right now.
message StopRunRequest {
  string run_id = 1;
  string reason = 2;
}
message StopRunResponse {}

// MergeProposal is a twin the daily pass found: one product that should absorb
// another. Approving carries it out; nothing is deleted either way.
message MergeProposal {
  string id = 1;
  string absorbed_slug = 2;
  string absorbed_name = 3;
  string absorbed_summary = 4;
  string survivor_slug = 5;
  string survivor_name = 6;
  string survivor_summary = 7;
  double similarity = 8;
  string status = 9;                           // proposed | rejected | done
  bool auto = 10;                              // the board decided it on its own, beyond doubt
  google.protobuf.Timestamp proposed_at = 11;
  google.protobuf.Timestamp done_at = 12;
}
message ListMergesRequest {
  bool include_decided = 1;                    // also what was already merged or kept
}
message ListMergesResponse {
  repeated MergeProposal merges = 1;
}
message DecideMergeRequest {
  string id = 1;
  bool approve = 2;                            // false keeps both products
}
message DecideMergeResponse {
  MergeProposal merge = 1;
}

// DropCandidate is a product the drop job would retire today, and why. The job is a
// dry run until it is switched on; this list is how it is read meanwhile.
message DropCandidate {
  string workspace_id = 1;
  string slug = 2;
  string name = 3;
  string industry = 4;
  int32 score = 5;
  string reasons = 6;
}
message ListDropCandidatesRequest {}
message ListDropCandidatesResponse {
  repeated DropCandidate candidates = 1;
  string day = 2;                              // YYYY-MM-DD the list is for
}

// The directory: every person and workspace in the deployment, for a super admin.
// It carries timestamps, counts and settings, never message text, file contents or
// what an agent was asked; opening one workspace writes a record that workspace's
// admins can read.

// UserRow is one account as the directory lists it.
message UserRow {
  string id = 1;
  string display_name = 2;
  string email = 3;
  string kind = 4;                             // user | bot | agent
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp last_login_at = 6; // the last time a session was opened
  google.protobuf.Timestamp last_active_at = 7;// latest across the workspaces they are in
  int32 workspaces = 8;
  bool super_admin = 9;
}

message SearchUsersRequest {
  string query = 1;                            // name or email
  int32 limit = 2;
  int32 offset = 3;
  bool include_machines = 4;                   // bots and agents as well as people
  string sort = 5;                             // newest (default) | active | login | name
}
message SearchUsersResponse {
  repeated UserRow users = 1;
  int32 total = 2;
}

// Membership is one workspace somebody is in, and how recently they used it.
message Membership {
  string workspace_id = 1;
  string slug = 2;
  string name = 3;
  string role = 4;
  google.protobuf.Timestamp joined_at = 5;
  google.protobuf.Timestamp last_active_at = 6;
  bool deactivated = 7;
  string plan = 8;
}

// LoginRow is one session: when it was opened and from what.
message LoginRow {
  google.protobuf.Timestamp at = 1;
  string kind = 2;                             // web | mobile_refresh
  string client = 3;                           // the user agent, shortened
  bool live = 4;                               // not yet expired
}

message GetUserRequest {
  string user_id = 1;
}
message GetUserResponse {
  UserRow user = 1;
  repeated Membership memberships = 2;
  repeated LoginRow logins = 3;                // newest first
}

// WorkspaceRow is one workspace as the directory lists it.
message WorkspaceRow {
  string id = 1;
  string slug = 2;
  string name = 3;
  string kind = 4;                             // venture | agenture | service | environment
  string plan = 5;
  repeated string addons = 6;
  int32 people = 7;                            // active human members
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp last_active_at = 9;// the latest of its members
  string owner_email = 10;
  int32 agent_runs_30d = 11;
  double agent_cost_usd_30d = 12;              // what its agents cost us
  int64 agent_billed_cents_month = 13;         // what it is charged this month
}

message SearchWorkspacesRequest {
  string query = 1;                            // name, slug or a member's email
  int32 limit = 2;
  int32 offset = 3;
  string sort = 4;                             // newest (default) | active | usage | name
  string kind = 5;                             // empty is every kind
  string plan = 6;                             // empty is every plan
}
message SearchWorkspacesResponse {
  repeated WorkspaceRow workspaces = 1;
  int32 total = 2;
}

// MemberRow is one person in a workspace.
message MemberRow {
  string user_id = 1;
  string display_name = 2;
  string email = 3;
  string kind = 4;
  string role = 5;
  google.protobuf.Timestamp joined_at = 6;
  google.protobuf.Timestamp last_login_at = 7;
  google.protobuf.Timestamp last_active_at = 8;
  bool deactivated = 9;
}

// Feature is one thing a workspace can use, and whether it can.
message Feature {
  string key = 1;                              // premium | agent | shield | books | blueprint | atlas
  string label = 2;
  bool on = 3;
  google.protobuf.Timestamp since = 4;
}

message Subscription {
  string product = 1;
  string provider = 2;
  string status = 3;
  int32 seats = 4;
  string period_end = 5;
}

// DailyCount is one day of activity. Counts only.
message DailyCount {
  string day = 1;                              // YYYY-MM-DD, UTC
  int32 messages = 2;
  int32 active_people = 3;                     // distinct people who posted
  int32 agent_runs = 4;
  double agent_cost_usd = 5;
  int32 new_people = 6;                        // overview only
  int32 new_workspaces = 7;                    // overview only
}

// AgentRunRow is one run without its ask: what an agent was asked is the
// workspace's content and stays in the workspace.
message AgentRunRow {
  string id = 1;
  string agent_name = 2;
  string state = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp ended_at = 5;
  int64 minutes = 6;
  double cost_usd = 7;
}

message AgentUsage {
  int32 runs_30d = 1;
  int32 failed_30d = 2;
  int64 minutes_30d = 3;
  double cost_usd_30d = 4;
  double cost_usd_month = 5;
  int64 billed_cents_month = 6;
  int64 cap_cents = 7;                         // 0 is no cap
  repeated AgentRunRow recent = 8;
  repeated string agents = 9;                  // the agents it has, by name
}

message WorkspaceCounts {
  int32 treads = 1;
  int64 messages = 2;
  int32 files = 3;
  int32 boards = 4;
  int32 pages = 5;
}

message GetWorkspaceRequest {
  string workspace_id = 1;                     // or
  string slug = 2;
}
message GetWorkspaceResponse {
  WorkspaceRow workspace = 1;
  repeated MemberRow members = 2;
  repeated Feature features = 3;
  repeated Subscription subscriptions = 4;
  AgentUsage agent_usage = 5;
  repeated DailyCount days = 6;                // the last 30, oldest first
  WorkspaceCounts counts = 7;
}

message GetOverviewRequest {}
message GetOverviewResponse {
  int32 people = 1;
  int32 people_new_7d = 2;
  int32 people_active_1d = 3;
  int32 people_active_7d = 4;
  int32 workspaces = 5;
  int32 workspaces_new_7d = 6;
  int32 premium = 7;
  double agent_cost_usd_month = 8;
  int32 agent_runs_30d = 9;
  repeated DailyCount days = 10;               // the last 30, oldest first
  bool caller_is_root = 11;                    // may add and remove super admins
  repeated WorkspaceRow most_active = 12;      // the top few by last 7 days of messages
}

// SuperAdminRow is one person who may use this console.
message SuperAdminRow {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  bool root = 4;                               // named in the deployment; not removable here
  string added_by_email = 5;
  google.protobuf.Timestamp added_at = 6;
}

message ListSuperAdminsRequest {}
message ListSuperAdminsResponse {
  repeated SuperAdminRow admins = 1;
  bool caller_is_root = 2;
}
// AddSuperAdmin names an existing account. Root only.
message AddSuperAdminRequest {
  string email = 1;
}
message AddSuperAdminResponse {
  repeated SuperAdminRow admins = 1;
}
// RemoveSuperAdmin removes one added in the console. Root only; a root is not removable.
message RemoveSuperAdminRequest {
  string user_id = 1;
}
message RemoveSuperAdminResponse {
  repeated SuperAdminRow admins = 1;
}

// ---------------------------------------------------------------- Neural
//
// GetNeural is the console's view of TANK Neural: every Neuron the registry holds and
// what answers each field, the web index the model reads from, and what the model is
// being used for. Nothing in it is a workspace's content.

// NeuronRow is one Neuron as the registry holds it: a LoRA adapter on the base model.
message NeuronRow {
  string name = 1;                             // code | environments | books | chat | ws-<workspace id>
  string version = 2;                          // the training job that made it
  string kind = 3;                             // specialist | workspace
  string workspace_id = 4;                     // workspace Neurons only
  string workspace_slug = 5;
  string field = 6;                            // the sorter's field a specialist answers
  string state = 7;                            // candidate | approved | retired
  double eval_score = 8;                       // held-out improvement over the base; 0 when unscored
  string eval_note = 9;
  google.protobuf.Timestamp trained_at = 10;
  google.protobuf.Timestamp approved_at = 11;
  bool loaded = 12;                            // on the model server now
  int32 answers_30d = 13;                      // /ai replies it gave
  google.protobuf.Timestamp last_answered_at = 14;
}

// NeuronWorkspace is a workspace with the Private Neuron add-on and how close it is to
// its first Neuron: the nightly trainer needs `floor` dialogs before it trains one.
message NeuronWorkspace {
  string workspace_id = 1;
  string slug = 2;
  string name = 3;
  int32 dialogs = 4;
  int32 floor = 5;
  string neuron_state = 6;                     // none | candidate | approved
}

// FieldRow is one field the /ai sorter names and which Neuron answers it.
message FieldRow {
  string field = 1;
  int32 questions_30d = 2;
  string neuron = 3;                           // the approved specialist; "" when the base answers
}

message FeedRow {
  string url = 1;
  string kind = 2;                             // rss | sitemap
  int64 found = 3;
  google.protobuf.Timestamp last_fetched_at = 4;
  string last_error = 5;
}

message HostRow {
  string host = 1;
  int64 fetched = 2;
  int64 refused = 3;
  int32 robots_status = 4;
  int32 crawl_delay_ms = 5;
}

message SourceCount {
  string source = 1;                           // wikipedia | news | asked | list
  int64 pages = 2;
  int64 pages_24h = 3;
}

// WebIndex is the crawl as it stands: what is held, what is queued, what is flowing.
message WebIndex {
  int64 pages = 1;
  int32 hosts = 2;
  int32 feeds = 3;
  int64 queued = 4;
  int64 queued_due = 5;                        // due now and not claimed
  google.protobuf.Timestamp oldest_due = 6;
  int64 pages_1h = 7;                          // fetched or re-read
  int64 pages_24h = 8;
  repeated SourceCount sources = 9;
  repeated FeedRow feed_rows = 10;
  repeated HostRow host_rows = 11;             // the busiest
}

message NeuralDay {
  string day = 1;                              // YYYY-MM-DD, UTC
  int32 answers = 2;                           // /ai replies
  int32 people = 3;                            // distinct people asking
  int32 lookups = 4;
  int32 lookups_with_sources = 5;
  int64 input_tokens = 6;
  int64 output_tokens = 7;
  double cost_usd = 8;
  int64 pages_read = 9;                        // pages the index fetched or re-read
  int64 agent_tokens = 10;                     // tokens agents spent on TANK Neural
}

message NeuralUsage {
  int32 answers_30d = 1;
  int32 people_30d = 2;
  int32 lookups_30d = 3;
  int32 lookups_with_sources_30d = 4;
  int32 changed_30d = 5;                       // follow-ups that found the answer out of date
  int64 lookup_ms_avg = 6;
  int64 input_tokens_30d = 7;
  int64 output_tokens_30d = 8;
  double cost_usd_30d = 9;
  int32 agent_runs_30d = 10;                   // runs that used TANK Neural
  int64 agent_tokens_30d = 11;
  int32 thumbs_up_30d = 12;
  int32 thumbs_down_30d = 13;
}

message GetNeuralRequest {}
message GetNeuralResponse {
  string base_model = 1;                       // what the server calls the base
  bool server_up = 2;
  repeated string loaded = 3;                  // adapters the server holds now, by served name
  repeated NeuronRow neurons = 4;
  repeated NeuronWorkspace neuron_workspaces = 5;
  repeated FieldRow fields = 6;
  WebIndex web = 7;
  NeuralUsage usage = 8;
  repeated NeuralDay days = 9;                 // the last 30, oldest first
}

service PlatformService {
  rpc ListAgentures(ListAgenturesRequest) returns (ListAgenturesResponse);
  rpc SetAllocation(SetAllocationRequest) returns (SetAllocationResponse);
  rpc SetBoardSettings(SetBoardSettingsRequest) returns (SetBoardSettingsResponse);
  rpc StopRun(StopRunRequest) returns (StopRunResponse);
  rpc ListMerges(ListMergesRequest) returns (ListMergesResponse);
  rpc DecideMerge(DecideMergeRequest) returns (DecideMergeResponse);
  rpc ListDropCandidates(ListDropCandidatesRequest) returns (ListDropCandidatesResponse);

  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc SearchWorkspaces(SearchWorkspacesRequest) returns (SearchWorkspacesResponse);
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  rpc ListSuperAdmins(ListSuperAdminsRequest) returns (ListSuperAdminsResponse);
  rpc AddSuperAdmin(AddSuperAdminRequest) returns (AddSuperAdminResponse);
  rpc RemoveSuperAdmin(RemoveSuperAdminRequest) returns (RemoveSuperAdminResponse);

  rpc GetNeural(GetNeuralRequest) returns (GetNeuralResponse);
}
