syntax = "proto3";

package tank.apps.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/tactical-agent-neural-knowledge/contracts/gen/go/tank/apps/v1;appsv1";

// Apps published to Neural. A product built with TANK publishes itself by declaring
// `neural_app` in its tank.yaml and deploying; the agentic development kit gives it an MCP
// server that answers only TANK. A published app is public: anyone using Neural can connect
// it in a conversation, and the app is never told who is asking.

message App {
  // The product's slug.
  string id = 1;
  string name = 2;
  // What the app lets Neural read, in the app's words.
  string description = 3;
  // Served by the app itself.
  string logo_url = 4;
  // The app's public address.
  string url = 5;
  // The workspace that built it, by name.
  string maker = 6;
  // The app needs the person to sign in to it before Neural can read it (tank.yaml
  // neural_app.login). Its tools then answer for that person's account.
  bool requires_login = 7;
}

// AppAccount is the person's sign-in to an app that requires one. TANK keeps the app's token
// for them (encrypted, in the control plane); Neural never sees it.
message AppAccount {
  string app_id = 1;
  bool signed_in = 2;
  // How the app names the account ("robby@ketchell.dev"), from the app.
  string account_label = 3;
  google.protobuf.Timestamp signed_in_at = 4;
}

// One thing an app lets Neural read: an MCP tool.
message Tool {
  string name = 1;
  string description = 2;
  // The tool's input JSON schema, as the app declared it.
  string input_schema_json = 3;
  // Set when the tool is something Neural can offer to do on its own, from what is connected
  // (the kit's _meta "chat.tank/offer"). An offered tool is called with the person's position
  // as {"latitude": <number>, "longitude": <number>}, so its schema must take those two.
  Offer offer = 4;
}

// Offer is how a tool asks Neural to offer it (Robby, 2026-11-11: "Want me to display the
// wind over your camera so you can see the direction it is coming from?").
message Offer {
  // The offer as Neural says it, a question the person answers by tapping it.
  string text = 1;
  // What the conversation must have for the offer to make sense: "camera" (a phone camera
  // connected), "location" (a position from a connected device). Unknown needs are never met.
  repeated string needs = 2;
  // What the overlay it draws is called, shown on the camera with the app's name: "Wind".
  string title = 3;
}

// Mark is one thing drawn over the person's camera, placed by compass bearing. The phone
// turns it against its own compass, so it stays where it belongs as the person pans.
message Mark {
  // "from": something arriving from the bearing (wind, rain). "at": something that sits at
  // the bearing (the sunset, a place). "badge": a reading with no direction.
  string kind = 1;
  // Degrees clockwise from true north, [0, 360). Ignored for a badge.
  double bearing = 2;
  // Short, shown large: "14 km/h".
  string label = 3;
  // Shown under the label: "Gusts 25 km/h".
  string detail = 4;
  // Degrees above the horizon, for something in the sky; 0 on the horizon.
  double elevation = 5;
  // Kind "box": a rectangle on a screen or picture rather than a compass bearing (a webpage's
  // button, a spot on a camera still), as fractions of the image's width and height (0..1).
  double x = 6;
  double y = 7;
  double w = 8;
  double h = 9;
}

// Where a result came from, for the citation.
message Source {
  string title = 1;
  string url = 2;
}

message ListAppsRequest {
  // Matches name and description; empty lists every published app.
  string query = 1;
}
message ListAppsResponse {
  repeated App apps = 1;
}

message GetToolsRequest {
  string app_id = 1;
}
message GetToolsResponse {
  App app = 1;
  repeated Tool tools = 2;
}

// Calls one tool. Carries nothing about the person, workspace or conversation by design.
message CallToolRequest {
  string app_id = 1;
  string tool = 2;
  string arguments_json = 3;
  // For an app that requires login: whose account the call is made with. The control plane
  // attaches that person's token; without one the call is refused with "sign in".
  string user_id = 4;
}
message CallToolResponse {
  // At most 8 KB; longer results are cut and say so.
  string text = 1;
  repeated Source sources = 2;
  bool is_error = 3;
  // What the result draws over the camera (the kit's _meta "chat.tank/marks"), at most 12.
  repeated Mark marks = 4;
}
